      - operatorToken: []
      - operatorSession: []
      parameters:
      - { $ref: "#/components/parameters/MoneyUnit" }
      - name: Idempotency-Key
        in: header
        required: true
        schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
