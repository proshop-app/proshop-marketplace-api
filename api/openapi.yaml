  /api/v1/operator/moderation/cases/bulk-allow:
    post:
      tags: [moderation]
      summary: Одобрить до 200 дел одной атомарной пачкой
      description: >-
        Ровно один способ выбора. Пустой selector выбирает всю открытую очередь, любые причины и магазины.
        Фильтры tenantId/source/reason совпадают с очередью; reasons ограничивает все причины набором.
        При hasMore передайте nextAfter в selector.after следующего запроса с новым ключом.
        Idempotency-Key имеет формат unixMilliseconds:nonce. Повтор в течение 30 суток возвращает исходный итог.
        Просроченный ключ получает 409 moderation.idempotency_key_expired даже после удаления результата;
        повтор не выбирает новые дела. Результаты очищаются фоновым retention пачками.
        Конфликты отдельных дел возвращаются как пропуски. Заметка обязательна и общая для пачки.
      operationId: moderationBulkAllow
