          - paid
        paidOn:
          type: string
          format: date
        amountKopecks:
          type: integer
          format: int64
          minimum: 0
        document:
          type: string
        note:
          type: string
    InternalPromotionPlacement:
      type: object
      required:
      - code
      - surface
      - title
      - positions
      - slotLimit
      - positionPrices
      - defaultPriceKopecks
      - active
      - scope
      - version
      properties:
        code:
          type: string
        surface:
          type: string
          enum:
          - category_slot
          - search_slot
          - home_top_banner
          - home_feed_banner
          - category_banner
          - home_stores
          - store_card_slot
          - showcase
        title:
          type: string
        positions:
          type: array
          items:
            type: integer
        slotLimit:
          type: integer
          minimum: 1
        positionPrices:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        defaultPriceKopecks:
          type: integer
          format: int64
          minimum: 0
        active:
          type: boolean
        scope:
          type: string
          enum:
          - category
          - global
        version:
          type: integer
    InternalPromotionRefund:
      type: object
      required:
      - amountKopecks
      - 'on'
      description: Ручная запись возврата для stopped или finished; сумма не больше оплаты.
      properties:
        amountKopecks:
          type: integer
          format: int64
          minimum: 1
        'on':
          type: string
          format: date
        document:
          type: string
        note:
          type: string
    InternalQuote:
      type: object
      required:
      - status
      - cost
      - minDays
      - maxDays
      - expiresAt
      properties:
        status:
          type: string
          enum:
          - available
          - unavailable
        reason:
          type: string
          enum:
          - carrier_not_connected
          - pickup_point_unavailable
          - region_not_allowed
          - no_rate
          - seller_unreachable
          - seller_not_ready
          description: 'Только при status unavailable. Закрытый словарь docs/server-contract.md:

            carrier_not_connected — у продавца нет этого перевозчика;

