            application/json:
              schema:
                $ref: "#/components/schemas/SponsoredPage"
components:
  securitySchemes:
    serverApiToken:
      type: http
      scheme: bearer
      description: Отдельный SERVER_API_TOKEN для машинного API магазинов.
    operatorSession:
      type: apiKey
      in: cookie
      name: __Host-kvazar_operator
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-mp_access
      description: Сессия покупателя после входа по звонку.
    sessionBearer:
      type: http
      scheme: bearer
      description: Та же сессия заголовком — для серверного рендера витрины.
    operatorToken:
      type: http
      scheme: bearer
      description: Машинный токен OPERATOR_TOKEN; панель использует operatorSession.
    referenceReadToken:
      type: http
      scheme: bearer
      description: >-
        REFERENCE_READ_TOKEN — только чтение реестра (snapshot, resolve, entries);
        прав оператора площадки не даёт.
  parameters:
    TaxonomyCache:
      name: If-None-Match
      in: header
      schema: { type: string }
      description: 'ETag вида "taxonomy-1"; поддерживаются слабые ETag, списки и *'
    OfferId:
      name: offerId
      in: path
      required: true
      description: "<tenantId>~<productId>"
      schema: { type: string, examples: ["t1~p1"] }
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string }
    CheckoutId:
      name: checkoutId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReferenceDictionary:
      name: dict
      in: path
      required: true
      description: Код словаря реестра
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$", examples: [brand] }
    ReferenceEntryId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReferenceIfMatch:
      name: If-Match
      in: header
      required: true
      description: 'Ревизия записи из ETag: "12"'
      schema: { type: string }
  responses:
    ReferenceEntry:
      description: Запись реестра; ETag — её ревизия для If-Match
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReferenceEntryResponse" }
    Taxonomy:
      description: Текущий снимок таксономии; версия 0 и пустое дерево до первой загрузки
      headers:
        ETag: { schema: { type: string } }
        X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
        Cache-Control: { schema: { type: string }, description: public, max-age=0, must-revalidate }
      content:
        application/json:
          schema:
            type: object
            required: [version, categories]
            properties:
              version: { type: integer, format: int64, minimum: 0 }
              categories:
                type: array
                items: { $ref: "#/components/schemas/TaxonomyCategory" }
    EventConflict:
      description: >-
        Состояние или версия изменились — event содержит текущий снимок.
        IDEMPOTENCY_KEY_REUSED — тот же ключ использован с другим телом, событием или действием;
        event отсутствует. Новое решение и задача не созданы.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  event: { $ref: '#/components/schemas/ParkedEvent' }
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Cart:
      description: Корзина
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Cart" }
    Checkout:
      description: Покупка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Checkout" }
    Participant:
      description: Участник
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Participant" }
  schemas:
    BuyerRegionChoice:
      type: [object, "null"]
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string }
        name: { type: string, description: Игнорируется; берётся из справочника }
    BuyerPickupChoice:
      type: [object, "null"]
      required: [provider, code]
      additionalProperties: false
      properties:
        provider: { type: string }
        code: { type: string }
        address: { type: string, description: Игнорируется; берётся из справочника }
        regionCode: { type: string, description: Игнорируется; берётся из справочника }
    BuyerRegion:
      type: [object, "null"]
      required: [code, name]
      properties:
        code: { type: string, description: ISO 3166-2 из справочника доставки }
        name: { type: string, description: Каноническое имя; входное имя игнорируется }
    BuyerPickup:
      type: [object, "null"]
      required: [provider, code, address, regionCode]
      properties:
        provider: { type: string }
        code: { type: string }
        address: { type: string, description: Из справочника ПВЗ }
        regionCode: { type: string }
    BuyerNotifications:
      type: object
      additionalProperties: false
      required: [priceDrops, shopNews]
      properties:
        priceDrops: { type: boolean }
        shopNews: { type: boolean }
    BuyerNotificationsPatch:
      type: object
      additionalProperties: false
      properties:
        priceDrops: { type: boolean }
        shopNews: { type: boolean }
    BuyerProfilePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        region:
          $ref: "#/components/schemas/BuyerRegionChoice"
        pickupPoint:
          $ref: "#/components/schemas/BuyerPickupChoice"
        notifications:
          $ref: "#/components/schemas/BuyerNotificationsPatch"
    BuyerProfile:
      type: object
      additionalProperties: false
      required: [name, region, pickupPoint, notifications, alerts]
      properties:
        name: { type: string, maxLength: 200 }
        region:
          $ref: "#/components/schemas/BuyerRegion"
        pickupPoint:
          $ref: "#/components/schemas/BuyerPickup"
        notifications:
          $ref: "#/components/schemas/BuyerNotifications"
        alerts:
          type: object
          required: [priceDrops]
          properties:
            priceDrops:
              type: [integer, "null"]
              minimum: 0
              description: Число снижений цены; null при недоступности ценовых контекстов платформы.
    BuyerRegionResult:
      type: object
      required: [code, name, source]
      properties:
        code: { type: [string, "null"] }
        name: { type: [string, "null"] }
        source: { type: string, enum: [profile, pickup, ip, none] }
    BuyerFavorite:
      description: Снятое предложение сохраняет карточку, listed=false и нулевой остаток.
      allOf:
        - $ref: "#/components/schemas/Offer"
        - type: object
          required: [listed]
          properties:
            listed: { type: boolean }
    BuyerFavorites:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BuyerFavorite"
        total: { type: integer, minimum: 0 }
    BuyerWatchTarget:
      type: object
      additionalProperties: false
      properties:
        targetPrice: { type: [integer, "null"], format: int64, minimum: 0 }
    BuyerPriceWatch:
      type: object
      required: [offer, priceAtWatch, currentPrice, dropped]
      properties:
        offer:
          $ref: "#/components/schemas/Offer"
        priceAtWatch: { type: integer, format: int64, minimum: 0 }
        currentPrice:
          type: [integer, "null"]
          format: int64
          description: null у снятого предложения; dropped тогда false
        targetPrice: { type: integer, format: int64, minimum: 0 }
        dropped:
          type: boolean
          description: Текущая цена ниже priceAtWatch и, при заданной цели, не выше targetPrice.
    BuyerPriceWatches:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BuyerPriceWatch"
    BuyerSubscriptions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShopCard"
    StoreCategory:
      type: object
      required: [id, name, count]
      properties:
        id: { type: string }
        name: { type: string }
        count: { type: integer, minimum: 0 }
    StoreProduct:
      type: object
      required: [offerId, productId, name, price, image]
      properties:
        offerId: { type: string }
        productId: { type: string }
        name: { type: string }
        price: { type: integer, format: int64, minimum: 0 }
        image: { type: [string, "null"] }
    StoreHidden:
      type: object
      required: [key, reason, at]
      properties:
        key: { type: string, enum: [slogan, logo] }
        reason: { type: string }
        at: { type: string, format: date-time }
    StoreSummary:
      type: object
      required: [offers, fromPrice, categories, uncategorized, showcase, hidden, rating, badge, rank]
      properties:
        offers: { type: integer, minimum: 0 }
        fromPrice: { type: [integer, "null"], format: int64, minimum: 0 }
        categories: { type: array, items: { $ref: "#/components/schemas/StoreCategory" } }
        uncategorized: { type: integer, minimum: 0 }
        showcase: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/StoreProduct" } }
        hidden: { type: array, items: { $ref: "#/components/schemas/StoreHidden" } }
        rating: { $ref: "#/components/schemas/Rating" }
        badge: { type: "null" }
        rank: { type: "null" }
    ShopHeader:
      type: object
      required: [tenantId, slug, name, slogan, logo, initial, color, offers, isNew, categories, rating, showcase, subscribers]
      properties:
        rating: { $ref: "#/components/schemas/Rating" }
        subscribers: { type: integer, minimum: 0 }
        subscribed: { type: boolean, description: Только для вошедшего покупателя }
        tenantId: { type: string }
        slug: { type: string }
        name: { type: string }
        slogan: { type: string }
        logo: { type: [string, "null"] }
        initial: { type: string }
        color: { type: object, required: [card], properties: { card: { type: string } } }
        offers: { type: integer, minimum: 0 }
        isNew: { type: boolean, const: true }
        categories: { type: array, items: { $ref: "#/components/schemas/StoreCategory" } }
        showcase: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/ShopImage" } }
    ShopCard:
      type: object
      required: [tenantId, slug, name, slogan, logo, initial, color, offers, isNew, category, moreCategories, fromPrice, showcase, rating]
      properties:
        tenantId: { type: string }
        slug: { type: string }
        name: { type: string }
        slogan: { type: string }
        logo: { type: [string, "null"] }
        initial: { type: string }
        color: { type: object, required: [card], properties: { card: { type: string } } }
        offers: { type: integer, minimum: 0 }
        isNew: { type: boolean, const: true }
        category: { type: [object, "null"], required: [id, name], properties: { id: { type: string }, name: { type: string } } }
        moreCategories: { type: integer, minimum: 0 }
        fromPrice: { type: [integer, "null"], format: int64, minimum: 0 }
        showcase: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/ShopImage" } }
        rating: { $ref: "#/components/schemas/Rating" }
    ShopImage:
      type: object
      required: [offerId, image]
      properties:
        offerId: { type: string }
        image: { type: [string, "null"] }
    ShopPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ShopCard" } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
    ParticipationStage:
      type: string
      enum: [candidate, connected, returned, disconnected]
    ParticipationDecision:
      type: [object, "null"]
      required: [reason, note, at, operator]
      properties:
        reason:
          type: [object, "null"]
          properties:
            code: { type: string }
            message: { type: string }
        note: { type: string }
        at: { type: string, format: date-time }
        operator:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
    Participation:
      type: object
      required: [stage, awaitingReview, deliveryValid, lastDecision]
      properties:
        stage: { $ref: "#/components/schemas/ParticipationStage" }
        awaitingReview: { type: boolean }
        deliveryValid: { type: boolean }
        lastDecision: { $ref: "#/components/schemas/ParticipationDecision" }
    PromotionKind:
      type: string
      enum:
      - sponsored_slot
      - banner
      - showcase
    PromotionStatus:
      type: string
      enum:
      - draft
      - review
      - approved
      - active
      - finished
      - rejected
      - stopped
    PromotionAction:
      type: string
      enum:
      - submit
      - approve
      - reject
      - revise
      - refund
      - pay
      - finish
      - stop
    PromotionPeriod:
      type: object
      required:
      - from
      - to
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
    PromotionTarget:
      type: object
      required:
      - offerId
      properties:
        offerId:
          type: string
        categoryId:
          type: string
        saleId:
          type: string
        storeId:
          type: string
    PromotionMarking:
      type: object
      required:
      - advertiser
      properties:
        advertiser:
          type: string
        inn:
          type: string
          pattern: '^([0-9]{10}|[0-9]{12})$'
        erid:
          type: string
    PromotionRefund:
      type: object
      required: [amountKopecks, 'on']
      description: Ручная запись возврата для stopped или finished; сумма не больше оплаты.
      properties:
        amountKopecks:
          type: integer
          format: int64
          minimum: 1
        'on':
          type: string
          format: date
        document:
          type: string
        note:
          type: string
    PromotionPayment:
      type: object
      required:
      - status
      properties:
        refund:
          $ref: "#/components/schemas/PromotionRefund"
        status:
          type: string
          enum:
          - pending
          - paid
        paidOn:
          type: string
          format: date
        amountKopecks:
          type: integer
          format: int64
          minimum: 0
        document:
          type: string
        note:
          type: string
    PromotionStatsSummary:
      type: object
      required:
      - impressions
      - clicks
      - ctr
      properties:
        impressions:
          type: integer
          format: int64
          minimum: 0
        clicks:
          type: integer
          format: int64
          minimum: 0
        ctr:
          type: number
          description: Процент кликов от показов; ноль без показов.
    PromotionStatsRow:
      type: object
      required:
      - day
      - position
      - impressions
      - clicks
      properties:
        day:
          type: string
          format: date
        position:
          type: integer
        impressions:
          type: integer
          format: int64
          minimum: 0
        clicks:
          type: integer
          format: int64
          minimum: 0
    PromotionDecision:
      type: object
      required:
      - at
      - actor
      - action
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
          enum:
          - operator
          - tenant
          - system
        action:
          type: string
          enum:
          - submit
          - approve
          - reject
          - revise
          - refund
          - pay
          - finish
          - stop
          - activate
        note:
          type: string
    PromotionDecisionInput:
      type: object
      required:
      - action
      - expectedVersion
      properties:
        action:
          $ref: "#/components/schemas/PromotionAction"
        expectedVersion:
          type: integer
        note:
          type: string
        erid:
          type: string
        refund:
          $ref: "#/components/schemas/PromotionRefund"
        payment:
          type: object
          required:
          - amountKopecks
          - paidOn
          properties:
            amountKopecks:
              type: integer
              format: int64
              minimum: 0
            paidOn:
              type: string
              format: date
            note:
              type: string
              description: Примечание к оплате.
            document:
              type: string
    PromotionTenantInput:
      type: object
      required:
      - placementCode
      - position
      - offerId
      - from
      - weeks
      properties:
        marking:
          type: object
          additionalProperties: false
          description: advertiser и inn обязательны при submit; erid запрещён.
          properties:
            advertiser:
              type: string
            inn:
              type: string
              pattern: '^([0-9]{10}|[0-9]{12})$'
        placementCode:
          type: string
        position:
          type: integer
        offerId:
          type: string
        from:
          type: string
          format: date
        weeks:
          type: integer
          minimum: 1
          maximum: 520
        title:
          type: string
    PromotionVersionInput:
      type: object
      required:
      - expectedVersion
      properties:
        expectedVersion:
          type: integer
        note:
          type: string
    PromotionPlacement:
      type: object
      required:
      - code
      - surface
      - title
      - positions
      - slotLimit
      - positionPrices
      - defaultPriceKopecks
      - active
      - scope
      - version
      properties:
        code:
          type: string
        surface:
          type: string
          enum:
          - category_slot
          - search_slot
          - home_top_banner
          - home_feed_banner
          - category_banner
          - home_stores
          - store_card_slot
          - showcase
        title:
          type: string
        positions:
          type: array
          items:
            type: integer
