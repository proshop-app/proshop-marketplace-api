openapi: 3.1.0
info:
  title: Proshop Marketplace API
  version: 0.5.0
  description: |
    API федеративного маркетплейса для витрины (Nuxt 4) и панели оператора
    (Vue 3). Публичные денежные поля и priceMin/priceMax — JSON-числа рублей с максимум двумя
    знаками после точки, от 0 до 9999999999999.99. Внутренние /api/v1/internal и межсервисные
    контракты сохраняют целые копейки. Публичный ответ /api/v1 содержит заголовок
    X-Marketplace-Money-Unit: RUB; денежные маршруты требуют его также в запросе,
    иначе 409 api.money_unit_required до выполнения операции. Время — RFC 3339 в UTC. Ошибка —
    `{"error": {"code": "<ключ>", "message": "<текст>"}}`; код ответа
    выбирается по классу ошибки: invalid → 400, unauthorized → 401, forbidden → 403,
    not_found → 404, conflict → 409, too_many_requests → 429,
    unavailable → 503, internal → 500. Ключ ошибки стабилен, текст — для
    человека. Идентификатор запроса — заголовок `X-Request-Id` (входящий,
    если по формату, иначе выданный сервером).
servers:
  - url: http://localhost:8080
    description: make dev
tags:
  - name: internal
    description: Машинный API сервера
  - name: moderation
  - name: service
  - name: taxonomy
  - name: catalog
  - name: buyer
  - name: auth
  - name: cart
  - name: delivery
  - name: checkout
  - name: operator
  - name: reference
    description: |
      Реестр справочных сущностей для бэкендов платформы (сервер магазина, поиск).
      Чтение — токен читателя REFERENCE_READ_TOKEN, мутации — OPERATOR_TOKEN или сессия
      оператора; браузеру токены не выдаются.
      Снимки несут schemaVersion и revision, поля только добавляются.
      Контракт — docs/reference.md.
paths:
  /api/v1/buyer/profile:
    get:
      tags: [buyer]
      operationId: getBuyerProfile
      summary: Профиль и число снижений цены
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200":
          description: Ответ; Cache-Control private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerProfile"
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    patch:
      tags: [buyer]
      operationId: patchBuyerProfile
      summary: Изменить профиль покупателя
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyerProfilePatch"
      responses:
        "200":
          description: Ответ; Cache-Control private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerProfile"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/city:
    get:
      tags: [buyer]
      operationId: detectCity
      summary: Канонический город по локальной DB-IP после гидрации
      responses:
        "200":
          description: Подсказка; Cache-Control private, no-store
          content:
            application/json:
              schema:
                type: object
                required: [city, country]
                properties:
                  city: { type: string }
                  country: { type: string }
                  label: { type: string }
                  region: { type: string }
                  regionCode: { type: string, description: ISO 3166-2 }
                  fiasId: { type: string }
                  kladrId: { type: string }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/delivery/cities:
    get:
      tags: [buyer]
      operationId: suggestCities
      summary: Справочник городов назначения через сервер платформы
      parameters:
        - name: value
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        "200":
          description: Подсказки городов
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [city, label]
                      properties:
                        city: { type: string }
                        label: { type: string }
                        region: { type: string }
                        fiasId: { type: string }
                        kladrId: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/region:
    get:
      tags: [buyer]
      operationId: getBuyerRegion
      summary: Подсказка региона покупателя
      security: [{}, { sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200":
          description: Ответ; Cache-Control private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerRegionResult"
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/buyer/favorites:
    get:
      tags: [buyer]
      operationId: listBuyerFavorites
      summary: Страница избранных предложений
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "200":
          description: Ответ; Cache-Control private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerFavorites"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/buyer/price-watches:
    get:
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
      tags: [buyer]
      operationId: listBuyerPriceWatches
      summary: Наблюдения за ценами
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "200":
          description: Ответ; Cache-Control private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerPriceWatches"
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/buyer/subscriptions/shops:
    get:
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
      tags: [buyer]
      operationId: listBuyerShopSubscriptions
      summary: Публичные магазины в подписках
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "200":
          description: Ответ; Cache-Control private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerSubscriptions"
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/buyer/favorites/{offerId}:
    put:
      tags: [buyer]
      operationId: putBuyerFavorite
      summary: Добавить предложение в избранное
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Состояние сохранено; повтор идемпотентен
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [buyer]
      operationId: deleteBuyerFavorite
      summary: Удалить предложение из избранного
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Состояние сохранено; повтор идемпотентен
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/buyer/price-watches/{offerId}:
    put:
      tags: [buyer]
      operationId: putBuyerPriceWatch
      summary: Следить за ценой или изменить цель
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - name: offerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyerWatchTarget"
      responses:
        "204":
          description: Состояние сохранено; повтор идемпотентен
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [buyer]
      operationId: deleteBuyerPriceWatch
      summary: Прекратить наблюдение за ценой
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Состояние сохранено; повтор идемпотентен
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/buyer/subscriptions/shops/{tenantId}:
    put:
      tags: [buyer]
      operationId: putBuyerShopSubscription
      summary: Подписаться на магазин
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Состояние сохранено; повтор идемпотентен
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      tags: [buyer]
      operationId: deleteBuyerShopSubscription
      summary: Отписаться от магазина
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Состояние сохранено; повтор идемпотентен
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/shops:
    get:
      tags: [catalog]
      operationId: listShops
      summary: Магазины с готовой карточкой
      security: []
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - { name: category, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "200":
          description: Карточка магазина
          headers:
            ETag: { schema: { type: string }, description: Версия публичного снимка }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopPage" }
        "304":
          description: Снимок не изменился (If-None-Match)
          headers:
            ETag: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/shops/{slug}:
    get:
      tags: [catalog]
      operationId: getShop
      summary: Публичная шапка магазина
      description: >-
        Для вошедшего добавляется subscribed, ответ private, no-store. Анонимный ответ
        публичный с ETag; недействительный вход считается анонимным. Vary — Cookie, Authorization.
      security: [{}, { sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Карточка магазина
          headers:
            ETag: { schema: { type: string }, description: Версия публичного снимка }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopHeader" }
        "304":
          description: Снимок не изменился (If-None-Match)
          headers:
            ETag: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/internal/tenants/{tenantId}/store-card:
    get:
      tags: [internal]
      operationId: getStoreCard
      summary: Сводка карточки для сервера
      security: [{ serverApiToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "200":
          description: Карточка магазина
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/internal/tenants/{tenantId}/settings/sync:
    post:
      tags: [internal]
      operationId: syncStoreSettings
      summary: Поставить внеочередную сверку настроек
      security: [{ serverApiToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "202": { description: Сверка поставлена в outbox }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}/card/hide:
    post:
      tags: [operator]
      operationId: hideStoreCard
      summary: Скрыть пункт карточки с причиной
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - { $ref: "#/components/parameters/TenantId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, reason]
              properties:
                key: { type: string, enum: [logo] }
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: Карточка магазина
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}/card/hide/{key}:
    delete:
      tags: [operator]
      operationId: showStoreCard
      summary: Снять скрытие пункта карточки
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - { $ref: "#/components/parameters/TenantId" }
        - { name: key, in: path, required: true, schema: { type: string, enum: [logo] } }
      responses:
        "200":
          description: Карточка магазина
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}/return:
    post:
      tags: [operator]
      summary: Вернуть кандидата с замечаниями
      operationId: returnParticipant
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - { $ref: "#/components/parameters/TenantId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                reason:
                  type: object
                  required: [code]
                  properties:
                    code: { type: string, description: Код moderation_reasons }
                note: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/internal/tenants/{tenantId}/status:
    get:
      tags: [internal]
      summary: Текущие статусы предложений и участия магазина
      operationId: getTenantStatuses
      security: [{ serverApiToken: [] }]
      description: >-
        SERVER_API_TOKEN; пустая настройка — 404, неверный Bearer — 401.
        Тот же расчёт, что в событиях статусов. С ids читаются только товары, participant — null.
        Без ids читается только участник, items — пустой массив.
        Неизвестные и удалённые товары пропускаются, отсутствующий участник — null.
        Запрос ничего не сохраняет и не публикует.
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
        - name: ids
          in: query
          description: От 1 до 200 непустых id товаров через запятую; дубли удаляются; participant — null.
          schema: { type: string }
      responses:
        "200":
          description: Текущая обратная связь площадки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceStatusSnapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/internal/tenants/{tenantId}/participation:
    get:
      tags: [internal]
      summary: Состояние участия магазина
      operationId: getParticipation
      security: [{ serverApiToken: [] }]
      description: SERVER_API_TOKEN; пустая настройка — 404, отсутствующий или неверный Bearer — 401.
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "200":
          description: Участие магазина
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/internal/tenants/{tenantId}/participation/submit:
    post:
      tags: [internal]
      summary: Отправить возвращённого кандидата оператору снова
      operationId: submitParticipation
      security: [{ serverApiToken: [] }]
      description: SERVER_API_TOKEN; пустая настройка — 404, отсутствующий или неверный Bearer — 401.
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "200":
          description: Участие магазина
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/moderation/cases:
    get:
      tags:
      - moderation
      summary: Очередь дел по времени открытия по убыванию
      operationId: moderationGetApiVOperatorModerationCases
      security:
      - operatorToken: []
      - operatorSession: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                - limit
                - offset
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModerationCase'
                  total: &id001
                    type: integer
                    format: int64
                  limit: *id001
                  offset: *id001
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: moderation.case_conflict с текущим делом; moderation.case_stale; IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationConflict'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - { $ref: "#/components/parameters/MoneyUnit" }
      - &id005
        name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      - &id006
        name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: open
          enum:
          - open
          - allowed
          - rejected
          - superseded
          - all
      - name: tenantId
        in: query
        required: false
        schema: &id002
