    get:
      tags: [taxonomy]
      summary: Дерево категорий площадки со ссылками на схемы
      operationId: taxonomyCategories
      parameters:
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200": { $ref: "#/components/responses/Taxonomy" }
        "304": { description: Версия не изменилась }
  /api/v1/taxonomy/categories/{id}/schema:
    get:
      tags: [taxonomy]
      summary: Полная схема категории без наследования
      operationId: taxonomySchema
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200":
          description: Категория; ETag и X-Taxonomy-Version как у дерева
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyCategorySchema" }
        "304": { description: Версия не изменилась }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/taxonomy/attributes:
    get:
      tags: [taxonomy]
      summary: Снимок глобальных атрибутов
      operationId: taxonomyAttributes
      parameters:
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200":
          description: Данные одной версии набора
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema:
                type: object
                required: [version, attributes]
                properties:
                  version: { type: integer, format: int64 }
                  attributes:
                    type: array
                    items: { $ref: "#/components/schemas/TaxonomyAttribute" }
        "304": { description: Версия не изменилась }
  /api/v1/taxonomy/schemas:
    get:
      tags: [taxonomy]
      summary: Снимок схем
      operationId: taxonomySchemas
      parameters:
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200":
          description: Данные одной версии набора
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema:
                type: object
                required: [version, schemas]
                properties:
                  version: { type: integer, format: int64 }
                  schemas:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/TaxonomySchema" }
        "304": { description: Версия не изменилась }
  /api/v1/taxonomy/version:
    get:
      tags: [taxonomy]
      summary: Текущая версия; 0 до первой загрузки
      operationId: taxonomyVersion
      parameters:
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200":
          description: Версия таксономии; ETag и X-Taxonomy-Version
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyVersion" }
        "304": { description: Версия не изменилась }
  /api/v1/operator/taxonomy:
    get:
      tags: [operator]
      summary: Прочитать текущую версию таксономии
      operationId: operatorTaxonomy
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200":
          description: Весь нормализованный набор; ETag одной версии
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyDefinition" }
        "304": { description: Версия не изменилась }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/operator/taxonomy/{part}:
    get:
      tags: [operator]
      summary: Скачать часть набора для обратной загрузки
      operationId: downloadTaxonomyPart
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - name: part
          in: path
          required: true
          schema: { type: string, enum: [categories, attributes, schemas] }
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200":
          description: Один YAML-документ; attributes не содержит вычисляемых values и required
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/yaml:
              schema: { type: string }
        "304": { description: Версия не изменилась }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [operator]
      summary: Заменить часть набора и перепроверить карточки
      operationId: loadTaxonomyPart
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - name: part
          in: path
          required: true
          schema: { type: string, enum: [categories, attributes, schemas] }
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"taxonomy-[0-9]+"$' }
      description: |
        Один строгий YAML-документ до 2 МиБ. Якоря, ссылки и неизвестные поля запрещены.
        Часть соединяется с двумя текущими; проверяются все ссылки и словари реестра.
        Новая версия равна текущей + 1. Устаревший If-Match — 409; отсутствующий или неверный — 400.
        Код нельзя удалить, type, unit и dictionary неизменны.
        Значения confirmed закрытых словарей сохраняются в снимке.
        Ошибочные карточки скрываются, индекс обновляется через outbox.
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string, description: Список категорий, список атрибутов без values или словарь схем }
      responses:
        "200":
          description: Версия опубликована
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/catalog/offers/{offerId}/publication:
    get:
      tags: [operator]
      summary: Диагностика публикации из проекции, включая скрытые предложения
      operationId: offerPublication
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/OfferId" }
      responses:
        "200":
          description: Состояние проверки последней проекции
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorPublication" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /health:
    get:
      tags: [service]
      summary: Состояние зависимостей
      operationId: health
      responses:
        "200":
          description: Все зависимости отвечают
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Какая-то зависимость не отвечает
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /metrics:
    get:
      tags: [service]
      summary: Метрики Prometheus
      operationId: metrics
      responses:
        "200":
          description: Текстовый формат Prometheus
          content:
            text/plain:
              schema: { type: string }
  /api/v1/catalog/offers/{offerId}/reviews:
    get:
      tags: [catalog]
      operationId: listOfferReviews
      summary: Опубликованные отзывы видимого предложения
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 9999, default: 0 }
      responses:
        "200":
          description: "Ответ не персональный: Cache-Control: public, max-age=30; limit + offset не больше 10000."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPage" }
        "400": { description: Некорректная пагинация }
        "404": { description: Предложение скрыто или отсутствует }
        "503": { description: Сервер магазина недоступен }
  /api/v1/recommendations:
    get:
      tags: [catalog]
      operationId: listRecommendations
      summary: Рекомендации по категории и цене либо интересам покупателя
      description: >-
        offer — та же категория, цена ±40%, с исключением всей группы вариантов исходного товара, другой магазин впереди; при отсутствии других остаются товары исходного магазина.
        home — категории интересов с исключением купленного; без интересов популярные по salesCount.
        deliveryRegion ограничивает все виды рекомендаций; неизвестный регион — 400.
        Для гостя и вошедшего Cache-Control: private, no-store.
      parameters:
        - name: context
          in: query
          required: true
          schema: { type: string, enum: [home, offer] }
        - name: offerId
          in: query
          description: Обязателен только для context=offer.
          schema: { type: string }
        - name: deliveryRegion
          in: query
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Предложения и причина рекомендации.
          content:
            application/json:
              schema:
                type: object
                required: [items, reason]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Offer" } }
                  reason: { type: string, enum: [similar, personal, popular] }
        "400": { description: Некорректный контекст или параметры }
        "404": { description: Исходное предложение недоступно }
  /api/v1/catalog/offers:
    get:
      tags: [catalog]
      summary: Выдача предложений
      description: |
        Только опубликованные предложения. category — узел дерева площадки, включая потомков.
        Канонические фильтры: attr.<код>=значение; повтор параметра означает OR,
        разные коды — AND. Для number: attr.<код>.min и attr.<код>.max (включительно),
        либо точное значение. Неизвестный код, неверный тип/словарь/диапазон — 400.
        Пример: ?category=c1&attr.a1=v1&attr.a1=v2&attr.a2.min=1.5&attr.a2.max=10.
        Фасеты считаются по всей отфильтрованной выдаче до пагинации. Атрибутные —
        только при facet=true и покрытии >=20%; category, tenant, price, inStock — всегда.
        Числа: min/max; остальные: до 256 наиболее частых значений с count.
        Для пустой выдачи универсальные фасеты пусты, атрибутные отсутствуют.
      operationId: listOffers
      parameters:
        - name: deliveryCarrier
          in: query
          schema: { type: string }
          description: Код перевозчика; передаётся вместе с deliveryRegion.
        - name: deliveryRegion
          in: query
          schema: { type: string }
          description: Код ISO 3166-2 RU из ПВЗ.
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Строка поиска }
        - { name: tenant, in: query, schema: { type: string }, description: Магазин }
        - { name: groupId, in: query, schema: { type: string }, description: Группа вариантов; требует tenant }
        - { name: category, in: query, schema: { type: string }, description: Категория площадки с потомками }
        - { name: priceMin, in: query, schema: { type: integer, format: int64, minimum: 0 }, description: Копейки }
        - { name: priceMax, in: query, schema: { type: integer, format: int64, minimum: 0 }, description: Копейки }
        - { name: inStock, in: query, schema: { type: boolean } }
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, price_asc, price_desc, newest, rating], default: relevance }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: "offset + limit ≤ 10000" }
      responses:
        "200":
          description: Страница выдачи
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferPage" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/catalog/offers/{offerId}:
    get:
      tags: [catalog]
      summary: Карточка предложения
      operationId: getOffer
      parameters:
        - name: deliveryCarrier
          in: query
          schema: { type: string }
          description: Код перевозчика; передаётся вместе с deliveryRegion.
        - name: deliveryRegion
          in: query
          schema: { type: string }
          description: Код ISO 3166-2 RU из ПВЗ.
        - $ref: "#/components/parameters/OfferId"
      responses:
        "200":
          description: Карточка с описанием
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/auth/call:
    post:
      tags: [auth]
      summary: Начать вход по звонку
      description: |
        Покупатель получает номер, на который нужно позвонить со своего
        телефона. Лимиты: по телефону и по адресу покупателя.
      operationId: startLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, examples: ["+7 (925) 123-45-67"] }
      responses:
        "201":
          description: Проверка заведена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Challenge" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/call/check:
    post:
      tags: [auth]
      summary: Состояние проверки звонком
      description: |
        Клиент опрашивает раз в 2–3 секунды. Когда звонок подтверждён,
        ответ ставит куку сессии `__Host-mp_session` (Secure, HttpOnly,
        SameSite=Lax) и содержит покупателя; токен в тело не попадает.
        Сессия выдаётся по проверке один раз: повтор — 409 buyer.challenge_used.
      operationId: checkLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId]
              properties:
                challengeId: { type: string, format: uuid }
      responses:
        "200":
          description: Состояние; при входе — Set-Cookie и покупатель
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "__Host-mp_session=…; Path=/; Secure; HttpOnly; SameSite=Lax"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/refresh:
    post:
      operationId: refreshBuyerAccess
      summary: Обновить JWT по HttpOnly cookie __Host-mp_key
      description: Refresh-токен хранится только на backend. Access JWT не позволяет продлевать доступ.
      responses:
        "200":
          description: Обновлённый профиль и exp; JWT устанавливается в защищённой cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Buyer"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Выйти
      operationId: logout
      responses:
        "204":
          description: Сессия завершена, кука стёрта
  /api/v1/auth/webhooks/smsru:
    post:
      tags: [auth]
      summary: Оповещение sms.ru о проверке звонком
      description: |
        Служебный адрес для шлюза. Форма с записями `data[N]` вида
        «callcheck_status\n<check_id>\n<код>\n<время>». Состояние
        перечитывается у шлюза, телу не верим. Ответ — «100».
      operationId: smsruWebhook
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        "200":
          description: Принято
          content:
            text/plain:
              schema: { type: string, const: "100" }
  /api/v1/me:
    get:
      tags: [auth]
      summary: Покупатель сессии
      operationId: me
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200":
          description: Покупатель
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/cart:
    get:
      tags: [cart]
      summary: Корзина покупателя
      description: Нет корзины или она просрочена — пустая.
      operationId: getCart
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/cart/lines:
    post:
      tags: [cart]
      summary: Положить предложение
      description: То же предложение складывает количества; остаток сверяется с каталогом.
      operationId: addCartLine
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [offerId, quantity]
              properties:
                offerId: { type: string, examples: ["t1~p1"] }
                quantity: { type: integer, minimum: 1, maximum: 999 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/cart/lines/{offerId}:
    put:
      tags: [cart]
      summary: Задать количество
      description: Ноль убирает строку.
      operationId: setCartLineQuantity
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/OfferId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0, maximum: 999 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [cart]
      summary: Убрать строку
      operationId: removeCartLine
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/OfferId"
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/cart/verify:
    post:
      tags: [cart]
      summary: Перепроверить у магазинов
      description: Цена и наличие спрашиваются у каждого магазина; строки получают пометку issue.
      operationId: verifyCart
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/delivery/carriers:
    get:
      tags: [delivery]
      summary: Подключённые перевозчики
      description: Для переключателя карты; карта показывает пункты одного перевозчика.
      operationId: listCarriers
      responses:
        "200":
          description: Перевозчики
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Carrier" }
  /api/v1/delivery/pickup-points:
    get:
      tags: [delivery]
      summary: Пункты выдачи перевозчика
      description: Ровно одно из двух — область карты или город.
      operationId: listPickupPoints
      parameters:
        - { name: carrier, in: query, required: true, schema: { type: string, examples: [cdek, yandex] } }
        - name: bbox
          in: query
          description: "minLon,minLat,maxLon,maxLat в градусах"
          schema: { type: string, examples: ["37.5,55.6,37.8,55.9"] }
        - { name: city, in: query, schema: { type: string }, description: Город словами перевозчика, без учёта регистра }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: Пункты
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PickupPoint" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/checkout:
    post:
      tags: [checkout]
      summary: Собрать покупку из корзины
      description: Повтор с тем же Idempotency-Key отдаёт ту же покупку.
      operationId: createCheckout
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_:.-]{8,128}$" }
      responses:
        "201": { $ref: "#/components/responses/Checkout" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}:
    get:
      tags: [checkout]
      summary: Покупка
      operationId: getCheckout
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/delivery/quotes:
    post:
      tags: [checkout]
      summary: Выбрать пункт выдачи и посчитать доставку
      description: |
        Расчёт спрашивается у каждого продавца покупки по его договору.
        Продавец, который не везёт, получает quote.status unavailable с
        причиной из словаря (`reason`); не ответивший, ответивший не по
        контракту или выключивший участие — reason seller_unreachable.
      operationId: quoteCheckoutDelivery
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [carrier, pickupPointCode]
              properties:
                carrier: { type: string }
                pickupPointCode: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/confirm:
    post:
      tags: [checkout]
      summary: Подтвердить покупку
      description: |
        Цены и наличие перепроверяются у магазинов, устаревшая доставка
        пересчитывается. Изменились цены — 409 checkout.changed: покупка уже
        обновлена, её нужно перечитать и подтвердить заново. Подтверждённая
        покупка отдаётся как есть.
      operationId: confirmCheckout
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants:
    get:
      tags: [operator]
      summary: Участники
      operationId: listParticipants
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { name: trust, in: query, schema: { type: string, enum: [probation, trusted] } }
        - { name: stage, in: query, schema: { $ref: "#/components/schemas/ParticipationStage" } }
        - { name: queue, in: query, schema: { type: boolean }, description: Кандидаты с awaitingReview и валидной доставкой }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Страница участников
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [operator]
      summary: Завести участника
      description: Магазин должен быть в зеркале реестра платформы. Новый участник скрыт.
      operationId: createParticipant
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenantId, name]
              properties:
                tenantId: { type: string }
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}:
    get:
      tags: [operator]
      summary: Участник
      operationId: getParticipant
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}/enable:
    post:
      tags: [operator]
      summary: Показать участника в каталоге
      operationId: enableParticipant
      description: Любой переход в connected без готовой карточки — 409 participant.card_not_ready.
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                note: { type: string, maxLength: 2000 }
      responses:
        "200": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}/disable:
    post:
      tags: [operator]
      summary: Скрыть участника из каталога
      operationId: disableParticipant
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                reason: { type: string }
                note: { type: string, minLength: 1, maxLength: 2000, description: Непустая после TrimSpace. }
      responses:
        "200": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/orders:
    post:
      tags: [checkout]
      summary: Создать независимые заказы и получить первую ссылку
      description: Сначала обновляются все расчёты и настройки. Новая плата — 409 DELIVERY_CHANGED с checkout и новыми итогами, заказов нет.
      operationId: createCheckoutOrders
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact]
              additionalProperties: false
              properties:
                contact:
                  type: object
                  required: [phone, name]
                  additionalProperties: false
                  properties:
                    phone: { type: string }
                    name: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/groups/{groupId}/pay:
    post:
      tags: [checkout]
      summary: Ссылка только для текущей группы до окончания её окна
      description: Более поздняя awaiting_payment — 409 PAYMENT_ORDER; GET и pay не обходят NextPollAt.
      operationId: payCheckoutGroup
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ссылка на кассу магазина
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/return:
    get:
      tags: [checkout]
      summary: Экран проверки оплаты; параметры кассы не подтверждают оплату
      operationId: checkoutPaymentReturn
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200":
          description: Проверяем оплату; клиент опрашивает GET checkout
          content:
            application/json:
              schema:
                type: object
                required: [status, message, checkoutId]
                properties:
                  status: { type: string, const: checking_payment }
                  message: { type: string }
                  checkoutId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/orders:
    get:
      tags: [checkout]
      summary: Покупки владельца со статусами групп, треками и ПВЗ
      operationId: listBuyerOrders
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: after
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: До 100 покупок; next — последний ID для следующей страницы
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/operator/checkouts:
    get:
      tags: [operator]
      summary: Покупки с группами; stuck=true — ожидают оплату не менее 15 минут
      operationId: listOperatorCheckouts
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - name: after
          in: query
          schema: { type: string, format: uuid }
        - name: stuck
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: До 100 покупок; next — последний ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/delivery/settings:
    get:
      tags: [delivery]
      summary: Действующий минимальный процент субсидии продавца для PR-A1
      operationId: getDeliverySettings
      security: []
      description: Настройка продавца ниже порога принимается; нижняя граница применяется после maxAmount.
      responses:
        "200":
          description: Публичные правила доставки площадки
          content:
            application/json:
              schema:
                type: object
                required: [deliverySubsidyMinPercent]
                properties:
                  deliverySubsidyMinPercent:
                    type: integer
                    minimum: 0
                    maximum: 100
                    default: 30
                    description: DELIVERY_SUBSIDY_MIN_PERCENT; действующая субсидия — max настройки с потолком и процента cost.

  /internal/reference:
    get:
      tags: [reference]
      summary: Доступные словари и их ревизии
      operationId: referenceDiscovery
      security: [{ referenceReadToken: [] }, { operatorToken: [] }, { operatorSession: [] }]
      responses:
        "200":
          description: Список словарей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceDiscovery" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/internal/reference:
    get:
      tags: [reference]
      summary: Доступные словари и их ревизии
      operationId: referenceDiscoveryV1
      security: [{ referenceReadToken: [] }, { operatorToken: [] }, { operatorSession: [] }]
      responses:
        "200":
          description: Список словарей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceDiscovery" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/internal/reference/{dict}/snapshot:
    get:
      tags: [reference]
      summary: Снимок словаря — полный или дельта после since
      operationId: referenceSnapshotV1
      security: [{ referenceReadToken: [] }, { operatorToken: [] }, { operatorSession: [] }]
      description: |
        Без since, со since старше горизонта журнала (30 дней) или впереди головы — полный
        снимок (full: true). Иначе дельта: текущие записи, затронутые после since, и
        удалённые id. Потребитель сверяет normalizer со своей копией правила ключа.
      parameters:
        - { $ref: "#/components/parameters/ReferenceDictionary" }
        - name: since
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: scope
          in: query
          description: Только global; частный слой магазина — следующий этап
          schema: { type: string, enum: [global] }
      responses:
        "200":
          description: Снимок
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceSnapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/internal/reference/{dict}/entries/{id}:
    get:
      tags: [reference]
      summary: Запись по id; объединённая отдаётся вместе с выжившей
      operationId: referenceEntryV1
      security: [{ referenceReadToken: [] }, { operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ReferenceDictionary" }
        - { $ref: "#/components/parameters/ReferenceEntryId" }
      responses:
        "200": { $ref: "#/components/responses/ReferenceEntry" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /internal/reference/{dict}/snapshot:
    get:
      tags: [reference]
      summary: Снимок словаря — полный или дельта после since
      operationId: referenceSnapshot
      security: [{ referenceReadToken: [] }, { operatorToken: [] }, { operatorSession: [] }]
      description: |
        Без since, со since старше горизонта журнала (30 дней) или впереди головы — полный
        снимок (full: true). Иначе дельта: текущие записи, затронутые после since, и
        удалённые id. Потребитель сверяет normalizer со своей копией правила ключа.
      parameters:
        - { $ref: "#/components/parameters/ReferenceDictionary" }
        - name: since
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: scope
          in: query
          description: Только global; частный слой магазина — следующий этап
          schema: { type: string, enum: [global] }
      responses:
        "200":
          description: Снимок
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceSnapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /internal/reference/{dict}/resolve:
    post:
      tags: [reference]
      summary: Разрешить написание в запись словаря
      operationId: referenceResolve
      security: [{ referenceReadToken: [] }, { operatorToken: [] }, { operatorSession: [] }]
      description: |
        Точное совпадение ключа варианта даёт match с confidence exact. Иначе до 10
        кандидатов по префиксу и триграммам; нечёткое совпадение никогда не привязывается
        само. Объединённая запись разрешается в выжившую, rejected и deprecated — не match.
        Тело не больше 4 КиБ, text — до 200 символов. tenantId проверяется по формату и
        пока не влияет на ответ.
      parameters:
        - { $ref: "#/components/parameters/ReferenceDictionary" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string, maxLength: 200 }
                tenantId: { type: string }
      responses:
        "200":
          description: Совпадение или кандидаты
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceResolution" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/reference/{dict}/entries:
    get:
      tags: [reference]
      summary: Страница записей; очередь кандидатов — status=candidate
      operationId: referenceEntries
      security: [{ referenceReadToken: [] }, { operatorToken: [] }, { operatorSession: [] }]
      description: Порядок — по частоте встреч, затем по ключу.
      parameters:
        - { $ref: "#/components/parameters/ReferenceDictionary" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ReferenceStatus" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Страница записей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceEntryPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [reference]
      summary: Завести запись — кандидата или подтверждённую
      operationId: referenceCreateEntry
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      description: |
        Каноническое имя становится первым вариантом. Кандидат с занятым ключом не
        заводится второй раз: у владельца ключа растёт счётчик встреч, ответ 200 с
        created: false. Подтверждённая запись с занятым ключом и кандидат с занятым
        ключом, присланный с aliases или metadata, — 409 REFERENCE_KEY_TAKEN: варианты
        не теряются молча, их добавляют к записи-владельцу.
      parameters:
        - { $ref: "#/components/parameters/ReferenceDictionary" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canonical]
              additionalProperties: false
              properties:
                canonical: { type: string, maxLength: 120 }
                status: { type: string, enum: [candidate, confirmed], default: candidate }
                source: { type: string, enum: [operator, catalog], default: operator }
                aliases:
                  type: array
                  maxItems: 49
                  items: { $ref: "#/components/schemas/ReferenceAliasInput" }
                metadata: { $ref: "#/components/schemas/ReferenceMetadata" }
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ReferenceEntry" }
        "201": { $ref: "#/components/responses/ReferenceEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/reference/{dict}/entries/{id}:
    get:
      tags: [reference]
      summary: Запись по id; объединённая отдаётся вместе с выжившей
      operationId: referenceEntry
      security: [{ referenceReadToken: [] }, { operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ReferenceDictionary" }
        - { $ref: "#/components/parameters/ReferenceEntryId" }
      responses:
        "200": { $ref: "#/components/responses/ReferenceEntry" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [reference]
      summary: Переименовать, сменить статус или свободные поля по ревизии
      operationId: referenceUpdateEntry
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      description: |
        Переходы статуса: candidate → confirmed | rejected, confirmed → deprecated.
        Прежнее каноническое написание остаётся вариантом. Устаревший If-Match —
        409 REFERENCE_ENTRY_CHANGED.
      parameters:
        - { $ref: "#/components/parameters/ReferenceDictionary" }
        - { $ref: "#/components/parameters/ReferenceEntryId" }
        - { $ref: "#/components/parameters/ReferenceIfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                canonical: { type: string, maxLength: 120 }
                status: { type: string, enum: [confirmed, rejected, deprecated] }
                metadata: { $ref: "#/components/schemas/ReferenceMetadata" }
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ReferenceEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/reference/{dict}/entries/{id}/merge:
    post:
      tags: [reference]
      summary: Объединить запись в выжившую
      operationId: referenceMergeEntry
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      description: |
        Обе записи подтверждены. Варианты переходят к выжившей с теми же id, запись
        получает merged и навсегда разрешается в выжившую. Записи, ранее объединённые в
        эту, переносятся на выжившую той же ревизией. If-Match — ревизия записи {id}.
        Ответ — выжившая запись.
      parameters:
        - { $ref: "#/components/parameters/ReferenceDictionary" }
        - { $ref: "#/components/parameters/ReferenceEntryId" }
        - { $ref: "#/components/parameters/ReferenceIfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [into]
              additionalProperties: false
              properties:
                into: { type: string, format: uuid }
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ReferenceEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/reference/{dict}/entries/{id}/aliases:
    post:
