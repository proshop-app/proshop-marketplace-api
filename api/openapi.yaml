        code: { type: string }
        kind: { type: string, enum: [open, closed] }
        revision: { type: integer, format: int64, minimum: 0 }
        entries: { type: integer, format: int64, minimum: 0 }
        candidates: { type: integer, format: int64, minimum: 0 }
    ReferenceDictionaryList:
      type: object
      additionalProperties: false
      required: [schemaVersion, dictionaries]
      properties:
        schemaVersion: { type: integer, const: 1 }
        dictionaries:
          type: array
          items: { $ref: "#/components/schemas/ReferenceDictionarySummary" }
    ReferenceImportSource:
      type: object
      additionalProperties: false
      required: [id, url, license]
      properties:
        id: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,127}$' }
        url: { type: string, format: uri, pattern: '^https://', maxLength: 2048 }
        license: { type: string, minLength: 1, maxLength: 256 }
        version: { type: string, maxLength: 256 }
    ReferenceImportAlias:
      type: object
      additionalProperties: false
      required: [text]
      description: Существующий DeliveryAlias; kind по умолчанию spelling, source=seed.
      properties:
        text: { type: string, minLength: 1, maxLength: 120 }
        kind: { $ref: "#/components/schemas/ReferenceAliasKind" }
        locale: { type: string }
    ReferenceImportEntry:
      type: object
      additionalProperties: false
      required: [canonical]
      properties:
        canonical: { type: string, minLength: 1, maxLength: 120, description: Не больше 8 слов }
        status: { type: string, enum: [candidate, confirmed], default: candidate }
        aliases:
          type: array
          maxItems: 49
          items: { $ref: "#/components/schemas/ReferenceImportAlias" }
        metadata:
          type: object
          additionalProperties: true
          description: До 4 КиБ вместе с provenance. sourceId обязателен при нескольких sources.
    ReferenceImportDictionary:
      type: object
      additionalProperties: false
      required: [code, kind, release, entries]
      description: Пустой entries допустим только для open; closed требует хотя бы одну запись.
      if:
        properties:
          kind: { const: closed }
      then:
        properties:
          entries: { minItems: 1 }
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$' }
        kind: { type: string, enum: [open, closed] }
        release: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        entries:
          type: array
          minItems: 0
          maxItems: 100000
          items: { $ref: "#/components/schemas/ReferenceImportEntry" }
    ReferenceImportPackage:
      type: object
      additionalProperties: false
      required: [schemaVersion, sources, dictionaries]
      properties:
        schemaVersion: { type: integer, const: 1 }
        sources:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: "#/components/schemas/ReferenceImportSource" }
        dictionaries:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: "#/components/schemas/ReferenceImportDictionary" }
    ReferenceImportDictionaryResult:
      type: object
      additionalProperties: false
      required: [code, created, release, revision, changed, createdEntries, updatedEntries, skippedEntries]
      properties:
        code: { type: string }
        created: { type: boolean }
        release: { type: integer, format: int64 }
        revision: { type: integer, format: int64 }
        changed: { type: boolean }
        createdEntries: { type: integer, minimum: 0 }
        updatedEntries: { type: integer, minimum: 0 }
        skippedEntries: { type: integer, minimum: 0 }
    ReferenceImportResult:
      type: object
      additionalProperties: false
      required: [schemaVersion, dictionaries]
      properties:
        schemaVersion: { type: integer, const: 1 }
        dictionaries:
          type: array
          items: { $ref: "#/components/schemas/ReferenceImportDictionaryResult" }

    ReferenceStatus:
      type: string
      enum: [candidate, confirmed, merged, deprecated, rejected]
    ReferenceAliasKind:
      type: string
      enum: [spelling, translit, abbreviation, former, locale]
    ReferenceMetadata:
      type: object
      additionalProperties: true
      description: Свободные поля записи до 4 КиБ; directions — подсказка направлений, только массив строк.
      properties:
        directions:
          type: array
          items: { type: string }
        baseColors:
          type: array
          maxItems: 2
          uniqueItems: true
          description: >-
            Только для color: 1–2 значения палитры у подтверждённого оттенка.
            У базового цвета родителей нет.
          items: { type: string }
    ReferenceAliasInput:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 120, description: Не больше 8 слов }
        kind: { $ref: "#/components/schemas/ReferenceAliasKind" }
        locale: { type: string, examples: [ru, en] }
        weight: { type: integer, minimum: 0, maximum: 100 }
    ReferenceAlias:
      type: object
      required: [id, text, key, kind, source, weight]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        key: { type: string, description: Ключ нормализации; уникален в словаре }
        kind: { $ref: "#/components/schemas/ReferenceAliasKind" }
        locale: { type: string }
        source: { type: string }
        weight: { type: integer }
    ReferenceEntry:
      type: object
      required: [id, dictionary, canonical, key, status, source, occurrences, revision, metadata, aliases, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        dictionary: { type: string }
        canonical: { type: string }
        key: { type: string }
        status: { $ref: "#/components/schemas/ReferenceStatus" }
        mergedInto: { type: string, format: uuid }
        source: { type: string, enum: [seed, operator, catalog] }
        occurrences: { type: integer, format: int64, description: Встречи ключа; ранжирует очередь кандидатов }
        revision: { type: integer, format: int64, description: Ревизия, последней менявшая запись }
        metadata: { $ref: "#/components/schemas/ReferenceMetadata" }
        aliases:
          type: array
          items: { $ref: "#/components/schemas/ReferenceAlias" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReferenceEntryResponse:
      type: object
      required: [schemaVersion, revision, entry]
      properties:
        schemaVersion: { type: integer, const: 1 }
        revision: { type: integer, format: int64, description: Голова журнала словаря }
        created: { type: boolean }
        changed: { type: boolean, description: false — повтор без новой ревизии }
        entry: { $ref: "#/components/schemas/ReferenceEntry" }
        resolved: { $ref: "#/components/schemas/ReferenceEntry" }
        alias: { $ref: "#/components/schemas/ReferenceAlias" }
    ReferenceReviewIDsSelection:
      type: object
      additionalProperties: false
      required: [mode, ids]
      properties:
        mode: { type: string, const: ids }
        ids:
          type: array
          minItems: 1
          maxItems: 10000
          uniqueItems: true
          items: { type: string, format: uuid }
    ReferenceReviewAllCandidatesSelection:
      type: object
      additionalProperties: false
      required: [mode, excludedIds]
      properties:
        mode: { type: string, const: allCandidates }
        excludedIds:
          type: array
          maxItems: 10000
          uniqueItems: true
          items: { type: string, format: uuid }
    ReferenceReviewSelection:
      oneOf:
        - { $ref: "#/components/schemas/ReferenceReviewIDsSelection" }
        - { $ref: "#/components/schemas/ReferenceReviewAllCandidatesSelection" }
      discriminator:
        propertyName: mode
        mapping:
          ids: "#/components/schemas/ReferenceReviewIDsSelection"
          allCandidates: "#/components/schemas/ReferenceReviewAllCandidatesSelection"
    ReferenceReviewRequest:
      type: object
      additionalProperties: false
      required: [status, selection]
      properties:
        status: { type: string, enum: [confirmed, rejected] }
        selection: { $ref: "#/components/schemas/ReferenceReviewSelection" }
        reason: { type: string }
    ReferenceReviewResult:
      type: object
      additionalProperties: false
      required: [schemaVersion, dictionary, revision, changed]
      properties:
        schemaVersion: { type: integer, const: 1 }
        dictionary: { type: string }
        revision: { type: integer, format: int64, minimum: 0 }
        changed: { type: integer, minimum: 0, maximum: 10000 }
    ReferenceEntryPage:
      type: object
      required: [schemaVersion, revision, total, entries]
      properties:
        schemaVersion: { type: integer, const: 1 }
        revision: { type: integer, format: int64 }
        total: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/ReferenceEntry" }
    ReferenceDiscovery:
      type: object
      required: [schemaVersion, dictionaries]
      properties:
        schemaVersion: { type: integer, const: 1 }
        dictionaries:
          type: array
          items:
            type: object
            required: [code, kind, revision]
            properties:
              code: { type: string }
              kind: { type: string, enum: [open, closed] }
              revision: { type: integer, format: int64 }
    ReferenceSnapshot:
      type: object
      required: [schemaVersion, dictionary, kind, revision, normalizer, full, entries, removed]
      properties:
        schemaVersion: { type: integer, const: 1 }
        dictionary: { type: string }
        kind: { type: string, enum: [open, closed] }
        revision: { type: integer, format: int64 }
        normalizer: { type: string, examples: [v1] }
        full: { type: boolean }
        entries:
          type: array
          items:
            type: object
            required: [id, canonical, key, status, aliases, directions, order]
            properties:
              id: { type: string, format: uuid }
              canonical: { type: string }
              directions:
                type: array
                items: { type: string }
              order: { type: integer, default: 0 }
              label: { type: string }
              meta: { $ref: "#/components/schemas/TaxonomyValueMeta" }
              key: { type: string }
              status: { $ref: "#/components/schemas/ReferenceStatus" }
              mergedInto: { type: string, format: uuid }
              aliases:
                type: array
                items:
                  type: object
                  required: [text, key, kind]
                  properties:
                    text: { type: string }
                    key: { type: string }
                    kind: { $ref: "#/components/schemas/ReferenceAliasKind" }
        removed:
          type: array
          items: { type: string, format: uuid }
    ReferenceMatch:
      type: object
      required: [entryId, canonical, aliasKey, status, scope, weight]
      properties:
        entryId: { type: string, format: uuid }
        canonical: { type: string }
        aliasKey: { type: string }
        status: { $ref: "#/components/schemas/ReferenceStatus" }
        scope: { type: string, enum: [global] }
        confidence: { type: string, enum: [exact] }
        weight: { type: number, minimum: 0, maximum: 1 }
    ReferenceResolution:
      type: object
      required: [schemaVersion, dictionary, revision, normalizer, key, candidates]
      properties:
        schemaVersion: { type: integer, const: 1 }
        dictionary: { type: string }
        revision: { type: integer, format: int64 }
        normalizer: { type: string }
        key: { type: string }
        match: { $ref: "#/components/schemas/ReferenceMatch" }
        candidates:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ReferenceMatch" }
    ReferenceChangedEvent:
      type: object
      description: |
        Тело catalog.reference.changed (KAFKA_TOPIC_REFERENCE_CHANGED), ключ сообщения — код словаря.
        Списки обрезаются на 1000; truncated — потребитель перечитывает дельту снимка.
      required: [schemaVersion, dictionary, revisionFrom, revisionTo, entryIds, kinds, affectedKeys, truncated]
      properties:
        schemaVersion: { type: integer, const: 1 }
        dictionary: { type: string }
        revisionFrom: { type: integer, format: int64 }
        revisionTo: { type: integer, format: int64 }
        entryIds:
          type: array
          maxItems: 1000
          items: { type: string, format: uuid }
        kinds:
          type: array
          items: { type: string, enum: [alias-added, alias-removed, renamed, merged, status-changed] }
        affectedKeys:
          type: array
          maxItems: 1000
          items: { type: string }
        truncated: { type: boolean }
    InternalCheckout:
      type: object
      required:
      - paymentStarted
      - confirmationRequired
      - creationComplete
      - id
      - status
      - groups
      - delivery
      - goodsTotal
      - deliveryTotal
      - total
      - version
      - createdAt
      - updatedAt
      - confirmedAt
      properties:
        confirmationRequired:
          type: boolean
          description: Новый состав требует подтверждения, включая покупку с уже оплаченными группами.
        paymentStarted:
          type: boolean
          description: Исход отправленного платежа ещё не подтверждён; отмена недоступна до сверки.
        creationComplete:
          type: boolean
          description: Все группы получили итог создания; витрина прекращает опрос ожидания.
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - draft
          - confirmed
          - creating_orders
          - awaiting_payment
          - partially_paid
          - paid
          - cancelled
        groups:
          type: array
          items:
            $ref: '#/components/schemas/InternalCheckoutGroup'
        delivery:
          oneOf:
          - $ref: '#/components/schemas/Selection'
          - type: 'null'
        goodsTotal:
          type: integer
          format: int64
        deliveryTotal:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        confirmedAt:
          type:
          - string
          - 'null'
          format: date-time
    InternalCheckoutGroup:
      type: object
      required:
      - reconciliationRequired
      - tenantId
      - externalCheckoutId
      - lines
      - goods
      - quote
      - status
      - deliveryPrice
      - returnFailed
      - pollFailures
      - nextPollAt
      - createFailures
      - createExhausted
      - seller
      - tracking
      properties:
        creationStatus:
          type: string
          enum: [creating, created, unconfirmed, rejected]
          description: Результат создания группы; созданный заказ остаётся created после отмены или истечения.
        reconciliationRequired:
          type: boolean
          description: Ожидается cancel-by-checkout; cancelled/absent снимает сверку. ORDER_NOT_CANCELLABLE оставляет её с причиной для оператора.
        creationDeadline:
          type: string
          format: date-time
          description: Срок 15 секунд от намерения; закрытие ждёт завершения активной аренды попытки (запас до 100 ms).
        seller:
          $ref: '#/components/schemas/OrderSeller'
        tracking:
          $ref: '#/components/schemas/OrderTracking'
        tenantId:
          type: string
        paymentHold:
          type: string
          enum: [moderation_pending, publication_paused, payment_expired]
          description: Текущая проверка товара приостанавливает оплату до восстановления или expiresAt, не меняя состав.
        status:
          type: string
          description: cancellation_requested — отказ покупателя; cancelled — отмена подтверждена магазином.
          enum:
          - ''
          - creating_order
          - creation_expired
          - delivery_requoted
          - unconfirmed
          - cancellation_requested
          - rejected
          - awaiting_payment
          - paid
          - cancelled
          - assembled
          - shipped
          - awaiting_pickup
          - delivered
          - returned
          - seller_unreachable
          - price_changed
          - delivery_unavailable
        orderId:
          type: string
        orderNumber:
          type: string
          maxLength: 64
          description: Номер заказа магазина для покупателя; нет, пока магазин его не сообщил.
        steps:
          type: array
          maxItems: 8
          description: >-
            Путь заказа до текущего статуса по часам магазина; служебные шаги схлопнуты.
            Пусто — магазин путь ещё не сообщил, время шагов площадка не выдумывает.
          items:
            type: object
            required: [status, at]
            properties:
              status:
                type: string
                enum: [awaiting_payment, paid, assembled, shipped, awaiting_pickup, delivered, returned, cancelled]
              at:
                type: string
                format: date-time
        returnRequest:
          type: [object, 'null']
          description: Заявка покупателя на возврат; согласие магазина — статус returned.
          required: [status, reason, requestedAt]
          properties:
            status:
              type: string
              enum: [requested, rejected]
            reason:
              type: string
              enum: [not_fit, defective, not_as_described, changed_mind]
            requestedAt:
              type: string
              format: date-time
            resolvedAt:
              type: string
              format: date-time
            comment:
              type: string
              maxLength: 500
              description: Объяснение отказа магазина.
        expiresAt:
          type: string
          format: date-time
          description: >-
            Действующий срок оплаты группы — удержание, если установлено,
            иначе единый срок покупки (10 минут от намерения).
        deliveryPrice:
          type: integer
          format: int64
          minimum: 0
          description: Доставка группы в составе единого платежа; 0 — строка доставки скрыта
        reason:
          type: string
        returnFailed:
          type: boolean
        returnReason:
          type: string
        returnRemaining:
          type: array
          items:
            type: object
            required:
            - offerId
            - quantity
            properties:
              offerId:
                type: string
              quantity:
                type: integer
                minimum: 1
        pollFailures:
          type: integer
          minimum: 0
          maximum: 5
        nextPollAt:
          type: string
          format: date-time
        createFailures:
          type: integer
          minimum: 0
          maximum: 5
        createExhausted:
          type: boolean
        cancellationAttempts:
          type: integer
          minimum: 0
          description: Число начатых вызовов команды отмены магазина.
        cancellationLastErrorCode:
          type: string
          description: Последняя ошибка отмены; очищается при подтверждённой отмене.
        lastErrorCode:
          type: string
        currentPrices:
          type: array
          items:
            type: object
            required:
            - productId
            - price
            properties:
              productId:
                type: string
              price:
                type: integer
                format: int64
                minimum: 0
        externalCheckoutId:
          type: string
          description: <checkoutId>:<tenantId> — ключ заказа у магазина
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InternalCheckoutLine'
        goods:
          type: integer
          format: int64
        quote:
          oneOf:
          - $ref: '#/components/schemas/InternalQuote'
          - type: 'null'
    InternalCheckoutLine:
      type: object
      required:
      - offerId
      - productId
      - name
      - quantity
      - price
      - amount
      properties:
        offerId:
          type: string
        productId:
          type: string
        name:
          type: string
        quantity:
          type: integer
        price:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
          description: Сумма после скидок в копейках
    InternalError:
      type: object
      required:
      - error
      properties:
        weeks:
          type: array
          description: Занятые понедельники при promotion.no_capacity.
          items:
            type: string
            format: date
        checkout:
          $ref: '#/components/schemas/InternalCheckout'
          description: Новый снимок при DELIVERY_CHANGED; требуется подтверждение.
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              examples:
              - catalog.offer_not_found
            message:
              type: string
    InternalPromotionCampaign:
      type: object
      required:
      - title
      - tenantId
      - kind
      - placementCode
      - position
      - target
      - period
      - priceKopecks
      - marking
      - id
      - tenantName
      - payment
      - status
      - version
      - createdAt
      - updatedAt
      - stats
      properties:
        rejectionReason:
          type: string
          description: Причина отказа; очищается при revise.
        title:
          type: string
        tenantId:
          type: string
        kind:
          $ref: '#/components/schemas/PromotionKind'
        placementCode:
          type: string
        position:
          type: integer
        target:
          $ref: '#/components/schemas/PromotionTarget'
        period:
          $ref: '#/components/schemas/PromotionPeriod'
        priceKopecks:
          type: integer
          format: int64
          minimum: 0
          description: Снимок прайса. При создании и правке вычисляется сервером.
        marking:
          $ref: '#/components/schemas/PromotionMarking'
        id:
          type: string
          format: uuid
        tenantName:
          type: string
        payment:
          $ref: '#/components/schemas/InternalPromotionPayment'
        status:
          $ref: '#/components/schemas/PromotionStatus'
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        stats:
          $ref: '#/components/schemas/PromotionStatsSummary'
    InternalPromotionCampaignPage:
      type: object
      required:
      - counts
      - items
      - total
      - limit
      - offset
      properties:
        counts:
          $ref: '#/components/schemas/PromotionCounts'
        items:
          type: array
          items:
            $ref: '#/components/schemas/InternalPromotionCampaign'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    InternalPromotionPayment:
      type: object
      required:
      - status
      properties:
        refund:
          $ref: '#/components/schemas/InternalPromotionRefund'
        status:
          type: string
          enum:
