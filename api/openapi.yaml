                limit: {type: integer, minimum: 1, maximum: 100, default: 100}
      responses:
        '200':
          description: Возвращённые id и следующий курсор
          content:
            application/json:
              schema: &outboxRetryResponse
                type: object
                required: [ids, after]
                properties:
                  ids: {type: array, items: {type: string}}
                  after: {type: string}
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/operator/outbox/failures/{taskId}/retry:
