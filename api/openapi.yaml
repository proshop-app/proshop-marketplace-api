openapi: 3.1.0
info:
  title: Proshop Marketplace API
  version: 0.4.0
  description: |
    API федеративного маркетплейса для витрины (Nuxt 4) и панели оператора
    (Vue 3). Все суммы — целые копейки. Время — RFC 3339 в UTC. Ошибка —
    `{"error": {"code": "<ключ>", "message": "<текст>"}}`; код ответа
    выбирается по классу ошибки: invalid → 400, unauthorized → 401, forbidden → 403,
    not_found → 404, conflict → 409, too_many_requests → 429,
    unavailable → 503, internal → 500. Ключ ошибки стабилен, текст — для
    человека. Идентификатор запроса — заголовок `X-Request-Id` (входящий,
    если по формату, иначе выданный сервером).
servers:
  - url: http://localhost:8080
    description: make dev
tags:
  - name: service
  - name: taxonomy
  - name: catalog
  - name: auth
  - name: cart
  - name: delivery
  - name: checkout
  - name: operator
paths:
  /api/v1/operator/session:
    post:
      tags:
      - operator
      operationId: operatorLogin
      security: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
          headers:
            Set-Cookie:
              description: __Host-kvazar_operator=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=<TTL>.
                Без Domain.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
      description: 'HTTPS, Origin = OPERATOR_ORIGIN и X-Requested-With: KvazarOperator обязательны. Argon2id, лимиты
        IP/логина/сервиса. Ротация прежней cookie.'
    get:
      tags:
      - operator
      operationId: operatorSession
      security:
      - operatorSession: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - operator
      operationId: operatorLogout
      security:
      - operatorSession: []
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '204':
          description: Сессия отозвана; cookie удалена с теми же атрибутами и Max-Age=0.
  /api/v1/operator/participants/{tenantId}/delivery:
    put:
      tags:
      - operator
      operationId: updateParticipantDelivery
      security: &id001
      - operatorToken: []
      - operatorSession: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - version
              - delivery
              properties:
                version:
                  type: integer
                  format: int64
                  minimum: 1
                delivery:
                  $ref: '#/components/schemas/ParticipationDelivery'
      description: Сверяет version атомарно. PATCH участника по-прежнему меняет только name. Плановая сверка с магазином
        заменяет покрытие его авторитетными настройками.
  /api/v1/operator/events:
    get:
      tags:
      - operator
      operationId: parkedEvents
      security: *id001
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkedEventPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: tenantId
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - parked
          - queued
          - resolved
      - name: type
        in: query
        required: false
        schema:
          type: string
          description: Точное полное имя Kafka-топика
      - name: reason
        in: query
        required: false
        schema:
          type: string
      description: Порядок id DESC. Все статусы по умолчанию. Ответ {items,total,limit,offset}; отличается от массива
        в раннем черновике панели. payload содержит только безопасные метаданные, error — ключ причины без сырого
        текста.
  /api/v1/operator/events/{eventId}/retry:
    post:
      tags:
      - operator
      operationId: retryParkedEvent
      security: *id001
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkedEvent'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/EventConflict'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: >-
          Необязательный ключ оператора, действующий 24 часа после успешного решения.
          Повтор для того же события, действия и тела (expectedVersion и note) возвращает
          первоначальный ответ 200, даже если событие уже изменилось. Порядок полей JSON несущественен.
          Другое тело, событие или действие с тем же ключом — 409 IDEMPOTENCY_KEY_REUSED.
          Без ключа применяется только проверка expectedVersion. Ошибки не сохраняются.
        schema:
          type: string
          minLength: 1
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - note
              - expectedVersion
              properties:
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Версия из последнего прочитанного ParkedEvent.
                note:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: После удаления пробелов заметка непустая.
      description: Только из parked при совпадении expectedVersion; устаревший запрос без сохранённого ключа — 409 с текущим event.
        Аудит автора/времени/заметки. Retry атомарно ставит outbox с версией решения и отдельным бюджетом попыток;
        queued не означает успех, после ошибки событие возвращается в parked.
  /api/v1/operator/events/{eventId}/resolve:
    post:
      tags:
      - operator
      operationId: resolveParkedEvent
      security: *id001
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkedEvent'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/EventConflict'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: >-
          Необязательный ключ оператора, действующий 24 часа после успешного решения.
          Повтор для того же события, действия и тела (expectedVersion и note) возвращает
          первоначальный ответ 200, даже если событие уже изменилось. Порядок полей JSON несущественен.
          Другое тело, событие или действие с тем же ключом — 409 IDEMPOTENCY_KEY_REUSED.
          Без ключа применяется только проверка expectedVersion. Ошибки не сохраняются.
        schema:
          type: string
          minLength: 1
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - note
              - expectedVersion
              properties:
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Версия из последнего прочитанного ParkedEvent.
                note:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: После удаления пробелов заметка непустая.
      description: Только из parked при совпадении expectedVersion; устаревший запрос без сохранённого ключа — 409 с текущим event.
        Аудит автора/времени/заметки. Retry атомарно ставит outbox с версией решения и отдельным бюджетом попыток;
        queued не означает успех, после ошибки событие возвращается в parked.
  /api/v1/taxonomy/categories:
    get:
      tags: [taxonomy]
      summary: Дерево категорий площадки и полные схемы
      operationId: taxonomyCategories
      parameters:
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200": { $ref: "#/components/responses/Taxonomy" }
        "304": { description: Версия не изменилась }
  /api/v1/taxonomy/categories/{id}/schema:
    get:
      tags: [taxonomy]
      summary: Полная схема категории без наследования
      operationId: taxonomySchema
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200":
          description: Категория; ETag и X-Taxonomy-Version как у дерева
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyCategory" }
        "304": { description: Версия не изменилась }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/taxonomy/version:
    get:
      tags: [taxonomy]
      summary: Текущая версия; 0 до первой загрузки
      operationId: taxonomyVersion
      parameters:
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200":
          description: Версия таксономии; ETag и X-Taxonomy-Version
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyVersion" }
        "304": { description: Версия не изменилась }
  /api/v1/operator/taxonomy:
    get:
      tags: [operator]
      summary: Прочитать текущую версию таксономии
      operationId: operatorTaxonomy
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200": { $ref: "#/components/responses/Taxonomy" }
        "304": { description: Версия не изменилась }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [operator]
      summary: Атомарно загрузить версию и перепроверить карточки
      operationId: loadTaxonomy
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      description: |
        Один YAML-документ до 2 MiB, формат taxonomy/example.yaml. Идемпотентен
        для той же версии с тем же содержимым. Новая версия строго больше текущей.
        Коды глобальны; тип и единица неизменны; удалять код из всех схем нельзя.
        Ошибочные карточки скрываются, индекс обновляется через outbox.
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { $ref: "#/components/schemas/TaxonomyDefinition" }
      responses:
        "200":
          description: Версия загружена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/catalog/offers/{offerId}/publication:
    get:
      tags: [operator]
      summary: Диагностика публикации из проекции, включая скрытые предложения
      operationId: offerPublication
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/OfferId" }
      responses:
        "200":
          description: Состояние проверки последней проекции
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /health:
    get:
      tags: [service]
      summary: Состояние зависимостей
      operationId: health
      responses:
        "200":
          description: Все зависимости отвечают
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Какая-то зависимость не отвечает
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /metrics:
    get:
      tags: [service]
      summary: Метрики Prometheus
      operationId: metrics
      responses:
        "200":
          description: Текстовый формат Prometheus
          content:
            text/plain:
              schema: { type: string }
  /api/v1/catalog/offers:
    get:
      tags: [catalog]
      summary: Выдача предложений
      description: |
        Только опубликованные предложения. category — узел дерева площадки, включая потомков.
        Канонические фильтры: attr.<код>=значение; повтор параметра означает OR,
        разные коды — AND. Для number: attr.<код>.min и attr.<код>.max (включительно),
        либо точное значение. Неизвестный код, неверный тип/словарь/диапазон — 400.
        Пример: ?category=c1&attr.a1=v1&attr.a1=v2&attr.a2.min=1.5&attr.a2.max=10.
        Фасеты считаются по всей отфильтрованной выдаче до пагинации. Атрибутные —
        только при facet=true и покрытии >=20%; category, tenant, price, inStock — всегда.
        Числа: min/max; остальные: до 256 наиболее частых значений с count.
        Для пустой выдачи универсальные фасеты пусты, атрибутные отсутствуют.
      operationId: listOffers
      parameters:
        - name: deliveryCarrier
          in: query
          schema: { type: string }
          description: Код перевозчика; передаётся вместе с deliveryRegion.
        - name: deliveryRegion
          in: query
          schema: { type: string }
          description: Код ISO 3166-2 RU из ПВЗ.
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: Строка поиска }
        - { name: tenant, in: query, schema: { type: string }, description: Магазин }
        - { name: category, in: query, schema: { type: string }, description: Категория площадки с потомками }
        - { name: tag, in: query, schema: { type: string } }
        - { name: priceMin, in: query, schema: { type: integer, format: int64, minimum: 0 }, description: Копейки }
        - { name: priceMax, in: query, schema: { type: integer, format: int64, minimum: 0 }, description: Копейки }
        - { name: inStock, in: query, schema: { type: boolean } }
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, price_asc, price_desc, newest], default: relevance }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: "offset + limit ≤ 10000" }
      responses:
        "200":
          description: Страница выдачи
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferPage" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/catalog/offers/{offerId}:
    get:
      tags: [catalog]
      summary: Карточка предложения
      operationId: getOffer
      parameters:
        - name: deliveryCarrier
          in: query
          schema: { type: string }
          description: Код перевозчика; передаётся вместе с deliveryRegion.
        - name: deliveryRegion
          in: query
          schema: { type: string }
          description: Код ISO 3166-2 RU из ПВЗ.
        - $ref: "#/components/parameters/OfferId"
      responses:
        "200":
          description: Карточка с описанием и подписями тегов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/auth/call:
    post:
      tags: [auth]
      summary: Начать вход по звонку
      description: |
        Покупатель получает номер, на который нужно позвонить со своего
        телефона. Лимиты: по телефону и по адресу покупателя.
      operationId: startLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, examples: ["+7 (925) 123-45-67"] }
      responses:
        "201":
          description: Проверка заведена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Challenge" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/call/check:
    post:
      tags: [auth]
      summary: Состояние проверки звонком
      description: |
        Клиент опрашивает раз в 2–3 секунды. Когда звонок подтверждён,
        ответ ставит куку сессии `__Host-mp_session` (Secure, HttpOnly,
        SameSite=Lax) и содержит покупателя; токен в тело не попадает.
        Сессия выдаётся по проверке один раз: повтор — 409 buyer.challenge_used.
      operationId: checkLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId]
              properties:
                challengeId: { type: string, format: uuid }
      responses:
        "200":
          description: Состояние; при входе — Set-Cookie и покупатель
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "__Host-mp_session=…; Path=/; Secure; HttpOnly; SameSite=Lax"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Выйти
      operationId: logout
      responses:
        "204":
          description: Сессия завершена, кука стёрта
  /api/v1/auth/webhooks/smsru:
    post:
      tags: [auth]
      summary: Оповещение sms.ru о проверке звонком
      description: |
        Служебный адрес для шлюза. Форма с записями `data[N]` вида
        «callcheck_status\n<check_id>\n<код>\n<время>». Состояние
        перечитывается у шлюза, телу не верим. Ответ — «100».
      operationId: smsruWebhook
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        "200":
          description: Принято
          content:
            text/plain:
              schema: { type: string, const: "100" }
  /api/v1/me:
    get:
      tags: [auth]
      summary: Покупатель сессии
      operationId: me
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200":
          description: Покупатель
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/cart:
    get:
      tags: [cart]
      summary: Корзина покупателя
      description: Нет корзины или она просрочена — пустая.
      operationId: getCart
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/cart/lines:
    post:
      tags: [cart]
      summary: Положить предложение
      description: То же предложение складывает количества; остаток сверяется с каталогом.
      operationId: addCartLine
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [offerId, quantity]
              properties:
                offerId: { type: string, examples: ["t1~p1"] }
                quantity: { type: integer, minimum: 1, maximum: 999 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/cart/lines/{offerId}:
    put:
      tags: [cart]
      summary: Задать количество
      description: Ноль убирает строку.
      operationId: setCartLineQuantity
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/OfferId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0, maximum: 999 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [cart]
      summary: Убрать строку
      operationId: removeCartLine
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/OfferId"
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/cart/verify:
    post:
      tags: [cart]
      summary: Перепроверить у магазинов
      description: Цена и наличие спрашиваются у каждого магазина; строки получают пометку issue.
      operationId: verifyCart
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/delivery/carriers:
    get:
      tags: [delivery]
      summary: Подключённые перевозчики
      description: Для переключателя карты; карта показывает пункты одного перевозчика.
      operationId: listCarriers
      responses:
        "200":
          description: Перевозчики
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Carrier" }
  /api/v1/delivery/pickup-points:
    get:
      tags: [delivery]
      summary: Пункты выдачи перевозчика
      description: Ровно одно из двух — область карты или город.
      operationId: listPickupPoints
      parameters:
        - { name: carrier, in: query, required: true, schema: { type: string, examples: [cdek, yandex] } }
        - name: bbox
          in: query
          description: "minLon,minLat,maxLon,maxLat в градусах"
          schema: { type: string, examples: ["37.5,55.6,37.8,55.9"] }
        - { name: city, in: query, schema: { type: string }, description: Город словами перевозчика, без учёта регистра }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: Пункты
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PickupPoint" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/checkout:
    post:
      tags: [checkout]
      summary: Собрать покупку из корзины
      description: Повтор с тем же Idempotency-Key отдаёт ту же покупку.
      operationId: createCheckout
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_:.-]{8,128}$" }
      responses:
        "201": { $ref: "#/components/responses/Checkout" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}:
    get:
      tags: [checkout]
      summary: Покупка
      operationId: getCheckout
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/delivery/quotes:
    post:
      tags: [checkout]
      summary: Выбрать пункт выдачи и посчитать доставку
      description: |
        Расчёт спрашивается у каждого продавца покупки по его договору.
        Продавец, который не везёт, получает quote.status unavailable с
        причиной из словаря (`reason`); не ответивший, ответивший не по
        контракту или выключивший участие — reason seller_unreachable.
      operationId: quoteCheckoutDelivery
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [carrier, pickupPointCode]
              properties:
                carrier: { type: string }
                pickupPointCode: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/confirm:
    post:
      tags: [checkout]
      summary: Подтвердить покупку
      description: |
        Цены и наличие перепроверяются у магазинов, устаревшая доставка
        пересчитывается. Изменились цены — 409 checkout.changed: покупка уже
        обновлена, её нужно перечитать и подтвердить заново. Подтверждённая
        покупка отдаётся как есть.
      operationId: confirmCheckout
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants:
    get:
      tags: [operator]
      summary: Участники
      operationId: listParticipants
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Страница участников
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [operator]
      summary: Завести участника
      description: Магазин должен быть в зеркале реестра платформы. Новый участник скрыт.
      operationId: createParticipant
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenantId, name]
              properties:
                tenantId: { type: string }
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}:
    get:
      tags: [operator]
      summary: Участник
      operationId: getParticipant
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [operator]
      summary: Переименовать участника
      operationId: renameParticipant
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}/enable:
    post:
      tags: [operator]
      summary: Показать участника в каталоге
      operationId: enableParticipant
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}/disable:
    post:
      tags: [operator]
      summary: Скрыть участника из каталога
      operationId: disableParticipant
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/orders:
    post:
      tags: [checkout]
      summary: Создать независимые заказы и получить первую ссылку
      description: Сначала обновляются все расчёты и настройки. Новая плата — 409 DELIVERY_CHANGED с checkout и новыми итогами, заказов нет.
      operationId: createCheckoutOrders
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact]
              additionalProperties: false
              properties:
                contact:
                  type: object
                  required: [phone, name]
                  additionalProperties: false
                  properties:
                    phone: { type: string }
                    name: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/groups/{groupId}/pay:
    post:
      tags: [checkout]
      summary: Ссылка только для текущей группы до окончания её окна
      description: Более поздняя awaiting_payment — 409 PAYMENT_ORDER; GET и pay не обходят NextPollAt.
      operationId: payCheckoutGroup
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ссылка на кассу магазина
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/return:
    get:
      tags: [checkout]
      summary: Экран проверки оплаты; параметры кассы не подтверждают оплату
      operationId: checkoutPaymentReturn
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200":
          description: Проверяем оплату; клиент опрашивает GET checkout
          content:
            application/json:
              schema:
                type: object
                required: [status, message, checkoutId]
                properties:
                  status: { type: string, const: checking_payment }
                  message: { type: string }
                  checkoutId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/orders:
    get:
      tags: [checkout]
      summary: Покупки владельца со статусами групп, треками и ПВЗ
      operationId: listBuyerOrders
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: after
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: До 100 покупок; next — последний ID для следующей страницы
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/operator/checkouts:
    get:
      tags: [operator]
      summary: Покупки с группами; stuck=true — ожидают оплату не менее 15 минут
      operationId: listOperatorCheckouts
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - name: after
          in: query
          schema: { type: string, format: uuid }
        - name: stuck
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: До 100 покупок; next — последний ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/delivery/settings:
    get:
      tags: [delivery]
      summary: Действующий минимальный процент субсидии продавца для PR-A1
      operationId: getDeliverySettings
      security: []
      description: Настройка продавца ниже порога принимается; нижняя граница применяется после maxAmount.
      responses:
        "200":
          description: Публичные правила доставки площадки
          content:
            application/json:
              schema:
                type: object
                required: [deliverySubsidyMinPercent]
                properties:
                  deliverySubsidyMinPercent:
                    type: integer
                    minimum: 0
                    maximum: 100
                    default: 30
                    description: DELIVERY_SUBSIDY_MIN_PERCENT; действующая субсидия — max настройки с потолком и процента cost.

components:
  securitySchemes:
    operatorSession:
      type: apiKey
      in: cookie
      name: __Host-kvazar_operator
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-mp_session
      description: Сессия покупателя после входа по звонку.
    sessionBearer:
      type: http
      scheme: bearer
      description: Та же сессия заголовком — для серверного рендера витрины.
    operatorToken:
      type: http
      scheme: bearer
      description: Машинный токен OPERATOR_TOKEN; панель использует operatorSession.
  parameters:
    TaxonomyCache:
      name: If-None-Match
      in: header
      schema: { type: string }
      description: 'ETag вида "taxonomy-1"; поддерживаются слабые ETag, списки и *'
    OfferId:
      name: offerId
      in: path
      required: true
      description: "<tenantId>~<productId>"
      schema: { type: string, examples: ["t1~p1"] }
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string }
    CheckoutId:
      name: checkoutId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Taxonomy:
      description: Текущий снимок таксономии; версия 0 и пустое дерево до первой загрузки
      headers:
        ETag: { schema: { type: string } }
        X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
        Cache-Control: { schema: { type: string }, description: public, max-age=0, must-revalidate }
      content:
        application/json:
          schema:
            type: object
            required: [version, categories]
            properties:
              version: { type: integer, format: int64, minimum: 0 }
              categories:
                type: array
                items: { $ref: "#/components/schemas/TaxonomyCategory" }
    EventConflict:
      description: >-
        Состояние или версия изменились — event содержит текущий снимок.
        IDEMPOTENCY_KEY_REUSED — тот же ключ использован с другим телом, событием или действием;
        event отсутствует. Новое решение и задача не созданы.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  event: { $ref: '#/components/schemas/ParkedEvent' }
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Cart:
      description: Корзина
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Cart" }
    Checkout:
      description: Покупка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Checkout" }
    Participant:
      description: Участник
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Participant" }
  schemas:
    Operator:
      type: object
      required:
      - id
      - name
      - email
      - role
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - operator
    ParkedEvent:
      type: object
      required:
      - id
      - type
      - tenantId
      - occurredAt
      - attempts
      - error
      - payload
      - status
      - resolution
      - operatorId
      - updatedAt
      - version
      properties:
        id:
          type: string
        type:
          type: string
        tenantId:
          type: string
        occurredAt:
          type: string
          format: date-time
        attempts:
          type: integer
        error:
          type: string
        payload:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
          - parked
          - queued
          - resolved
        resolution:
          type: string
        operatorId:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    ParkedEventPage:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ParkedEvent'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    ParticipationDelivery:
      type: object
      required: [regions, carriers]
      properties:
        regions: { type: array, minItems: 1, items: { type: string, pattern: "^RU-[A-Z]{2,3}$" },
                   description: "Существующие коды ISO 3166-2 RU, например RU-MOW" }
        carriers: { type: array, minItems: 1, items: { type: string, enum: [cdek, yandex] } }
    ParticipantDelivery:
      type: object
      required: [regions, carriers]
      description: До настройки покрытия массивы пусты; всегда массивы, никогда null.
      properties:
        regions: { type: array, items: { type: string, pattern: "^RU-[A-Z]{2,3}$" } }
        carriers: { type: array, items: { type: string, enum: [cdek, yandex] } }
    PaymentLink:
      type: object
      required: [tenantId, url, expiresAt, position, count]
      properties:
        tenantId: { type: string }
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        position: { type: integer, minimum: 1 }
        count: { type: integer, minimum: 1 }
    PurchaseList:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Checkout" }
        next: { type: string, description: Последний ID; пусто при пустой странице }
    TaxonomyVersion:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
    TaxonomyDefinition:
      type: object
      additionalProperties: false
      required: [version, categories]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        categories:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TaxonomyCategory" }
    TaxonomyCategory:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        name: { type: string, minLength: 1, maxLength: 256 }
        attributes:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/TaxonomyAttribute" }
        children:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/TaxonomyCategory" }
    TaxonomyAttribute:
      type: object
      additionalProperties: false
      required: [code, name, type]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        name: { type: string, minLength: 1, maxLength: 256 }
        type: { type: string, enum: [enum, number, string, boolean] }
        required: { type: boolean, default: false }
        values: { type: array, items: { type: string }, description: Обязательный словарь только для enum }
        unit: { type: string, description: Единица только для number }
        facet: { type: boolean, default: false }
    CanonicalAttributes:
      type: object
      additionalProperties:
        type: [string, number, boolean]
      description: Скалярные значения по кодам схемы; без массивов и null
    MarketplaceCard:
      type: object
      required: [categoryId, attributes, published]
      properties:
        categoryId: { type: string }
        attributes: { $ref: "#/components/schemas/CanonicalAttributes" }
        published: { type: boolean }
    Publication:
      type: object
      required: [version, categoryId, attributes, issues, published]
      properties:
        version: { type: integer, format: int64 }
        categoryId: { type: string }
        categoryName: { type: string }
        categoryPath: { type: [array, "null"], items: { type: string } }
        attributes: { $ref: "#/components/schemas/CanonicalAttributes" }
        published: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [code]
            properties:
              attribute: { type: string }
              code:
                type: string
                enum: [taxonomy.card_missing, taxonomy.category_unknown, taxonomy.attribute_unknown,
                       taxonomy.type, taxonomy.required, taxonomy.enum_value, taxonomy.unpublished]
    Facet:
      type: object
      required: [code, name, type, count, values]
      properties:
        code: { type: string, description: 'category, tenant, price, inStock или attr.<код>' }
        name: { type: string }
        type: { type: string, enum: [enum, number, string, boolean] }
        unit: { type: string }
        count: { type: integer, description: Число предложений с полем до пагинации }
        min: { type: number }
        max: { type: number }
        values:
          type: array
          maxItems: 256
          items:
            type: object
            required: [value, count]
            properties:
              value: { type: string }
              count: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        checkout:
          $ref: "#/components/schemas/Checkout"
          description: Новый снимок при DELIVERY_CHANGED; требуется подтверждение.
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: ["catalog.offer_not_found"] }
            message: { type: string }
    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }
    Seller:
      type: object
      required: [slug, name, delivery, freeDeliveryFrom]
      properties:
        delivery: { $ref: "#/components/schemas/ParticipantDelivery" }
        freeDeliveryFrom: { type: integer, format: int64, minimum: 0 }
        slug: { type: string }
        name: { type: string }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
    Tag:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
    Offer:
      description: При паре deliveryCarrier и deliveryRegion возвращает deliveryAvailable; вне зон товар виден, доставка недоступна.
      type: object
      required: [id, tenantId, productId, seller, name, categoryId, attributes, categories, tags, price, basePrice, available, inStock, checkoutAvailable, updatedAt]
      properties:
        deliveryAvailable: { type: boolean }
        categoryId: { type: string, description: Категория площадки }
        attributes: { $ref: "#/components/schemas/CanonicalAttributes" }
        id: { type: string, examples: ["t1~p1"] }
        tenantId: { type: string }
        productId: { type: string }
        seller: { $ref: "#/components/schemas/Seller" }
        name: { type: string }
        description: { type: string, description: Только в карточке }
        image: { type: string }
        url: { type: string }
        sku: { type: string }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        price: { type: integer, format: int64, description: Цена продажи в копейках }
        basePrice: { type: integer, format: int64, description: Прайс магазина в копейках }
        available: { type: integer }
        inStock: { type: boolean }
        checkoutAvailable: { type: boolean, description: Продавец принимает оплату через маркетплейс }
        updatedAt: { type: string, format: date-time }
    OfferPage:
      type: object
      required: [items, total, limit, offset, facets]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Offer" }
        facets:
          type: array
          items: { $ref: "#/components/schemas/Facet" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Challenge:
      type: object
      required: [challengeId, status, expiresAt]
      properties:
        challengeId: { type: string, format: uuid }
        status: { type: string, enum: [pending, confirmed, expired] }
        callPhone: { type: string, description: Номер для звонка цифрами }
        callPhonePretty: { type: string }
        expiresAt: { type: string, format: date-time }
    LoginResult:
      allOf:
        - $ref: "#/components/schemas/Challenge"
        - type: object
          properties:
            buyer: { $ref: "#/components/schemas/Buyer" }
            sessionExpiresAt: { type: string, format: date-time }
    Buyer:
      type: object
      required: [id, phone]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, description: Цифры в международном формате без плюса }
    CartLine:
      type: object
      required: [offerId, tenantId, productId, name, quantity, price, amount, issue, addedAt]
      properties:
        offerId: { type: string }
        tenantId: { type: string }
        productId: { type: string }
        name: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        price: { type: integer, format: int64, description: Снимок цены в копейках }
        amount: { type: integer, format: int64 }
        issue:
          type: [string, "null"]
          enum: [price_changed, not_enough_stock, unavailable, null]
          description: Пометка после перепроверки у магазина
        addedAt: { type: string, format: date-time }
    Cart:
      type: object
      required: [id, lines, total, version, expiresAt]
      properties:
        id: { type: string, format: uuid }
        lines:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CartLine" }
        total: { type: integer, format: int64 }
        version: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
    Carrier:
      type: object
      required: [code, name]
      properties:
        code: { type: string, examples: [cdek, yandex] }
        name: { type: string }
    PickupPoint:
      type: object
      required: [carrier, code, name, address, city, location, schedule, refreshedAt]
      properties:
        regionCode: { type: string, description: "ISO 3166-2 RU; пусто при неизвестном соответствии" }
        carrier: { type: string }
        code: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        location:
          type: object
          required: [lat, lon]
          properties:
            lat: { type: number }
            lon: { type: number }
        schedule: { type: string }
        refreshedAt: { type: string, format: date-time }
    Quote:
      type: object
      required: [status, cost, subsidy, buyerCost, minDays, maxDays, expiresAt]
      properties:
        status: { type: string, enum: [available, unavailable] }
        reason:
          type: string
          enum: [carrier_not_connected, pickup_point_unavailable, no_rate, seller_unreachable]
          description: |
            Только при status unavailable. Закрытый словарь docs/server-contract.md:
            carrier_not_connected — у продавца нет этого перевозчика;
            pickup_point_unavailable — перевозчик не везёт в этот пункт;
            no_rate — тариф не рассчитан (вес, габариты, зона);
            seller_unreachable — продавец не ответил, повтор при подтверждении.
        cost: { type: integer, format: int64, description: Стоимость по договору продавца }
        subsidy: { type: integer, format: int64, description: Сколько оплачивает продавец }
        buyerCost: { type: integer, format: int64, description: Доля покупателя }
        minDays: { type: integer }
        maxDays: { type: integer }
        expiresAt: { type: string, format: date-time }
    CheckoutLine:
      type: object
      required: [offerId, productId, name, quantity, price, amount]
      properties:
        offerId: { type: string }
        productId: { type: string }
        name: { type: string }
        quantity: { type: integer }
        price: { type: integer, format: int64 }
        amount: { type: integer, format: int64 }
    CheckoutGroup:
      type: object
      required: [tenantId, externalCheckoutId, lines, goods, quote, status, paymentOrder, deliveryPrice, paymentUrl, returnFailed, pollFailures, nextPollAt, createFailures, createExhausted]
      properties:
        tenantId: { type: string }
        status:
          type: string
          enum: ["", creating_order, awaiting_payment, paid, cancelled, shipped, delivered, returned, seller_unreachable, price_changed, delivery_unavailable]
        orderId: { type: string }
        paymentUrl:
          type: [string, "null"]
          format: uri
          description: Только текущая awaiting_payment и now < expiresAt; у остальных null.
        expiresAt: { type: string, format: date-time }
        paymentOrder: { type: integer }
        deliveryPrice: { type: integer, format: int64, minimum: 0, description: Плата на кассе этого магазина; 0 — строка доставки скрыта }
        reason: { type: string }
        track: { type: string }
        returnFailed: { type: boolean }
        returnReason: { type: string }
        returnRemaining:
          type: array
          items:
            type: object
            required: [offerId, quantity]
            properties:
              offerId: { type: string }
              quantity: { type: integer, minimum: 1 }
        pollFailures: { type: integer, minimum: 0, maximum: 5 }
        nextPollAt: { type: string, format: date-time }
        createFailures: { type: integer, minimum: 0, maximum: 5 }
        createExhausted: { type: boolean }
        lastErrorCode: { type: string }
        currentPrices:
          type: array
          items:
            type: object
            required: [productId, price]
            properties:
              productId: { type: string }
              price: { type: integer, format: int64, minimum: 0 }
        externalCheckoutId: { type: string, description: "<checkoutId>:<tenantId> — ключ заказа у магазина" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/CheckoutLine" }
        goods: { type: integer, format: int64 }
        quote:
          oneOf:
            - $ref: "#/components/schemas/Quote"
            - type: "null"
    Selection:
      type: object
      required: [carrier, pickupPointCode, city, address]
      properties:
        carrier: { type: string }
        pickupPointCode: { type: string }
        city: { type: string }
        address: { type: string }
    Checkout:
      type: object
      required: [id, status, groups, delivery, goodsTotal, deliveryTotal, total, version, createdAt, updatedAt, confirmedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [draft, confirmed, creating_orders, awaiting_payment, partially_paid, paid, cancelled] }
        groups:
          type: array
          items: { $ref: "#/components/schemas/CheckoutGroup" }
        delivery:
          oneOf:
            - $ref: "#/components/schemas/Selection"
            - type: "null"
        goodsTotal: { type: integer, format: int64 }
        deliveryTotal: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        confirmedAt: { type: [string, "null"], format: date-time }
        nextPayment:
          oneOf:
            - $ref: "#/components/schemas/PaymentLink"
            - type: "null"
    Subsidy:
      type: object
      required: [enabled, value, maxAmount]
      properties:
        enabled: { type: boolean }
        type: { type: string, enum: [fixed, percent] }
        value: { type: integer, format: int64, description: Копейки для fixed, процент для percent }
        maxAmount: { type: integer, format: int64, description: Потолок в копейках; 0 — без потолка }
    Participant:
      type: object
      required: [tenantId, slug, name, status, enabled, freeDeliveryFrom, delivery, shopEnabled, subsidy, settingsSyncedAt, tenantStatus, visible, checkoutAvailable, version, createdAt, updatedAt]
      properties:
        tenantId: { type: string }
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [onboarding, connected] }
        enabled: { type: boolean, description: Включён оператором }
        freeDeliveryFrom: { type: integer, format: int64, minimum: 0 }
        delivery: { $ref: "#/components/schemas/ParticipantDelivery" }
        shopEnabled: { type: boolean, description: Магазин сам включил участие (с сервера) }
        subsidy: { $ref: "#/components/schemas/Subsidy" }
        settingsSyncedAt: { type: [string, "null"], format: date-time }
        tenantStatus: { type: string, enum: [creating, active, suspended, deleting, deleted] }
        visible: { type: boolean }
        checkoutAvailable: { type: boolean }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ParticipantList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Participant" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
