  /api/v1/catalog/sponsored:
    get:
      summary: Спонсорские карточки первой страницы
      description: >-
        Публичные цены читаются из проекции без вызова сервера магазинов.
      security: []
      parameters:
      - { $ref: "#/components/parameters/MoneyUnit" }
      - name: deliveryCarrier
        in: query
        schema:
          type: string
        description: Код перевозчика; передаётся вместе с deliveryRegion.
      - name: deliveryRegion
        in: query
        schema:
          type: string
        description: Код ISO 3166-2 RU из ПВЗ.
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
        description: Строка поиска, не более 32 слов после свёртки пробелов.
      - name: tenant
        in: query
        style: form
        explode: true
        schema:
          type: array
          maxItems: 100
          items:
            type: string
        description: Магазины (ИЛИ); повторы удаляются.
      - name: groupId
        in: query
        schema:
          type: string
        description: Группа вариантов; требует ровно один tenant
      - name: category
        in: query
        schema:
          type: string
        description: Категория площадки с потомками
      - name: priceMin
        in: query
        schema:
          type: number
          multipleOf: 0.01
          minimum: 0
          maximum: 9999999999999.99
        description: Рубли
      - name: priceMax
        in: query
        schema:
          type: number
          multipleOf: 0.01
          minimum: 0
          maximum: 9999999999999.99
        description: Рубли
      - name: inStock
        in: query
        schema:
          type: boolean
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - relevance
          - price_asc
          - price_desc
          - newest
          - rating
          default: relevance
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: offset + limit ≤ 10000
      responses:
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        '200':
          description: По одной карточке на позицию
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsoredPage"
  /api/v1/checkout/{checkoutId}/delivery/pickup-points:
    get:
      tags:
        - checkout
      summary: Пункты магазинов покупки в области карты или странице списка
      operationId: checkoutPickupPoints
      security:
        - sessionCookie: []
        - sessionBearer: []
      parameters:
        - $ref: '#/components/parameters/MoneyUnit'
        - $ref: '#/components/parameters/CheckoutId'
        - name: carrier
          in: query
          required: true
          schema:
            type: string
            enum:
              - cdek
              - yandex
        - name: city
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: bbox
          in: query
          description: Юг,запад,север,восток WGS84 через запятую. При наличии limit=500, offset=0.
          schema:
            type: string
            examples:
              - 55.6,37.4,55.9,37.8
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: Страница ПВЗ
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - offset
                  - limit
                  - refineArea
                  - bounds
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PickupPoint'
                  total:
                    type: integer
                    minimum: 0
                    description: Точное число разрешённых точек в области или списке
                  refineArea:
                    type: boolean
                    description: В области больше 500 точек; увеличьте карту
                  bounds:
                    type:
                      - array
                      - 'null'
                    minItems: 4
                    maxItems: 4
                    items:
                      type: number
                    description: Охват разрешённых регионов города, юг/запад/север/восток
                  offset:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                    minimum: 1
                    maximum: 500
        '409':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    serverApiToken:
      type: http
      scheme: bearer
      description: Отдельный SERVER_API_TOKEN для машинного API магазинов.
    operatorSession:
      type: apiKey
      in: cookie
      name: __Host-kvazar_operator
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-mp_access
      description: Сессия покупателя после входа по звонку.
    sessionBearer:
      type: http
      scheme: bearer
      description: Та же сессия заголовком — для серверного рендера витрины.
    operatorToken:
      type: http
      scheme: bearer
      description: Машинный токен OPERATOR_TOKEN; панель использует operatorSession.
    referenceReadToken:
      type: http
      scheme: bearer
      description: >-
        REFERENCE_READ_TOKEN — только чтение реестра (snapshot, resolve, entries);
        прав оператора площадки не даёт.
  parameters:
    MoneyUnit:
      name: X-Marketplace-Money-Unit
      in: header
      required: true
      description: Обязательный RUB; без него 409 api.money_unit_required до чтения денег и изменения состояния.
      schema: { type: string, enum: [RUB] }
    TaxonomyCache:
      name: If-None-Match
      in: header
      schema: { type: string }
      description: 'ETag вида "taxonomy-1"; поддерживаются слабые ETag, списки и *'
    OfferId:
      name: offerId
      in: path
      required: true
      description: "<tenantId>~<productId>"
      schema: { type: string, examples: ["t1~p1"] }
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string }
    CheckoutId:
      name: checkoutId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReferenceDictionary:
      name: dict
      in: path
      required: true
      description: Код словаря реестра
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{0,31}$", examples: [brand] }
    ReferenceEntryId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReferenceIfMatch:
      name: If-Match
      in: header
      required: true
      description: 'Ревизия записи из ETag: "12"'
      schema: { type: string }
  responses:
    ReferenceEntry:
      description: Запись реестра; ETag — её ревизия для If-Match
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ReferenceEntryResponse" }
    Taxonomy:
      description: Текущий снимок таксономии; версия 0 и пустое дерево до первой загрузки
      headers:
        ETag: { schema: { type: string } }
        X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
        Cache-Control: { schema: { type: string }, description: "public, max-age=0, must-revalidate" }
      content:
        application/json:
          schema:
            type: object
            required: [version, categories]
            properties:
              version: { type: integer, format: int64, minimum: 0 }
              categories:
                type: array
                items: { $ref: "#/components/schemas/TaxonomyCategory" }
    EventConflict:
      description: >-
        Состояние или версия изменились — event содержит текущий снимок.
        IDEMPOTENCY_KEY_REUSED — тот же ключ использован с другим телом, событием или действием;
        event отсутствует. Новое решение и задача не созданы.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  event: { $ref: '#/components/schemas/ParkedEvent' }
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Cart:
      description: Корзина
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Cart" }
    Checkout:
      description: Покупка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Checkout" }
    Participant:
      description: Участник
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Participant" }
  schemas:
    SearchSynonymBlockedTerms:
      type: array
      maxItems: 512
      items: { type: string, minLength: 2, maxLength: 64 }
    SearchSynonymStopList:
      type: object
      required: [revision, blockedTerms]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        blockedTerms: { $ref: "#/components/schemas/SearchSynonymBlockedTerms" }
    SearchSynonymDirection:
      type: object
      required: [id, from, to, scope]
      properties:
        id: { type: string, example: syn_17 }
        from: { type: string, minLength: 2, maxLength: 64 }
        to: { type: string, minLength: 2, maxLength: 64 }
        scope:
          type: object
          required: [kind, id]
          properties:
            kind: { type: string, enum: [category] }
            id: { type: string, example: computers.routers }
        concept: { type: string, description: Зарезервировано }
    SearchSynonymSnapshot:
      type: object
      required: [schemaVersion, revision, rules, blockedTerms]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        revision: { type: integer, format: int64, minimum: 0 }
        rules:
          type: array
          maxItems: 1000
          items:
            allOf:
              - { $ref: "#/components/schemas/SearchSynonymDirection" }
              - type: object
                required: [phase]
                properties:
                  phase: { type: string, enum: [active] }
        blockedTerms: { $ref: "#/components/schemas/SearchSynonymBlockedTerms" }
    SearchSynonymEntry:
      allOf:
        - { $ref: "#/components/schemas/SearchSynonymDirection" }
        - type: object
          required: [phase, source, version, createdAt, expiresAt, nextCheck]
          properties:
            phase: { type: string, enum: [candidate, quarantined, active, disabled] }
            source:
              type: object
              required: [kind, id, revision]
              properties:
                kind: { type: string, enum: [taxonomy_name, registry_alias, model] }
                id: { type: string }
                revision: { type: string }
            version: { type: integer, format: int64, minimum: 1 }
            createdAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
            nextCheck: { type: string, format: date-time }
            activatedAt: { type: string, format: date-time }
            lastCheck: { $ref: "#/components/schemas/SearchSynonymCheck" }
    SearchSynonymCheck:
      type: object
      required: [id, complete, scopesChecked, sourceLiteralScopes, targetLiteralScopes, rescuedScopes,
                 decision, evidence, batchId, validatorVersion, recordedAt, outcome]
      properties:
        id: { type: string }
        complete: { type: boolean }
        scopesChecked: { type: integer, minimum: 0, maximum: 5 }
        sourceLiteralScopes: { type: integer, minimum: 0, maximum: 5 }
        targetLiteralScopes: { type: integer, minimum: 0, maximum: 5 }
        rescuedScopes: { type: integer, minimum: 0, maximum: 5 }
        decision: { type: string, enum: [pass, reject, retry] }
        evidence:
          type: object
          required: [fingerprint, checkedAt, taxonomyRevision]
          properties:
            fingerprint: { type: string, pattern: '^(|[0-9a-fA-F]{64})$' }
            checkedAt: { type: string, format: date-time }
            taxonomyRevision: { type: string }
        batchId: { type: string }
        validatorVersion: { type: integer, enum: [0, 1] }
        recordedAt: { type: string, format: date-time }
        outcome: { type: string, enum: [pass, reject, retry] }
    ModerationBulkInput:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 2000 }
        cases:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [id, expectedVersion]
            properties:
              id: { type: string, format: uuid }
              expectedVersion: { type: integer, format: int64, minimum: 1 }
        selector:
          $ref: '#/components/schemas/ModerationBulkSelector'
    ModerationBulkSelector:
      type: object
      properties:
        tenantId: { type: string }
        source: { type: string, enum: [rule, operator] }
        reason: { type: string, description: Дело содержит указанную причину }
        reasons:
          description: Непустой набор ограничивает все причины дела; пустой не ограничивает отбор
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string }
        after: { type: string, format: uuid }
    ModerationBulkCounts:
      type: object
      required: [total, tenants, otherReasons]
      properties:
        total: { type: integer }
        tenants: { type: integer }
        otherReasons: { type: integer, description: Дела с набором причин отличным от единственной moderation.probation }
    ModerationBulkResult:
      type: object
      required: [approved, skipped, details, hasMore]
      properties:
        approved: { type: integer }
        skipped: { type: integer }
        hasMore: { type: boolean }
        nextAfter: { type: string, format: uuid }
        details:
          type: array
          items:
            type: object
            required: [id, reason]
            properties:
              id: { type: string, format: uuid }
              reason:
                type: string
                enum: [changed, already_decided, other_reasons, not_found, participant_changed]
    BuyerRegionChoice:
      type: [object, "null"]
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string }
        name: { type: string, description: Игнорируется; берётся из справочника }
    BuyerPickupChoice:
      type: [object, "null"]
      required: [provider, code]
      description: |
        При первом выборе или смене provider/code city обязателен.
        Если provider/code совпадают с сохранённым пунктом, а city пуст или совпадает,
        сохраняются прежние город, адрес и регион без обращения к магазину.
        Другой непустой city требует проверки по списку магазина.
      additionalProperties: false
      properties:
        provider: { type: string }
        code: { type: string }
        city: { type: string, maxLength: 120 }
        address: { type: string, description: Игнорируется; берётся из списка магазина }
        regionCode: { type: string, description: Игнорируется; берётся из списка магазина }
    BuyerRegion:
      type: [object, "null"]
      required: [code, name]
      properties:
        code: { type: string, description: ISO 3166-2 из справочника доставки }
        name: { type: string, description: Каноническое имя; входное имя игнорируется }
    BuyerPickup:
      type: [object, "null"]
      required: [provider, code, city, address, regionCode]
      properties:
        provider: { type: string }
        code: { type: string }
        city: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, description: Из списка магазина }
        regionCode: { type: string }
    BuyerNotifications:
      type: object
      additionalProperties: false
      required: [priceDrops, shopNews]
      properties:
        priceDrops: { type: boolean }
        shopNews: { type: boolean }
    BuyerNotificationsPatch:
      type: object
      additionalProperties: false
      properties:
        priceDrops: { type: boolean }
        shopNews: { type: boolean }
    BuyerProfilePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        region:
          $ref: "#/components/schemas/BuyerRegionChoice"
        pickupPoint:
          $ref: "#/components/schemas/BuyerPickupChoice"
        notifications:
          $ref: "#/components/schemas/BuyerNotificationsPatch"
    BuyerProfile:
      type: object
      additionalProperties: false
      required: [name, region, pickupPoint, notifications, alerts]
      properties:
        name: { type: string, maxLength: 200 }
        region:
          $ref: "#/components/schemas/BuyerRegion"
        pickupPoint:
          $ref: "#/components/schemas/BuyerPickup"
        notifications:
          $ref: "#/components/schemas/BuyerNotifications"
        alerts:
          type: object
          required: [priceDrops]
          properties:
            priceDrops:
              type: integer
              minimum: 0
              description: Число снижений публичной цены по наблюдениям покупателя.
    BuyerRegionResult:
      type: object
      required: [code, name, source]
      properties:
        code: { type: [string, "null"] }
        name: { type: [string, "null"] }
        source: { type: string, enum: [profile, pickup, ip, none] }
    BuyerFavorite:
      description: Снятое предложение сохраняет карточку, listed=false и нулевой остаток.
      allOf:
        - $ref: "#/components/schemas/Offer"
        - type: object
          required: [listed]
          properties:
            listed: { type: boolean }
    BuyerFavorites:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BuyerFavorite"
        total: { type: integer, minimum: 0 }
    BuyerWatchTarget:
      type: object
      additionalProperties: false
      properties:
        targetPrice:
          type:
          - number
          - 'null'
          minimum: 0
          multipleOf: 0.01
          maximum: 9999999999999.99
          description: Сумма в рублях
    BuyerPriceWatch:
      type: object
      required:
      - offer
      - priceAtWatch
      - currentPrice
      - dropped
      properties:
        offer:
          $ref: '#/components/schemas/Offer'
        priceAtWatch:
          type: number
          minimum: 0
          multipleOf: 0.01
          maximum: 9999999999999.99
          description: Сумма в рублях
        currentPrice:
          type:
          - number
          - 'null'
          description: null у снятого предложения; dropped тогда false
          multipleOf: 0.01
          minimum: 0
          maximum: 9999999999999.99
        targetPrice:
          type: number
          minimum: 0
          multipleOf: 0.01
          maximum: 9999999999999.99
          description: Сумма в рублях
        dropped:
          type: boolean
          description: Текущая цена ниже priceAtWatch и, при заданной цели, не выше targetPrice.
    BuyerPriceWatches:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BuyerPriceWatch"
    BuyerSubscriptions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShopCard"
    StoreCategory:
      type: object
      required: [id, name, count]
      properties:
        id: { type: string }
        name: { type: string }
        count: { type: integer, minimum: 0 }
    StoreHidden:
      type: object
      required: [key, reason, at]
      properties:
        key: { type: string, enum: [logo] }
        reason: { type: string }
        at: { type: string, format: date-time }
    ShopCardProduct:
      type: object
      additionalProperties: false
      required: [productId, offerId, name, image]
      properties:
        productId: { type: string }
        offerId: { type: string }
        name: { type: string }
        image: { type: [string, "null"] }
    StoreSummary:
      type: object
      required: [offers, fromPrice, categories, uncategorized, hidden, rating, badge, rank, products]
      properties:
        offers: { type: integer, minimum: 0 }
        fromPrice: { type: [integer, "null"], format: int64, minimum: 0 }
        categories: { type: array, items: { $ref: "#/components/schemas/StoreCategory" } }
        uncategorized: { type: integer, minimum: 0 }
        hidden: { type: array, items: { $ref: "#/components/schemas/StoreHidden" } }
        rating: { $ref: "#/components/schemas/Rating" }
        badge: { type: "null" }
        rank: { type: "null" }
        products:
          type: array
          maxItems: 3
          description: До трёх автоматически выбранных публичных товаров.
          items: { $ref: "#/components/schemas/ShopCardProduct" }
    ShopHeader:
      type: object
      required: [tenantId, slug, name, logo, offers, isNew, categories, rating, subscribers]
      properties:
        rating: { $ref: "#/components/schemas/Rating" }
        subscribers: { type: integer, minimum: 0 }
        subscribed: { type: boolean, description: Только для вошедшего покупателя }
        tenantId: { type: string }
        slug: { type: string }
        name: { type: string }
        logo: { type: [string, "null"] }
        offers: { type: integer, minimum: 0 }
        isNew: { type: boolean, const: true }
        categories: { type: array, items: { $ref: "#/components/schemas/StoreCategory" } }
    ShopCard:
      type: object
      required:
      - tenantId
      - slug
      - name
      - logo
      - products
      - offers
      - isNew
      - category
      - moreCategories
      - fromPrice
      - rating
      properties:
        products:
          type: array
          maxItems: 3
          description: До трёх автоматически выбранных публичных товаров.
          items: { $ref: "#/components/schemas/ShopCardProduct" }
        tenantId:
          type: string
        slug:
          type: string
        name:
          type: string
        logo:
          type:
          - string
          - 'null'
        offers:
          type: integer
          minimum: 0
        isNew:
          type: boolean
          const: true
        category:
          type:
          - object
          - 'null'
          required:
          - id
          - name
          properties:
            id:
              type: string
            name:
              type: string
        moreCategories:
          type: integer
          minimum: 0
        fromPrice:
          type:
          - number
          - 'null'
          minimum: 0
          multipleOf: 0.01
          maximum: 9999999999999.99
          description: Сумма в рублях
        rating:
          $ref: '#/components/schemas/Rating'
    ShopPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ShopCard" } }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
    MarketplaceStatusReason:
      type: [object, "null"]
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    MarketplaceStatusDecision:
      type: [object, "null"]
      required: [action, reason, note, at]
      properties:
        action: { type: string, enum: [allow, reject] }
        reason: { $ref: "#/components/schemas/MarketplaceStatusReason" }
        note: { type: string, minLength: 1, maxLength: 2000 }
        at: { type: string, format: date-time }
    MarketplaceOfferStatus:
      type: object
      required: [schemaVersion, tenantId, productId, revision, status, visible, reasons, decision, at]
      properties:
        schemaVersion: { type: integer, const: 1 }
        tenantId: { type: string }
        productId: { type: string }
        revision: { type: integer, minimum: 0 }
        status: { type: string, enum: [published, pending, hidden] }
        visible:
          type: boolean
          description: Допуск карточки, без состояния участника, как в событии статуса.
        reasons:
          type: array
          items:
            type: object
            required: [source, key, message]
            properties:
              source: { type: string, enum: [taxonomy, moderation] }
              key: { type: string }
              message: { type: string }
        decision: { $ref: "#/components/schemas/MarketplaceStatusDecision" }
        at: { type: string, format: date-time }
    MarketplaceParticipantStatus:
      type: [object, "null"]
      required: [schemaVersion, tenantId, stage, enabled, trust, reason, note, by, at]
      properties:
        schemaVersion: { type: integer, const: 1 }
        tenantId: { type: string }
        stage: { $ref: "#/components/schemas/ParticipationStage" }
        enabled: { type: boolean }
        trust: { type: string, enum: [probation, trusted] }
        reason: { $ref: "#/components/schemas/MarketplaceStatusReason" }
        note: { type: string }
        by: { type: string, enum: [operator, system] }
        at: { type: string, format: date-time }
    MarketplaceStatusSnapshot:
      type: object
