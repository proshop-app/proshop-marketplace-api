                - type: object
                  properties:
                    reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ReferenceEntry" }
        "201": { $ref: "#/components/responses/ReferenceEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/reference/{dict}/aliases/{id}:
    delete:
      tags: [reference]
      summary: Удалить вариант написания
