            application/json:
              schema: *outboxRetryResponse
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/operator/events:
    get:
      tags:
      - operator
      operationId: parkedEvents
      security: *id001
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParkedEventPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
