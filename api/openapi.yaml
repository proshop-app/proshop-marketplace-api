  /api/v1/taxonomy/version:
    get:
      tags: [taxonomy]
      summary: Текущая версия; 0 до первой загрузки
      operationId: taxonomyVersion
      parameters:
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200":
          description: Версия таксономии; ETag и X-Taxonomy-Version
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyVersion" }
        "304": { description: Версия не изменилась }
  /api/v1/operator/taxonomy:
    get:
      tags: [operator]
      summary: Прочитать текущую версию таксономии
      operationId: operatorTaxonomy
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200":
          description: Весь нормализованный набор; ETag одной версии
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyDefinition" }
        "304": { description: Версия не изменилась }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/operator/taxonomy/revalidation-failures:
    get:
      tags: [operator]
      summary: Непроверенные карточки после постоянной ошибки фоновой перепроверки
      operationId: taxonomyRevalidationFailures
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { name: afterTenant, in: query, schema: { type: string } }
        - { name: afterProduct, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Keyset-страница; следующий курсор — tenantId/productId последней записи. Только текущие версии товаров.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  next:
                    description: Курсор для afterTenant/afterProduct; null завершает обход. Полная страница может требовать пустого запроса.
                    type: object
                    nullable: true
                    required: [tenantId, productId]
                    properties:
                      tenantId: { type: string }
                      productId: { type: string }
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [tenantId, productId, productVersion, sourceRevision, taxonomyVersion, diagnostic, at]
                      properties:
                        tenantId: { type: string }
                        productId: { type: string }
                        sourceRevision: { type: integer, format: int64 }
                        productVersion: { type: integer, format: int64 }
                        taxonomyVersion: { type: integer, format: int64 }
                        diagnostic: { type: string, maxLength: 2048 }
                        at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/operator/taxonomy/{part}:
    get:
      tags: [operator]
      summary: Скачать часть набора для обратной загрузки
      operationId: downloadTaxonomyPart
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - name: part
          in: path
          required: true
          schema: { type: string, enum: [categories, attributes, schemas, dictionary-bindings] }
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200":
          description: Один YAML-документ; attributes не содержит вычисляемых values и required
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/yaml:
              schema: { type: string }
        "304": { description: Версия не изменилась }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [operator]
      summary: Заменить часть набора и перепроверить карточки
      operationId: loadTaxonomyPart
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - name: part
          in: path
          required: true
          schema: { type: string, enum: [categories, attributes, schemas] }
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"taxonomy-[0-9]+"$' }
        - name: replaceCategories
          in: query
          schema: { type: boolean, default: false }
          description: Явное подтверждение замены кодов и адресов; допустимо только для categories
      description: |
        Один строгий YAML-документ до 2 МиБ. Якоря, ссылки и неизвестные поля запрещены.
        Часть соединяется с двумя текущими; проверяются все ссылки и словари реестра.
        Новая версия равна текущей + 1. Устаревший If-Match — 409; отсутствующий или неверный — 400.
        Коды атрибутов нельзя удалить; type, unit и существующий dictionary неизменны.
        Строке без словаря можно добавить открытый словарь.
        Удаление листьев, изменение и передача slug требуют replaceCategories=true (иначе 409).
        Флаг не переносит карточки и не отменяет совместимость атрибутов.
        schemas принимает extends и abstract (TaxonomySchemaSource); API возвращает развёрнутые схемы.
        Для перехода 9 → 10 порядок: attributes, schemas, categories с подтверждением.
        Это три независимые транзакции и версии, без записи истории CLI-поставок.
        Значения confirmed закрытых словарей сохраняются в снимке.
        Ошибочные карточки скрываются, индекс обновляется через outbox.
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string, description: Список категорий, список атрибутов без values или словарь схем }
      responses:
        "200":
          description: Версия опубликована
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/catalog/offers/{offerId}/publication:
    get:
      tags: [operator]
      summary: Диагностика публикации из проекции, включая скрытые предложения
      operationId: offerPublication
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/OfferId" }
      responses:
        "200":
          description: Состояние проверки последней проекции
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorPublication" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /live:
    get:
      tags: [service]
      summary: Живость процесса без обращений к зависимостям
      operationId: live
      responses:
        '200':
          description: Процесс принимает HTTP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /ready:
    get:
      tags: [service]
      summary: Готовность витрины — PostgreSQL и поиск; Kafka и Redis допускают деградацию
      operationId: ready
      responses:
        '200':
          description: Витрина готова; status degraded указывает отказ вспомогательной зависимости
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        '503':
          description: Недоступна база или поиск
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health:
    get:
      tags: [service]
      summary: Состояние зависимостей
      operationId: health
      responses:
        "200":
          description: Все зависимости отвечают
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Какая-то зависимость не отвечает
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /metrics:
    get:
      tags: [service]
      summary: Метрики Prometheus
      operationId: metrics
      responses:
        "200":
          description: Текстовый формат Prometheus
          content:
            text/plain:
              schema: { type: string }
  /api/v1/catalog/offers/{offerId}/reviews:
    get:
      tags: [catalog]
      operationId: listOfferReviews
      summary: Опубликованные отзывы видимого предложения
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 9999, default: 0 }
      responses:
        "200":
          description: >-
            Ответ не персональный, Cache-Control public max-age=30; limit + offset не больше 10000.
            При отказе сервера магазинов последняя успешная страница или items=[], total=0, HTTP 200.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPage" }
        "400": { description: Некорректная пагинация }
        "404": { description: Предложение скрыто или отсутствует }
  /api/v1/recommendations:
    get:
      tags: [catalog]
      operationId: listRecommendations
      summary: Рекомендации по категории и цене либо интересам покупателя
      description: >-
        offer — та же категория, цена ±40%, с исключением всей группы вариантов исходного товара, другой магазин впереди; при отсутствии других остаются товары исходного магазина.
        home — категории интересов и видимых просмотров с исключением купленного и групп просмотренных;
        без интересов популярные. Пустая персональная выдача заменяется популярной.
        Квота магазина ceil(limit/4), затем добор при нехватке других кандидатов.
        Порядок: salesCount, ratingsCount, averageRating, updatedAt по убыванию, затем хеш offerId.
        deliveryRegion ограничивает все виды рекомендаций; неизвестный регион — 400.
        Для гостя и вошедшего Cache-Control: private, no-store.
        Публичная цена читается из локальной проекции; сервер магазинов не вызывается.
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - name: context
          in: query
          required: true
          schema: { type: string, enum: [home, offer] }
        - name: offerId
          in: query
          description: Обязателен только для context=offer.
          schema: { type: string }
        - name: viewed
          in: query
          description: >-
            Просмотренные offerId, только для интересов context=home (в offer игнорируются).
            До 20 значений до удаления повторов; повторы схлопываются.
            Невалидный ID или превышение лимита — 400 catalog.invalid_query.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, pattern: '^[^~]+~[^~]+$' }
        - name: deliveryRegion
          in: query
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "200":
          description: Предложения и причина рекомендации.
          content:
            application/json:
              schema:
                type: object
                required: [items, reason]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Offer" } }
                  reason: { type: string, enum: [similar, personal, popular] }
        "400": { description: Некорректный контекст или параметры }
        "404": { description: Исходное предложение недоступно }
  /api/v1/catalog/offers:
    get:
      tags: [catalog]
      summary: Выдача предложений
      description: |
        Публичная цена одинакова для гостя и вошедшего покупателя.
        Каталог читает публичные цены из проекции без сервера магазинов.
        Только опубликованные предложения. category — узел дерева площадки, включая потомков.
        Канонические фильтры: attr.<код>=значение; повтор параметра означает OR,
        разные коды — AND. Для number: attr.<код>.min и attr.<код>.max (включительно),
        либо точное значение. Неизвестный код, неверный тип/словарь/диапазон — 400.
        Пример: ?category=c1&attr.a1=v1&attr.a1=v2&attr.a2.min=1.5&attr.a2.max=10.
        Отбор по характеристикам разрешён по кодам панели выбранной области.
        Фасеты считаются до пагинации со всеми фильтрами, кроме собственного; category — со всеми.
        Порядок фасетов листа задан схемой. Ветка использует собственные приоритеты или пересечение
        фильтров листьев, выдача без категории — общее пересечение. primary задаёт группу каждого фасета.
        Максимум 32 характеристики в панели, плюс до четырёх встроенных фасетов по контексту.
        facets=none отключает все фасеты. Список выбирает перечисленные доступные встроенные,
        attributes добавляет характеристики выбранной панели.
        API обновляется раньше витрины: предыдущая версия отклоняет новые none/attributes/повторы.
        Размер страницы не определяет выбор фасетов. Фильтры и total от селекторов не меняются.
        Числа: min/max; остальные: до 256 наиболее частых значений с count.
        При пустой выдаче фасеты могут содержать варианты после снятия собственного фильтра.
      operationId: listOffers
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - name: ids
          in: query
          style: form
          explode: true
          schema: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
          description: >-
            offerId вида tenantId~productId, от 1 до 20 значений до схлопывания повторов.
            Первое вхождение задаёт порядок. Пустой или невалидный id — 400 catalog.invalid_query.
            Не сочетается с q, tenant, groupId, category, priceMin, priceMax, inStock,
            attr.*, sort, limit, offset, track (даже пустыми) — 400 catalog.invalid_query.
            deliveryRegion и deliveryCarrier допустимы. Цены учитывают необязательного покупателя.
            Отсутствующие, скрытые, снятые с публикации предложения и предложения без цены пропускаются.
            items идут в порядке ids, без description, assets и variants, с контекстом доставки.
            facets всегда [], total — число items, limit — число уникальных ids, offset — 0.
            Ошибка индекса по любому id — 503 для всего ответа.
        - name: deliveryCarrier
          in: query
          schema: { type: string }
          description: Код перевозчика; передаётся вместе с deliveryRegion.
        - name: deliveryRegion
          in: query
          schema: { type: string }
          description: Код ISO 3166-2 RU из ПВЗ.
        - name: track
          in: query
          schema: { type: string, enum: ['true', '1'] }
          description: >-
            Учесть отправленный поиск в популярных запросах площадки. Передавать только при
            отправке поиска, не для подсказок или изменения фасетов. Без параметра учёт выключен.
            Учитывается только при непустом q и offset=0; иначе игнорируется.
            Любое значение, кроме true и 1, — 400.
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
          description: Строка поиска, не более 32 слов после свёртки пробелов.
        - name: exact
          in: query
          schema: { type: boolean, default: false }
          description: >-
            Искать как набрано: без исправления опечаток, раскладки и транслита.
            Словари, стоп-слова, контекст разделов, partial, фильтры, фасеты и сортировка сохраняются.
            Только true или false, один раз; пустое и любое другое значение — 400 catalog.invalid_query.
            Без параметра или при false поведение прежнее; служебное поле движку отправляется только при true.
        - name: tenant
          in: query
          style: form
          explode: true
          schema: { type: array, maxItems: 100, items: { type: string } }
          description: Магазины (ИЛИ); повторы удаляются.
        - { name: groupId, in: query, schema: { type: string }, description: Группа вариантов; требует ровно один tenant }
        - { name: category, in: query, schema: { type: string }, description: Категория площадки с потомками }
        - name: categoryId
          in: query
          schema: { type: string }
          description: Псевдоним category. Повторы или разные значения двух имён — 400.
        - { name: priceMin, in: query, schema: { type: number, multipleOf: 0.01, minimum: 0, maximum: 9999999999999.99 }, description: Рубли }
        - { name: priceMax, in: query, schema: { type: number, multipleOf: 0.01, minimum: 0, maximum: 9999999999999.99 }, description: Рубли }
        - { name: inStock, in: query, schema: { type: boolean } }
        - name: facets
          in: query
          style: form
          explode: true
          allowEmptyValue: true
          schema:
            oneOf:
              - type: string
                enum: [none]
              - type: array
                maxItems: 5
                uniqueItems: true
                items:
                  type: string
                  enum: [category, tenant, inStock, price, attributes]
          description: >-
            Список через запятую и/или повтором параметра, без пробелов. Без селекторов возвращается панель области.
            none даёт пустой массив. Список выбирает указанные доступные встроенные фасеты.
            Код attributes включает характеристики панели.
            Неизвестный код, повтор кода, none с другим значением — 400.
            Устаревший facets= сохраняет только атрибуты, с attributeFacets=false отключает всё.
            В отличие от PR44, частичный список без флага больше не добавляет атрибуты автоматически.
        - name: attributeFacets
          in: query
          deprecated: true
          schema: { type: boolean }
          description: >-
            Псевдоним PR44 принимает строго true/false один раз. Без facets false оставляет доступные
            встроенные фасеты, true сохраняет всю панель. С явным списком true добавляет attributes,
            false оставляет выбранные доступные встроенные фасеты.
            Явные attributes с false или none с true несовместимы (400). Новым клиентам использовать facets.
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, price_asc, price_desc, newest, rating], default: relevance }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: "offset + limit ≤ 10000" }
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "200":
          description: Страница выдачи
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferPage" }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/catalog/variants/{tenantId}/{groupId}:
    get:
      tags: [catalog]
      summary: Все видимые варианты группы продавца
      operationId: getOfferVariants
      description: >-
        Отдельный запрос перед рендером карточки. Публичная цена одинакова для всех покупателей.
        Порядок options — порядок осей; до 200 предложений, truncated указывает на технический потолок.
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Варианты группы; пустые options и items, если доступных вариантов нет
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfferVariants" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/catalog/offers/{offerId}:
    get:
      tags: [catalog]
      summary: Карточка предложения
      description: >-
        Публичная цена читается из индекса. HTTP 200 для существующего видимого предложения;
        оформление проверяет цену и наличие заново.
      operationId: getOffer
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - name: deliveryCarrier
          in: query
          schema: { type: string }
          description: Код перевозчика; передаётся вместе с deliveryRegion.
        - name: deliveryRegion
          in: query
          schema: { type: string }
          description: Код ISO 3166-2 RU из ПВЗ.
        - $ref: "#/components/parameters/OfferId"
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "200":
          description: Карточка с описанием
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/auth/call:
    post:
      tags: [auth]
      summary: Начать вход по звонку
      description: |
        Покупатель получает номер, на который нужно позвонить со своего
        телефона. Лимиты: по телефону и по адресу покупателя.
      operationId: startLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, examples: ["+7 (925) 123-45-67"] }
      responses:
        "201":
          description: Проверка заведена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Challenge" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/call/check:
    post:
      tags: [auth]
      summary: Состояние проверки звонком
      description: |
        Клиент опрашивает раз в 2–3 секунды. Когда звонок подтверждён,
        ответ ставит куку сессии `__Host-mp_session` (Secure, HttpOnly,
        SameSite=Lax) и содержит покупателя; токен в тело не попадает.
        Сессия выдаётся по проверке один раз: повтор — 409 buyer.challenge_used.
      operationId: checkLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId]
              properties:
                challengeId: { type: string, format: uuid }
      responses:
        "200":
          description: Состояние; при входе — Set-Cookie и покупатель
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "__Host-mp_session=…; Path=/; Secure; HttpOnly; SameSite=Lax"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/auth/refresh:
    post:
      operationId: refreshBuyerAccess
      summary: Обновить JWT по HttpOnly cookie __Host-mp_key
      description: Refresh-токен хранится только на backend. Access JWT не позволяет продлевать доступ.
      responses:
        "200":
          description: Обновлённый профиль и exp; JWT устанавливается в защищённой cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Buyer"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Выйти
      operationId: logout
      responses:
        "204":
          description: Сессия завершена, кука стёрта
  /api/v1/auth/webhooks/smsru:
    post:
      tags: [auth]
      summary: Оповещение sms.ru о проверке звонком
      description: |
        Служебный адрес для шлюза. Форма с записями `data[N]` вида
        «callcheck_status\n<check_id>\n<код>\n<время>». Состояние
        перечитывается у шлюза, телу не верим. Ответ — «100».
      operationId: smsruWebhook
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        "200":
          description: Принято
          content:
            text/plain:
              schema: { type: string, const: "100" }
  /api/v1/me:
    get:
      tags: [auth]
      summary: Покупатель сессии
      operationId: me
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200":
          description: Покупатель
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/cart:
    get:
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
      tags: [cart]
      summary: Корзина покупателя
      description: >-
        Нет корзины или она просрочена — пустая. Возвращается последний сохранённый снимок без cell-api.
        Для актуализации цен и наличия используется POST /api/v1/cart/verify; оформление проверяет их заново.
      operationId: getCart
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/cart/lines:
    post:
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
      tags: [cart]
      summary: Положить предложение
      description: То же предложение складывает количества; остаток сверяется с каталогом.
      operationId: addCartLine
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [offerId, quantity]
              properties:
                offerId: { type: string, examples: ["t1~p1"] }
                quantity: { type: integer, minimum: 1, maximum: 999 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/cart/lines/{offerId}:
    put:
      tags: [cart]
      summary: Задать количество
      description: Ноль убирает строку.
      operationId: setCartLineQuantity
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/OfferId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0, maximum: 999 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [cart]
      summary: Убрать строку
      operationId: removeCartLine
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/OfferId"
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/cart/groups/{tenantId}/promo-code:
    put:
      tags: [cart]
      operationId: setCartPromoCode
      summary: Проверить и сохранить промокод группы магазина
      description: Неверный код возвращается как valid=false с причиной; Cache-Control private, no-store.
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [cart]
      operationId: deleteCartPromoCode
      summary: Удалить промокод группы магазина
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/cart/verify:
    post:
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
      tags: [cart]
      summary: Перепроверить у магазинов
      description: Цена и наличие спрашиваются у каждого магазина; строки получают пометку issue.
      operationId: verifyCart
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/delivery/carriers:
    get:
      tags: [delivery]
      summary: Подключённые перевозчики
      description: Для переключателя карты; карта показывает пункты одного перевозчика.
      operationId: listCarriers
      responses:
        "200":
          description: Перевозчики
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Carrier" }
  /api/v1/delivery/pickup-points:
    get:
      tags: [delivery]
      summary: Пункты выдачи перевозчика
      description: Справочник перевозчика в городе; кэш на час. Без bbox — страницы списка, с bbox — до 500 точек и точное
        число совпадений.
      operationId: listPickupPoints
      parameters:
        - name: carrier
          in: query
          required: true
          schema:
            type: string
            enum:
              - cdek
              - yandex
        - name: city
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: bbox
          in: query
          description: Юг,запад,север,восток WGS84 через запятую. При наличии limit=500, offset=0.
          schema:
            type: string
            examples:
              - 55.6,37.4,55.9,37.8
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Страница ПВЗ
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - offset
                  - limit
                  - refineArea
                  - bounds
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PickupPoint" }
                  total:
                    type: integer
                    minimum: 0
                    description: Точное число разрешённых точек в области или списке
                  refineArea:
                    type: boolean
                    description: В области больше 500 точек; увеличьте карту
                  bounds:
                    type:
                      - array
                      - 'null'
                    minItems: 4
                    maxItems: 4
                    items:
                      type: number
                    description: Охват разрешённых регионов города, юг/запад/север/восток
                  offset:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                    minimum: 1
                    maximum: 500
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/checkout:
    post:
      tags: [checkout]
      summary: Собрать покупку из корзины
      description: |
        Повтор с тем же Idempotency-Key отдаёт ту же покупку.
        Изменение цен или скидок — 409 checkout.changed: корзина перепроверена,
        перечитайте её и создайте покупку заново. Отказ кода — 400 checkout.promo_invalid;
        измените код в корзине и создайте новую покупку.
      operationId: createCheckout
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_:.-]{8,128}$" }
      responses:
        "201": { $ref: "#/components/responses/Checkout" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503":
          description: cart.seller_unreachable — магазин не ответил на перепроверку.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/checkout/{checkoutId}:
    get:
      tags: [checkout]
      summary: Покупка
      operationId: getCheckout
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "200": { $ref: "#/components/responses/Checkout" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/delivery/quotes:
    post:
      tags: [checkout]
      summary: Выбрать пункт выдачи и посчитать доставку
      description: |
        Расчёт спрашивается у каждого продавца покупки по его договору.
        Продавец, который не везёт, получает quote.status unavailable с
        причиной из словаря (`reason`); не ответивший, ответивший не по
        контракту или выключивший участие — reason seller_unreachable.
      operationId: quoteCheckoutDelivery
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/CheckoutId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [carrier, pickupPointCode, city]
              properties:
                carrier: { type: string }
                pickupPointCode: { type: string }
                city: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/confirm:
    post:
      tags: [checkout]
      summary: Подтвердить покупку
      description: |
        Отказ кода — 400 checkout.promo_invalid: измените код в корзине и создайте новую покупку.
        Цены, скидки и наличие перепроверяются у магазинов, устаревшая доставка
        пересчитывается. Изменились цены или скидки — 409 checkout.changed: покупка уже
        обновлена, её нужно перечитать и подтвердить заново. Подтверждённая
        покупка отдаётся как есть.
      operationId: confirmCheckout
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants:
    get:
      tags: [operator]
      summary: Участники
      operationId: listParticipants
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - { name: trust, in: query, schema: { type: string, enum: [probation, trusted] } }
        - { name: stage, in: query, schema: { $ref: "#/components/schemas/ParticipationStage" } }
        - { name: queue, in: query, schema: { type: boolean }, description: Кандидаты с awaitingReview и валидной доставкой }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "200":
          description: Страница участников
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
      tags: [operator]
      summary: Завести участника
      description: Магазин должен быть в зеркале реестра платформы. Новый участник скрыт.
      operationId: createParticipant
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenantId, name]
              properties:
                tenantId: { type: string }
                name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}:
    get:
      tags: [operator]
      summary: Участник
      operationId: getParticipant
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/TenantId"
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "200": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}/enable:
    post:
      tags: [operator]
      summary: Показать участника в каталоге
      operationId: enableParticipant
      description: Любой переход в connected без готовой карточки — 409 participant.card_not_ready.
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                note: { type: string, maxLength: 2000 }
      responses:
        "200": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}/disable:
    post:
      tags: [operator]
      summary: Скрыть участника из каталога
      operationId: disableParticipant
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                reason: { type: string }
                note: { type: string, minLength: 1, maxLength: 2000, description: Непустая после TrimSpace. }
      responses:
        "200": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/orders:
    post:
      tags: [checkout]
      summary: Поставить создание заказов в очередь
      description: >-
        Проверяет покупку и свежие расчёты. Намерение, списание корзины и задачи outbox
        фиксируются атомарно; ответ creating_orders не ждёт создания заказов в магазинах.
        Повтор возвращает сохранённое состояние без новых задач.
        Единый срок оплаты всех заказов — 10 минут от записи намерения; повтор его не продлевает.
        Без PAYMENT_STUB — 503 checkout.payment_unavailable до изъятия корзины.
        Новая плата — 409 DELIVERY_CHANGED с checkout и новыми расчётами.
        Отказ промокода при фоновом создании отражается в состоянии группы:
        status=price_changed, lastErrorCode=checkout.promo_invalid, reason — причина отказа,
        cartReturned=true после полного возврата строк в корзину. Код корзины имеет приоритет
        над кодом покупки; при совпадении кодов сохраняется причина отказа, при пустом коде — код покупки.
        Остальные магазины продолжают оформление. Код и скидки передаются в заказ магазина.
        Опрос GET покупки читает только базу. При creationComplete=true все группы получили итог;
        оплата возможна только за созданные заказы. Срок создания — 15 секунд от фиксации намерения.
        По истечении группа unconfirmed возвращается в корзину; reconciliationRequired
        означает незавершённую сверку возможного заказа магазина.
      operationId: createCheckoutOrders
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/CheckoutId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact]
              additionalProperties: false
              properties:
                contact:
                  type: object
                  required: [phone, name]
                  additionalProperties: false
                  properties:
                    phone: { type: string }
                    name: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/cancel:
    post:
      tags: [checkout]
      summary: Отменить покупку до начала оплаты
      description: >-
        Только владелец. Повтор безопасен. Товары возвращаются в корзину существующим
        механизмом частичного возврата. Оплата закрывается сразу. До подтверждения команды
        reconciliationRequired=true не означает подтверждённую магазином отмену.
        Группа с возможным заказом получает cancellation_requested; без попытки создания — rejected.
        Отмена выполняется через outbox командой cancel-by-checkout; cancelled или absent подтверждает отмену.
        ORDER_NOT_CANCELLABLE оставляет группу на сверке с причиной для оператора.
        cancelled означает подтверждение магазина.
        Заказ и резерв живут у магазина до подтверждения отмены или expiresAt.
        При неизвестном результате или подтверждённой оплате — 409 checkout.transition;
        достоверный отказ первой оплаты без оплаченных групп снова разрешает отмену.
      operationId: cancelCheckout
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/groups/{tenantId}/remove:
    post:
      tags: [checkout]
      summary: Убрать магазин из покупки
      description: >-
        Явное решение владельца покупки. Товары возвращаются в корзину, возможный заказ
        отменяется через cancel-by-checkout. Другие заказы сохраняются. Покупка становится
        draft с новым составом и суммой; оплата требует повторного подтверждения.
        Удаление последнего магазина отменяет покупку.
        Оплаченную группу и покупку с начатым неопределённым платежом изменять нельзя.
        Повтор удаления безопасен.
      operationId: removeCheckoutGroup
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/CheckoutId"
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/groups/{tenantId}/cancel-order:
    post:
      tags: [checkout]
      summary: Отменить оплаченный заказ одного магазина
      description: >-
        Владелец покупки, до передачи перевозчику (paid, assembled). Заказы других магазинов продолжаются,
        деньги возвращает магазин. Итог — returned с reason cancelled_before_shipment; повтор безопасен.
        Уехавший заказ — 409 checkout.order_not_cancellable.
      operationId: cancelCheckoutGroupOrder
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/CheckoutId"
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/groups/{tenantId}/return-request:
    post:
      tags: [checkout]
      summary: Подать заявку на возврат заказа магазина
      description: >-
        Владелец покупки, одна заявка на полученный заказ. Решает магазин: согласие — статус returned,
        отказ — returnRequest.status rejected с comment. Повтор открытой заявки безопасен;
        иначе 409 checkout.return_unavailable.
      operationId: requestCheckoutGroupReturn
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - $ref: "#/components/parameters/CheckoutId"
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [not_fit, defective, not_as_described, changed_mind]
      responses:
        "200": { $ref: "#/components/responses/Checkout" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/checkout/{checkoutId}/pay:
    post:
      tags: [checkout]
      summary: Открыть единую кассу покупки
      description: >-
        Только владелец; creationComplete=true. Без PAYMENT_STUB — 503 checkout.payment_unavailable.
        expiresAt группы — действующий срок: удержание, если установлено, иначе срок от намерения.
        После проверки готовности параллельно запрашивается однократное удержание готовых групп
        на 5 минут от команды магазину. Любой отказ закрывает кассу: 503 checkout.payment_unavailable,
        при ORDER_PAYMENT_EXPIRED — 409 checkout.payment_expired. Успехи других групп сохраняются.
        Повтор вызывает только группы без сохранённого удержания и не продлевает сроки.
        Действующий срок доступной к оплате части покупки — минимум expiresAt её групп.
        Pending или временное снятие публикации сохраняет заказ и срок; оплата приостановлена
        с 409 checkout.payment_paused и актуальной покупкой до возвращения товара.
        Нечего оплачивать (включая уже оплаченную покупку) — 409 checkout.transition.
        Истёкшее окно создания сохраняет группу в составе до явной команды покупателя;
        группа с заказом при сбое опроса учитывается по последнему известному статусу.
        Приостановленные и просроченные группы не входят в текущую сумму кассы;
        если доступных групп не осталось, возвращается соответствующая ошибка оплаты.
        Плата за доставку входит в сумму.
      operationId: payCheckout
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200":
          description: Относительный адрес кассы на том же origin
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, example: /api/v1/payment-stub/checkoutId }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/payment-stub/{checkoutId}:
    get:
      tags: [checkout]
      summary: Служебная касса-заглушка — paymentStub
      description: >-
        HTML-касса Go, только владелец; POST-формы без полей, проверка Origin.
        До показа суммы проверяется now < expiresAt всех ожидающих заказов (иначе 409).
        При ошибке, включая истёкший access, возвращается HTML с сообщением и ссылкой возврата, без JSON.
        Оплаченная покупка показывает «Покупка оплачена» и ссылку возврата без форм.
      operationId: paymentStub
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200":
          description: Остаток к оплате с доставкой, формы Оплатить и Отказаться
          content:
            text/html:
              schema: { type: string }
        "401":
          description: HTML с сообщением и ссылкой возврата
          content:
            text/html:
              schema: { type: string }
        "403":
          description: HTML с сообщением и ссылкой возврата
          content:
            text/html:
              schema: { type: string }
        "404":
          description: HTML с сообщением и ссылкой возврата
          content:
            text/html:
              schema: { type: string }
        "409":
          description: HTML с сообщением и ссылкой возврата
          content:
            text/html:
              schema: { type: string }
        "503":
          description: HTML с сообщением и ссылкой возврата
          content:
            text/html:
              schema: { type: string }
  /api/v1/payment-stub/{checkoutId}/confirm:
    post:
      tags: [checkout]
      summary: Служебная касса-заглушка — confirmStubPayment
      description: >-
        Только владелец; POST-форма без полей, проверка Origin.
        Всегда 303, включая ошибку авторизации при истёкшем access.
        Витрина обновляет сессию и читает покупку; возврат не является подтверждением оплаты.
        До вызовов сервера проверяется now < expiresAt всех ожидающих заказов.
        Вызовы идут до первого отказа; STATE/AMOUNT, ORDER_NOT_FOUND и MARKETPLACE_DISABLED
        означают checkout.transition (409). Отсутствие маршрута (404 без ORDER_NOT_FOUND) или
        технический сбой — checkout.payment_unavailable (503). Эти ошибки также заканчиваются редиректом.
        После частичного сбоя опрос покажет состояние групп. Повтор безопасен: сервер идемпотентен
        и после отгрузки/доставки. При конфликте версий локальная запись повторяется до трёх раз
        без повторных вызовов сервера. Если конфликты продолжаются, состояние восстановит опрос.
      operationId: confirmStubPayment
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "303":
          description: На MARKETPLACE_PUBLIC_URL/checkout/{checkoutId}/return при любом результате
          headers:
            Location:
              schema: { type: string, format: uri }

  /api/v1/payment-stub/{checkoutId}/cancel:
    post:
      tags: [checkout]
      summary: Служебная касса-заглушка — cancelStubPayment
      description: >-
        Только владелец; POST-форма без полей, проверка Origin. Покупка не меняется.
        Всегда 303, включая ошибку авторизации при истёкшем access.
        Витрина обновляет сессию и читает покупку; отказ от кассы не отменяет заказы.
      operationId: cancelStubPayment
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "303":
          description: На MARKETPLACE_PUBLIC_URL/checkout/{checkoutId}/return при любом результате
          headers:
            Location:
              schema: { type: string, format: uri }

  /api/v1/checkout/{checkoutId}/return:
    get:
      tags: [checkout]
      summary: Экран проверки оплаты; параметры кассы не подтверждают оплату
      operationId: checkoutPaymentReturn
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/CheckoutId"
      responses:
        "200":
          description: Проверяем оплату; клиент опрашивает GET checkout
          content:
            application/json:
              schema:
                type: object
                required: [status, message, checkoutId]
                properties:
                  status: { type: string, const: checking_payment }
                  message: { type: string }
                  checkoutId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/orders:
    get:
      tags: [checkout]
      summary: Покупки владельца со статусами групп, треками и ПВЗ
      description: >-
        Только покупки с хотя бы одним известным orderId. Созданная неоплаченная группа
        даёт статус покупки awaiting_payment даже во время создания остальных групп;
        оплата всё равно требует creationComplete=true. GET покупки показывает исходный creating_orders.
      operationId: listBuyerOrders
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - name: after
          in: query
          schema: { type: string, format: uuid }
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "200":
          description: До 100 покупок; next — последний ID для следующей страницы
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/operator/checkouts:
    get:
      tags: [operator]
      summary: Покупки; stuck=true — незавершённая отмена или ожидание оплаты от 15 минут
      operationId: listOperatorCheckouts
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/MoneyUnit" }
        - name: after
          in: query
          schema: { type: string, format: uuid }
        - name: stuck
          in: query
          schema: { type: boolean }
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "200":
          description: До 100 покупок; next — последний ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/operator/reference:
    get:
      tags: [reference]
      summary: Словари с количеством записей и кандидатов
      operationId: operatorReferenceDictionaries
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      responses:
        "200":
          description: Список словарей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceDictionaryList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/v1/operator/reference/import:
    post:
      tags: [reference]
      summary: Создать словари и применить пакет JSON/YAML одной транзакцией
      operationId: operatorReferenceImport
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      description: |
        Тело до 32 МиБ; 1000 словарей и 100000 записей. Загрузка и обработка
        имеют общий бюджет 120 секунд; на ответ после отмены оставлено ещё 5 секунд. Неизвестные и повторные
        ключи, якоря, ссылки и несколько YAML-документов запрещены. Один пакет
        либо применяется целиком, либо полностью откатывается. Повтор релиза с
        той же канонической суммой — no-op; изменение данных того же релиза,
        понижение релиза, другой kind или normalizer — 409. Правки оператора,
        rejected/deprecated и непустая metadata сохраняются правилами поставки.
        taxonomy bindings и публикация taxonomy не меняются. Для cookie нужны
        Origin и X-Requested-With: KvazarOperator, как на других операторских мутациях.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceImportPackage" }
          application/yaml:
            schema: { type: string, description: YAML-документ ReferenceImportPackage }
          text/yaml:
            schema: { type: string, description: YAML-документ ReferenceImportPackage }
      responses:
        "200":
          description: Пакет применён или уже применялся
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceImportResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/operator/reference/{dict}/entries:
    get:
      tags: [reference]
      summary: Страница записей; очередь кандидатов — status=candidate
      operationId: operatorReferenceEntries
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      description: Порядок — по частоте встреч, затем по ключу.
      parameters:
        - { $ref: "#/components/parameters/ReferenceDictionary" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ReferenceStatus" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          headers:
            ETag:
              description: 'Голова словаря для массового решения: "reference-N"'
              schema: { type: string }
          description: Страница записей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceEntryPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/operator/reference/{dict}/entries/review:
    post:
      tags: [reference]
      summary: Атомарно подтвердить или отклонить выбранных кандидатов словаря
      operationId: operatorReferenceReview
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ReferenceDictionary" }
        - name: If-Match
          in: header
          required: true
          description: 'Один строгий ETag головы словаря из списка записей: "reference-N", N >= 0; не ревизия записи'
          schema: { type: string, pattern: '^"reference-(0|[1-9][0-9]*)"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferenceReviewRequest" }
      responses:
        "200":
          description: Все выбранные кандидаты обработаны одной транзакцией; пустой allCandidates не меняет ревизию
          headers:
            ETag:
              description: 'Новая голова словаря: "reference-N"'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceReviewResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
      description: >-
        Только candidate → confirmed или rejected. ids адресует точный выбор; allCandidates выбирает всех
        кандидатов текущего словаря за вычетом excludedIds, не загружая весь набор в браузер.
        Чужой, отсутствующий или уже не candidate id, в том числе в исключениях, отклоняет весь запрос с 409.
        Устаревшая голова — 409 reference.dictionary_changed. Не более 10000 фактических целей и 10000 id/исключений;
        превышение — 400 reference.limit_exceeded целиком, без обрезки. Тело до 512 КиБ, общий бюджет 25 секунд,
        включая ожидание блокировки. Ошибка или отмена откатывает все пачки, журнал и outbox.
        После сетевой ошибки или 503 перечитать список; автоматически повторять решение нельзя.

  /api/v1/operator/reference/{dict}/entries/{id}:
    get:
      tags: [reference]
      summary: Запись по id; объединённая отдаётся вместе с выжившей
      operationId: operatorReferenceEntry
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/ReferenceDictionary" }
        - { $ref: "#/components/parameters/ReferenceEntryId" }
      responses:
        "200": { $ref: "#/components/responses/ReferenceEntry" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [reference]
      summary: Переименовать, сменить статус или свободные поля по ревизии
      operationId: operatorReferenceUpdateEntry
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      description: |
        Переходы статуса: candidate → confirmed | rejected, confirmed → deprecated.
        Прежнее каноническое написание остаётся вариантом. Устаревший If-Match —
        409 REFERENCE_ENTRY_CHANGED.
      parameters:
        - { $ref: "#/components/parameters/ReferenceDictionary" }
        - { $ref: "#/components/parameters/ReferenceEntryId" }
        - { $ref: "#/components/parameters/ReferenceIfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                canonical: { type: string, maxLength: 120 }
                status: { type: string, enum: [confirmed, rejected, deprecated] }
                metadata: { $ref: "#/components/schemas/ReferenceMetadata" }
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/ReferenceEntry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/reference:
    get:
      tags: [reference]
      summary: Доступные словари и их ревизии
      operationId: referenceDiscovery
      security: [{ referenceReadToken: [] }, { operatorToken: [] }, { operatorSession: [] }]
      responses:
        "200":
          description: Список словарей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceDiscovery" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/internal/reference:
    get:
      tags: [reference]
      summary: Доступные словари и их ревизии
      operationId: referenceDiscoveryV1
      security: [{ referenceReadToken: [] }, { operatorToken: [] }, { operatorSession: [] }]
      responses:
        "200":
          description: Список словарей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceDiscovery" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/internal/reference/search-synonyms/snapshot:
    get:
      tags: [reference]
      summary: Полный снимок общих поисковых синонимов
      operationId: searchSynonymsSnapshot
      security: [{ referenceReadToken: [] }, { operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Полный снимок, до 512 КиБ
          headers:
            ETag:
              schema: { type: string, example: '"42"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchSynonymSnapshot" }
        "304":
          description: Действует уже загруженная ревизия
          headers:
            ETag:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/operator/reference/search-synonyms/rules:
    get:
      tags: [reference]
      summary: Направления, источники и последние каталожные проверки
      operationId: searchSynonymsRules
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - name: after
          in: query
          schema: { type: string, maxLength: 64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Страница направлений в порядке идентификатора
          content:
            application/json:
              schema:
                type: object
                required: [revision, entries]
                properties:
                  revision: { type: integer, format: int64, minimum: 0 }
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/SearchSynonymEntry" }
                  nextAfter: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/operator/reference/search-synonyms/rules/{id}:
    patch:
      tags: [reference]
      summary: Выключить направление
      operationId: disableSearchSynonymRule
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, enabled, reason]
              properties:
                expectedRevision: { type: integer, format: int64, minimum: 0 }
                enabled: { type: boolean, enum: [false] }
                reason: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: Ревизия после отключения
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision: { type: integer, format: int64, minimum: 0 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/reference/search-synonyms/stop-list:
    get:
      tags: [reference]
      summary: Прочитать общий стоп-лист
      operationId: getSearchSynonymStopList
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      responses:
        "200":
          description: Общий стоп-лист и ревизия снимка
          content:
            application/json:
