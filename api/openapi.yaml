openapi: 3.1.0
info:
  title: Proshop Marketplace API
  version: 0.4.0
  description: |
    API федеративного маркетплейса для витрины (Nuxt 4) и панели оператора
    (Vue 3). Все суммы — целые копейки. Время — RFC 3339 в UTC. Ошибка —
    `{"error": {"code": "<ключ>", "message": "<текст>"}}`; код ответа
    выбирается по классу ошибки: invalid → 400, unauthorized → 401, forbidden → 403,
    not_found → 404, conflict → 409, too_many_requests → 429,
    unavailable → 503, internal → 500. Ключ ошибки стабилен, текст — для
    человека. Идентификатор запроса — заголовок `X-Request-Id` (входящий,
    если по формату, иначе выданный сервером).
servers:
  - url: http://localhost:8080
    description: make dev
tags:
  - name: internal
    description: Машинный API сервера
  - name: moderation
  - name: service
  - name: taxonomy
  - name: catalog
  - name: buyer
  - name: auth
  - name: cart
  - name: delivery
  - name: checkout
  - name: operator
  - name: reference
    description: |
      Реестр справочных сущностей для бэкендов платформы (сервер магазина, поиск).
      Чтение — токен читателя REFERENCE_READ_TOKEN, мутации — OPERATOR_TOKEN или сессия
      оператора; браузеру токены не выдаются.
      Все ответы несут schemaVersion и revision, поля только добавляются.
      Контракт — docs/reference.md.
paths:
  /api/v1/buyer/profile:
    get:
      tags: [buyer]
      operationId: getBuyerProfile
      summary: Профиль и число снижений цены
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200":
          description: Ответ; Cache-Control private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerProfile"
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    patch:
      tags: [buyer]
      operationId: patchBuyerProfile
      summary: Изменить профиль покупателя
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyerProfilePatch"
      responses:
        "200":
          description: Ответ; Cache-Control private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerProfile"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/region:
    get:
      tags: [buyer]
      operationId: getBuyerRegion
      summary: Подсказка региона покупателя
      security: [{}, { sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200":
          description: Ответ; Cache-Control private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerRegionResult"
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/buyer/favorites:
    get:
      tags: [buyer]
      operationId: listBuyerFavorites
      summary: Страница избранных предложений
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Ответ; Cache-Control private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerFavorites"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/buyer/price-watches:
    get:
      tags: [buyer]
      operationId: listBuyerPriceWatches
      summary: Наблюдения за ценами
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200":
          description: Ответ; Cache-Control private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerPriceWatches"
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/buyer/subscriptions/shops:
    get:
      tags: [buyer]
      operationId: listBuyerShopSubscriptions
      summary: Публичные магазины в подписках
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      responses:
        "200":
          description: Ответ; Cache-Control private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyerSubscriptions"
        "401": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/buyer/favorites/{offerId}:
    put:
      tags: [buyer]
      operationId: putBuyerFavorite
      summary: Добавить предложение в избранное
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Состояние сохранено; повтор идемпотентен
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [buyer]
      operationId: deleteBuyerFavorite
      summary: Удалить предложение из избранного
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Состояние сохранено; повтор идемпотентен
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/buyer/price-watches/{offerId}:
    put:
      tags: [buyer]
      operationId: putBuyerPriceWatch
      summary: Следить за ценой или изменить цель
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyerWatchTarget"
      responses:
        "204":
          description: Состояние сохранено; повтор идемпотентен
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [buyer]
      operationId: deleteBuyerPriceWatch
      summary: Прекратить наблюдение за ценой
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Состояние сохранено; повтор идемпотентен
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/buyer/subscriptions/shops/{tenantId}:
    put:
      tags: [buyer]
      operationId: putBuyerShopSubscription
      summary: Подписаться на магазин
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Состояние сохранено; повтор идемпотентен
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    delete:
      tags: [buyer]
      operationId: deleteBuyerShopSubscription
      summary: Отписаться от магазина
      security: [{ sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Состояние сохранено; повтор идемпотентен
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/shops:
    get:
      tags: [catalog]
      operationId: listShops
      summary: Магазины с готовой карточкой
      security: []
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Карточка магазина
          headers:
            ETag: { schema: { type: string }, description: Версия публичного снимка }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopPage" }
        "304":
          description: Снимок не изменился (If-None-Match)
          headers:
            ETag: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/shops/{slug}:
    get:
      tags: [catalog]
      operationId: getShop
      summary: Публичная шапка магазина
      description: >-
        Для вошедшего добавляется subscribed, ответ private, no-store. Анонимный ответ
        публичный с ETag; недействительный вход считается анонимным. Vary — Cookie, Authorization.
      security: [{}, { sessionCookie: [] }, { sessionBearer: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Карточка магазина
          headers:
            ETag: { schema: { type: string }, description: Версия публичного снимка }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopHeader" }
        "304":
          description: Снимок не изменился (If-None-Match)
          headers:
            ETag: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/internal/tenants/{tenantId}/store-card:
    get:
      tags: [internal]
      operationId: getStoreCard
      summary: Сводка карточки для сервера
      security: [{ serverApiToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "200":
          description: Карточка магазина
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/internal/tenants/{tenantId}/settings/sync:
    post:
      tags: [internal]
      operationId: syncStoreSettings
      summary: Поставить внеочередную сверку настроек
      security: [{ serverApiToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "202": { description: Сверка поставлена в outbox }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}/card/hide:
    post:
      tags: [operator]
      operationId: hideStoreCard
      summary: Скрыть пункт карточки с причиной
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, reason]
              properties:
                key: { type: string, enum: [slogan, logo] }
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: Карточка магазина
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}/card/hide/{key}:
    delete:
      tags: [operator]
      operationId: showStoreCard
      summary: Снять скрытие пункта карточки
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Карточка магазина
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/participants/{tenantId}/return:
    post:
      tags: [operator]
      summary: Вернуть кандидата с замечаниями
      operationId: returnParticipant
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                reason:
                  type: object
                  required: [code]
                  properties:
                    code: { type: string, description: Код moderation_reasons }
                note: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200": { $ref: "#/components/responses/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/internal/tenants/{tenantId}/participation:
    get:
      tags: [internal]
      summary: Состояние участия магазина
      operationId: getParticipation
      security: [{ serverApiToken: [] }]
      description: SERVER_API_TOKEN; пустая настройка — 404, отсутствующий или неверный Bearer — 401.
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "200":
          description: Участие магазина
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/internal/tenants/{tenantId}/participation/submit:
    post:
      tags: [internal]
      summary: Отправить возвращённого кандидата оператору снова
      operationId: submitParticipation
      security: [{ serverApiToken: [] }]
      description: SERVER_API_TOKEN; пустая настройка — 404, отсутствующий или неверный Bearer — 401.
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "200":
          description: Участие магазина
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participation" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/operator/moderation/cases:
    get:
      tags:
      - moderation
      summary: Очередь дел по времени открытия по убыванию
      operationId: moderationGetApiVOperatorModerationCases
      security:
      - operatorToken: []
      - operatorSession: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - total
                - limit
                - offset
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModerationCase'
                  total: &id001
                    type: integer
                    format: int64
                  limit: *id001
                  offset: *id001
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: moderation.case_conflict с текущим делом; moderation.case_stale; IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationConflict'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - &id005
        name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      - &id006
        name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: open
          enum:
          - open
          - allowed
          - rejected
          - superseded
          - all
      - name: tenantId
        in: query
        required: false
        schema: &id002
          type: string
      - name: source
        in: query
        required: false
        schema:
          type: string
          enum:
          - rule
          - operator
      - name: order
        in: query
        schema: {type: string, enum: [oldest, newest], default: oldest}
      - name: reason
        in: query
        schema: {type: string}
    post:
      tags:
      - moderation
      summary: Открыть дело вручную
      operationId: moderationPostApiVOperatorModerationCases
      security:
      - operatorToken: []
      - operatorSession: []
      responses:
        '201':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationCase'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: moderation.case_conflict с текущим делом; moderation.case_stale; IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationConflict'
        '500':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - offerId
              - note
              properties:
                offerId: *id002
                note: &id003
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: 1–2000 символов после TrimSpace
  /api/v1/operator/moderation/cases/{caseId}:
    get:
      tags:
      - moderation
      summary: Дело, карточка покупателя и история
      operationId: moderationGetApiVOperatorModerationCasesCaseid
      security:
      - operatorToken: []
      - operatorSession: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationCaseDetails'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: moderation.case_conflict с текущим делом; moderation.case_stale; IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationConflict'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: caseId
        in: path
        required: true
        schema: *id002
  /api/v1/operator/moderation/cases/{caseId}/allow:
    post:
      tags:
      - moderation
      summary: Решение по проверенной ревизии
      operationId: moderationPostApiVOperatorModerationCasesCaseidAllow
      security:
      - operatorToken: []
      - operatorSession: []
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationCase'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: moderation.case_conflict с текущим делом; moderation.case_stale; IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationConflict'
        '500':
          $ref: '#/components/responses/Error'
      parameters:
      - name: caseId
        in: path
        required: true
        schema: *id002
      - name: Idempotency-Key
        in: header
        required: false
        schema: *id002
        description: Ключ ограничен оператором. Исходный ответ хранится 24 часа; изменение запроса — 409 IDEMPOTENCY_KEY_REUSED.
      requestBody:
        required: true
        content:
          application/json:
            schema: &id004
              type: object
              required:
              - expectedVersion
              - note
              properties:
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 1
                reason: *id002
                note: *id003
  /api/v1/operator/moderation/cases/{caseId}/reject:
    post:
      tags:
      - moderation
