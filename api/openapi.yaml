        attributes: { $ref: "#/components/schemas/CanonicalAttributes" }
        published: { type: boolean }
    Publication:
      type: object
      required: [version, categoryId, attributes, issues, published]
      properties:
        version: { type: integer, format: int64 }
        categoryId: { type: string }
        categoryName: { type: string }
        categoryPath: { type: [array, "null"], items: { type: string } }
        attributes: { $ref: "#/components/schemas/CanonicalAttributes" }
        published: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [code]
            properties:
              attribute: { type: string }
              code:
                type: string
                enum: [taxonomy.card_missing, taxonomy.category_unknown, taxonomy.attribute_unknown,
                       taxonomy.type, taxonomy.required, taxonomy.enum_value, taxonomy.unpublished]
    Rating:
      type: [object, "null"]
      description: null при отсутствии оценок; магазин — средневзвешенное видимых предложений.
      required: [value, count]
      properties:
        value: { type: number, minimum: 0, maximum: 5, description: Балл округлён до одного знака после запятой }
        count: { type: integer, format: int64, minimum: 1 }
    ReviewPage:
      type: object
      required: [items, total]
      properties:
        total: { type: integer, minimum: 0 }
        items:
          type: array
          items:
            type: object
            required: [author, rating, text, createdAt]
            properties:
              author: { type: string, description: Имя без фамилии }
              rating: { type: integer, minimum: 1, maximum: 5 }
              text: { type: string }
              createdAt: { type: string, format: date-time }
    Facet:
      type: object
      required: [code, name, type, count, values]
      properties:
        buckets:
          type: array
          maxItems: 20
          description: Только price; границы в копейках, круглые суммы из движка. Без поддержки поле отсутствует.
          items:
            type: object
            required: [from, to, count]
            properties:
              from: { type: integer, format: int64, minimum: 0 }
              to: { type: integer, format: int64, minimum: 0 }
              count: { type: integer, minimum: 0 }
        code: { type: string, description: 'category, tenant, price, inStock или attr.<код>' }
        name: { type: string }
        type: { type: string, enum: [enum, number, string, boolean] }
        unit: { type: string }
        count: { type: integer, description: Число предложений с полем до пагинации }
        min: { type: number }
        max: { type: number }
        values:
          type: array
          maxItems: 256
          items:
            type: object
            required: [value, count]
            properties:
              value: { type: string }
              count: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        weeks:
          type: array
          description: Занятые понедельники при promotion.no_capacity.
          items: {type: string, format: date}
        checkout:
          $ref: "#/components/schemas/Checkout"
          description: Новый снимок при DELIVERY_CHANGED; требуется подтверждение.
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: ["catalog.offer_not_found"] }
            message: { type: string }
    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }
    Seller:
      type: object
      required: [slug, name, delivery, freeDeliveryFrom]
      properties:
        delivery: { $ref: "#/components/schemas/ParticipantDelivery" }
        freeDeliveryFrom: { type: integer, format: int64, minimum: 0 }
        slug: { type: string }
        name: { type: string }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
    Offer:
      description: При паре deliveryCarrier и deliveryRegion возвращает deliveryAvailable; вне зон товар виден, доставка недоступна.
      type: object
      required: [id, tenantId, productId, seller, name, categoryId, attributes, categories, price, basePrice, available, inStock, checkoutAvailable, updatedAt, rating]
      properties:
        rating: { $ref: "#/components/schemas/Rating" }
        deliveryAvailable: { type: boolean }
        categoryId: { type: string, description: Категория площадки }
        attributes: { $ref: "#/components/schemas/CanonicalAttributes" }
        id: { type: string, examples: ["t1~p1"] }
        tenantId: { type: string }
        productId: { type: string }
        seller: { $ref: "#/components/schemas/Seller" }
        name: { type: string }
        description: { type: string, description: Только в карточке }
        variants: { $ref: "#/components/schemas/OfferVariants", description: Только в карточке; один продавец и ценовой контекст }
        image: { type: string }
        url: { type: string }
        sku: { type: string }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Category" }
        price: { type: integer, format: int64, description: Цена продажи в копейках }
        basePrice: { type: integer, format: int64, description: Прайс магазина в копейках }
        available: { type: integer }
        inStock: { type: boolean }
        checkoutAvailable: { type: boolean, description: Продавец принимает оплату через маркетплейс }
        updatedAt: { type: string, format: date-time }
    OfferVariants:
      type: object
      required: [groupId, axis, items, truncated]
      properties:
        groupId: { type: string }
        axis:
          type: object
          required: [key, code, name]
          properties:
            key: { type: string }
            code: { type: string }
            name: { type: string }
        truncated: { type: boolean }
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [id, current, value, position, price, basePrice, available, inStock]
            properties:
              id: { type: string }
              current: { type: boolean }
              value: { type: string }
              position: { type: integer, minimum: 0 }
              price: { type: integer, format: int64 }
              basePrice: { type: integer, format: int64 }
              available: { type: integer }
              inStock: { type: boolean }
              image: { type: string }
              duplicate: { type: boolean }
    OfferPage:
      type: object
      required: [items, total, limit, offset, facets]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Offer" }
        facets:
          type: array
          items: { $ref: "#/components/schemas/Facet" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Challenge:
      type: object
      required: [challengeId, status, expiresAt]
      properties:
        challengeId: { type: string, format: uuid }
        status: { type: string, enum: [pending, confirmed, expired] }
        callPhone: { type: string, description: Номер для звонка цифрами }
        callPhonePretty: { type: string }
        expiresAt: { type: string, format: date-time }
    LoginResult:
      allOf:
        - $ref: "#/components/schemas/Challenge"
        - type: object
          properties:
            buyer: { $ref: "#/components/schemas/Buyer" }
            sessionExpiresAt: { type: string, format: date-time }
    Buyer:
      type: object
      required: [id, phone]
      properties:
        id: { type: string, format: uuid }
        exp: { type: integer, format: int64, description: Срок access JWT в Unix-секундах }
        phone: { type: string, description: Цифры в международном формате без плюса }
    OrderSeller:
      type: [object, "null"]
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    CartLine:
      type: object
      required: [offerId, tenantId, productId, name, quantity, price, amount, issue, addedAt, seller]
      properties:
        seller: { $ref: "#/components/schemas/OrderSeller" }
        offerId: { type: string }
        tenantId: { type: string }
        productId: { type: string }
        name: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 999 }
        price: { type: integer, format: int64, description: Снимок цены в копейках }
        amount: { type: integer, format: int64 }
        issue:
          type: [string, "null"]
          enum: [price_changed, not_enough_stock, unavailable, null]
          description: Пометка после перепроверки у магазина
        addedAt: { type: string, format: date-time }
    Cart:
      type: object
      required: [id, lines, total, version, expiresAt]
      properties:
        id: { type: string, format: uuid }
        lines:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/CartLine" }
        total: { type: integer, format: int64 }
        version: { type: integer, format: int64 }
        expiresAt: { type: string, format: date-time }
    Carrier:
      type: object
      required: [code, name]
      properties:
        code: { type: string, examples: [cdek, yandex] }
        name: { type: string }
    PickupPoint:
      type: object
      required: [carrier, code, name, address, city, location, schedule, refreshedAt]
      properties:
        regionCode: { type: string, description: "ISO 3166-2 RU; пусто при неизвестном соответствии" }
        carrier: { type: string }
        code: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        location:
          type: object
          required: [lat, lon]
          properties:
            lat: { type: number }
            lon: { type: number }
        schedule: { type: string }
        refreshedAt: { type: string, format: date-time }
    Quote:
      type: object
      required: [status, cost, subsidy, buyerCost, minDays, maxDays, expiresAt]
      properties:
        status: { type: string, enum: [available, unavailable] }
        reason:
          type: string
          enum: [carrier_not_connected, pickup_point_unavailable, no_rate, seller_unreachable]
          description: |
            Только при status unavailable. Закрытый словарь docs/server-contract.md:
            carrier_not_connected — у продавца нет этого перевозчика;
            pickup_point_unavailable — перевозчик не везёт в этот пункт;
            no_rate — тариф не рассчитан (вес, габариты, зона);
            seller_unreachable — продавец не ответил, повтор при подтверждении.
        cost: { type: integer, format: int64, description: Стоимость по договору продавца }
        subsidy: { type: integer, format: int64, description: Сколько оплачивает продавец }
        buyerCost: { type: integer, format: int64, description: Доля покупателя }
        minDays: { type: integer }
        maxDays: { type: integer }
        expiresAt: { type: string, format: date-time }
    CheckoutLine:
      type: object
      required: [offerId, productId, name, quantity, price, amount]
      properties:
        offerId: { type: string }
        productId: { type: string }
        name: { type: string }
        quantity: { type: integer }
        price: { type: integer, format: int64 }
        amount: { type: integer, format: int64 }
    CheckoutGroup:
      type: object
      required:
      - tenantId
      - externalCheckoutId
      - lines
      - goods
      - quote
      - status
      - paymentOrder
      - deliveryPrice
      - paymentUrl
      - returnFailed
      - pollFailures
      - nextPollAt
      - createFailures
      - createExhausted
      - seller
      properties:
        seller: { $ref: "#/components/schemas/OrderSeller" }
        tenantId: { type: string }
        status:
          type: string
          enum: ["", creating_order, awaiting_payment, paid, cancelled, shipped, delivered, returned, seller_unreachable, price_changed, delivery_unavailable]
        orderId: { type: string }
        paymentUrl:
          type: [string, "null"]
          format: uri
          description: Только текущая awaiting_payment и now < expiresAt; у остальных null.
        expiresAt: { type: string, format: date-time }
        paymentOrder: { type: integer }
        deliveryPrice: { type: integer, format: int64, minimum: 0, description: Плата на кассе этого магазина; 0 — строка доставки скрыта }
        reason: { type: string }
        track: { type: string }
        returnFailed: { type: boolean }
        returnReason: { type: string }
        returnRemaining:
          type: array
          items:
            type: object
            required: [offerId, quantity]
            properties:
              offerId: { type: string }
              quantity: { type: integer, minimum: 1 }
        pollFailures: { type: integer, minimum: 0, maximum: 5 }
        nextPollAt: { type: string, format: date-time }
        createFailures: { type: integer, minimum: 0, maximum: 5 }
        createExhausted: { type: boolean }
        lastErrorCode: { type: string }
        currentPrices:
          type: array
          items:
            type: object
            required: [productId, price]
            properties:
              productId: { type: string }
              price: { type: integer, format: int64, minimum: 0 }
        externalCheckoutId: { type: string, description: "<checkoutId>:<tenantId> — ключ заказа у магазина" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/CheckoutLine" }
        goods: { type: integer, format: int64 }
        quote:
          oneOf:
            - $ref: "#/components/schemas/Quote"
            - type: "null"
    Selection:
      type: object
      required: [carrier, pickupPointCode, city, address]
      properties:
        carrier: { type: string }
        pickupPointCode: { type: string }
        city: { type: string }
        address: { type: string }
    Checkout:
      type: object
      required: [id, status, groups, delivery, goodsTotal, deliveryTotal, total, version, createdAt, updatedAt, confirmedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [draft, confirmed, creating_orders, awaiting_payment, partially_paid, paid, cancelled] }
        groups:
          type: array
          items: { $ref: "#/components/schemas/CheckoutGroup" }
        delivery:
          oneOf:
            - $ref: "#/components/schemas/Selection"
            - type: "null"
        goodsTotal: { type: integer, format: int64 }
        deliveryTotal: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        confirmedAt: { type: [string, "null"], format: date-time }
        nextPayment:
          oneOf:
            - $ref: "#/components/schemas/PaymentLink"
            - type: "null"
    Subsidy:
      type: object
      required: [enabled, value, maxAmount]
      properties:
        enabled: { type: boolean }
        type: { type: string, enum: [fixed, percent] }
        value: { type: integer, format: int64, description: Копейки для fixed, процент для percent }
        maxAmount: { type: integer, format: int64, description: Потолок в копейках; 0 — без потолка }
    Participant:
      type: object
      required: [card, cardReady, cardMissing, trust, probationOffers, approvedOffers, tenantId, slug, name, stage, awaitingReview, lastDecision, deliveryValid, enabled, freeDeliveryFrom, delivery, subsidy, settingsSyncedAt, tenantStatus, visible, checkoutAvailable, version, createdAt, updatedAt]
      properties:
        card:
          type: object
          required: [slogan, logo, hidden]
          properties:
            slogan: { type: string }
            logo: { type: [string, "null"] }
            hidden: { type: array, items: { $ref: "#/components/schemas/StoreHidden" } }
        cardReady: { type: boolean }
        cardMissing: { type: array, items: { type: string } }
        trust: { type: string, enum: [probation, trusted] }
        probationOffers: { type: integer, minimum: 0 }
        approvedOffers: { type: integer, minimum: 0 }
        tenantId: { type: string }
        slug: { type: string }
        name: { type: string }
        stage: { $ref: "#/components/schemas/ParticipationStage" }
        awaitingReview: { type: boolean }
        deliveryValid: { type: boolean }
        lastDecision: { $ref: "#/components/schemas/ParticipationDecision" }
        enabled: { type: boolean, description: Включён оператором }
        freeDeliveryFrom: { type: integer, format: int64, minimum: 0 }
        delivery: { $ref: "#/components/schemas/ParticipantDelivery" }
        subsidy: { $ref: "#/components/schemas/Subsidy" }
        settingsSyncedAt: { type: [string, "null"], format: date-time }
        tenantStatus: { type: string, enum: [creating, active, suspended, deleting, deleted] }
        visible: { type: boolean }
        checkoutAvailable: { type: boolean }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ParticipantList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Participant" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    ReferenceStatus:
      type: string
      enum: [candidate, confirmed, merged, deprecated, rejected]
    ReferenceAliasKind:
      type: string
      enum: [spelling, translit, abbreviation, former, locale]
    ReferenceMetadata:
      type: object
      description: Свободные поля записи до 4 КиБ; directions — подсказка направлений, только массив строк.
      properties:
        directions:
          type: array
          items: { type: string }
    ReferenceAliasInput:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 120, description: Не больше 8 слов }
        kind: { $ref: "#/components/schemas/ReferenceAliasKind" }
        locale: { type: string, examples: [ru, en] }
        weight: { type: integer, minimum: 0, maximum: 100 }
    ReferenceAlias:
      type: object
      required: [id, text, key, kind, source, weight]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        key: { type: string, description: Ключ нормализации; уникален в словаре }
        kind: { $ref: "#/components/schemas/ReferenceAliasKind" }
        locale: { type: string }
        source: { type: string }
        weight: { type: integer }
    ReferenceEntry:
      type: object
      required: [id, dictionary, canonical, key, status, source, occurrences, revision, metadata, aliases, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        dictionary: { type: string }
        canonical: { type: string }
        key: { type: string }
        status: { $ref: "#/components/schemas/ReferenceStatus" }
        mergedInto: { type: string, format: uuid }
        source: { type: string, enum: [seed, operator, catalog] }
        occurrences: { type: integer, format: int64, description: Встречи ключа; ранжирует очередь кандидатов }
        revision: { type: integer, format: int64, description: Ревизия, последней менявшая запись }
        metadata: { $ref: "#/components/schemas/ReferenceMetadata" }
        aliases:
          type: array
          items: { $ref: "#/components/schemas/ReferenceAlias" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReferenceEntryResponse:
      type: object
      required: [schemaVersion, revision, entry]
      properties:
        schemaVersion: { type: integer, const: 1 }
        revision: { type: integer, format: int64, description: Голова журнала словаря }
        created: { type: boolean }
        changed: { type: boolean, description: false — повтор без новой ревизии }
        entry: { $ref: "#/components/schemas/ReferenceEntry" }
        resolved: { $ref: "#/components/schemas/ReferenceEntry" }
        alias: { $ref: "#/components/schemas/ReferenceAlias" }
    ReferenceEntryPage:
      type: object
      required: [schemaVersion, revision, total, entries]
      properties:
        schemaVersion: { type: integer, const: 1 }
        revision: { type: integer, format: int64 }
        total: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/ReferenceEntry" }
    ReferenceDiscovery:
      type: object
      required: [schemaVersion, dictionaries]
      properties:
        schemaVersion: { type: integer, const: 1 }
        dictionaries:
          type: array
          items:
            type: object
            required: [code, kind, revision]
            properties:
              code: { type: string }
              kind: { type: string, enum: [open, closed] }
              revision: { type: integer, format: int64 }
    ReferenceSnapshot:
      type: object
      required: [schemaVersion, dictionary, kind, revision, normalizer, full, entries, removed]
      properties:
        schemaVersion: { type: integer, const: 1 }
        dictionary: { type: string }
        kind: { type: string, enum: [open, closed] }
        revision: { type: integer, format: int64 }
        normalizer: { type: string, examples: [v1] }
        full: { type: boolean }
        entries:
          type: array
          items:
            type: object
            required: [id, canonical, key, status, aliases, directions, order]
            properties:
              id: { type: string, format: uuid }
              canonical: { type: string }
              directions:
                type: array
                items: { type: string }
              order: { type: integer, default: 0 }
              label: { type: string }
              key: { type: string }
              status: { $ref: "#/components/schemas/ReferenceStatus" }
              mergedInto: { type: string, format: uuid }
              aliases:
                type: array
                items:
                  type: object
                  required: [text, key, kind]
                  properties:
                    text: { type: string }
                    key: { type: string }
                    kind: { $ref: "#/components/schemas/ReferenceAliasKind" }
        removed:
          type: array
          items: { type: string, format: uuid }
    ReferenceMatch:
      type: object
      required: [entryId, canonical, aliasKey, status, scope, weight]
      properties:
        entryId: { type: string, format: uuid }
        canonical: { type: string }
        aliasKey: { type: string }
        status: { $ref: "#/components/schemas/ReferenceStatus" }
        scope: { type: string, enum: [global] }
        confidence: { type: string, enum: [exact] }
        weight: { type: number, minimum: 0, maximum: 1 }
    ReferenceResolution:
      type: object
      required: [schemaVersion, dictionary, revision, normalizer, key, candidates]
      properties:
        schemaVersion: { type: integer, const: 1 }
        dictionary: { type: string }
        revision: { type: integer, format: int64 }
        normalizer: { type: string }
        key: { type: string }
        match: { $ref: "#/components/schemas/ReferenceMatch" }
        candidates:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/ReferenceMatch" }
    ReferenceChangedEvent:
      type: object
      description: |
        Тело catalog.reference.changed (KAFKA_TOPIC_REFERENCE_CHANGED), ключ сообщения — код словаря.
        Списки обрезаются на 1000; truncated — потребитель перечитывает дельту снимка.
      required: [schemaVersion, dictionary, revisionFrom, revisionTo, entryIds, kinds, affectedKeys, truncated]
      properties:
        schemaVersion: { type: integer, const: 1 }
        dictionary: { type: string }
        revisionFrom: { type: integer, format: int64 }
        revisionTo: { type: integer, format: int64 }
        entryIds:
          type: array
          maxItems: 1000
          items: { type: string, format: uuid }
        kinds:
          type: array
          items: { type: string, enum: [alias-added, alias-removed, renamed, merged, status-changed] }
        affectedKeys:
          type: array
          maxItems: 1000
          items: { type: string }
        truncated: { type: boolean }
