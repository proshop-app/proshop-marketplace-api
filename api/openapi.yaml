        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/EventConflict'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: >-
          Необязательный ключ оператора, действующий 24 часа после успешного решения.
          Повтор для того же события, действия и тела (expectedVersion и note) возвращает
          первоначальный ответ 200, даже если событие уже изменилось. Порядок полей JSON несущественен.
          Другое тело, событие или действие с тем же ключом — 409 IDEMPOTENCY_KEY_REUSED.
          Без ключа применяется только проверка expectedVersion. Ошибки не сохраняются.
        schema:
          type: string
          minLength: 1
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - note
              - expectedVersion
              properties:
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Версия из последнего прочитанного ParkedEvent.
                note:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: После удаления пробелов заметка непустая.
      description: Только из parked при совпадении expectedVersion; устаревший запрос без сохранённого ключа — 409 с текущим event.
        Аудит автора/времени/заметки. Retry атомарно ставит outbox с версией решения и отдельным бюджетом попыток;
        queued не означает успех, после ошибки событие возвращается в parked.
  /api/v1/taxonomy/dictionary-sources:
    get:
      tags: [taxonomy]
      summary: Готовые источники строковых подсказок одной версии таксономии
      operationId: taxonomyDictionarySources
      description: >-
        Итог свёртки Attribute.dictionary, глобального правила и правил от корня к разделу.
        Только string атрибуты из схемы раздела или схем его потомков с непустым набором источников.
        Потребители используют карту вместо самостоятельной свёртки dictionary-bindings.
      parameters:
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200":
          description: Карта раздел → атрибут → словари; при отсутствии пар dictionarySources равен {}
          headers:
            ETag: { schema: { type: string }, description: 'Общая версия снимка, например "taxonomy-42"' }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyDictionarySources" }
        "304":
          description: Версия не изменилась
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
  /api/v1/taxonomy/dictionary-bindings:
    get:
      tags: [taxonomy]
      summary: Источники открытых подсказок одной версии таксономии
      operationId: taxonomyDictionaryBindings
      parameters:
        - { $ref: "#/components/parameters/TaxonomyCache" }
      responses:
        "200":
          description: Все правила; отсутствие правил представлено пустым массивом
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyDictionaryBindings" }
        "304": { description: Версия не изменилась }
  /api/v1/operator/taxonomy/dictionary-bindings/{attributeCode}:
    put:
      parameters:
        - name: attributeCode
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        - name: categoryId
          in: query
          description: Категория и её потомки; отсутствие означает глобальное правило
          schema: { type: string, pattern: '^[a-z][a-z0-9_.-]{0,127}$' }
        - name: If-Match
          in: header
          required: true
          description: 'Текущая версия: "taxonomy-5"; при конфликте автоматического повтора нет'
          schema: { type: string }
      tags: [operator]
      summary: Создать или заменить одно правило подсказок без изменения атрибутов
      operationId: operatorPutTaxonomyDictionaryBinding
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaxonomyDictionaryBindingInput" }
      responses:
        "200":
          description: Версия таксономии; семантически одинаковое правило не создаёт новую версию
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      parameters:
        - name: attributeCode
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        - name: categoryId
          in: query
          description: Категория и её потомки; отсутствие означает глобальное правило
          schema: { type: string, pattern: '^[a-z][a-z0-9_.-]{0,127}$' }
        - name: If-Match
          in: header
          required: true
          description: 'Текущая версия: "taxonomy-5"; при конфликте автоматического повтора нет'
          schema: { type: string }
      tags: [operator]
      summary: Удалить одно правило и восстановить наследование подсказок
      operationId: operatorDeleteTaxonomyDictionaryBinding
      security: [{ operatorToken: [] }, { operatorSession: [] }]
      responses:
        "200":
          description: Версия таксономии; удаление отсутствующего правила не меняет версию
          headers:
            ETag: { schema: { type: string } }
            X-Taxonomy-Version: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaxonomyVersion" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/taxonomy/categories:
    get:
      tags: [taxonomy]
