          uniqueItems: true
          items: { type: string, maxLength: 32, pattern: '^[a-z][a-z0-9_]{0,31}$' }
          description: Только существующие open словари; extend требует хотя бы один. Порядок не задаёт приоритет.
    TaxonomyDictionaryBinding:
      type: object
      additionalProperties: false
      required: [attributeCode, mode, dictionaries]
      properties:
        categoryId:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{0,127}$'
          description: Отсутствие означает глобальное правило; иначе категория и потомки
        attributeCode: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        mode: { type: string, enum: [extend, replace] }
        dictionaries:
          type: array
          maxItems: 16
          uniqueItems: true
          items: { type: string, maxLength: 32, pattern: '^[a-z][a-z0-9_]{0,31}$' }
      description: >-
        Только string атрибут, существующий в области категории. Источники разрешаются:
        Attribute.dictionary, глобальное правило, затем путь от корня к выбранной категории.
        extend — объединение, replace — замена; replace [] отключает. Дубликаты удаляются
        в порядке первого появления без семантического приоритета. Не более 16 итоговых источников.
    TaxonomyDictionarySources:
      type: object
      additionalProperties: false
      required: [version, dictionarySources]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        dictionarySources:
          type: object
          maxProperties: 4096
          description: >-
            Ключи — id разделов, вложенные ключи — коды string атрибутов из их области.
            Пустые наборы и разделы без пар отсутствуют; объект присутствует всегда.
          additionalProperties:
            type: object
            minProperties: 1
            maxProperties: 256
            additionalProperties:
              type: array
              minItems: 1
              maxItems: 16
              uniqueItems: true
              items: { type: string, maxLength: 32, pattern: '^[a-z][a-z0-9_]{0,31}$' }
              description: >-
                Порядок свёртки: словарь атрибута, глобальное правило, правила от корня к разделу;
                extend добавляет без дублей, replace заменяет. Порядок не задаёт приоритет выдачи.
    TaxonomyDictionaryBindings:
      type: object
      additionalProperties: false
      required: [version, dictionaryBindings]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        dictionaryBindings:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/TaxonomyDictionaryBinding" }
    TaxonomyDefinition:
      type: object
      additionalProperties: false
      required: [version, attributes, schemas, categories]
      properties:
        facetKeys:
          type: [array, "null"]
          readOnly: true
          description: Отсортированные коды характеристик, фильтруемых хотя бы в одном листе.
          items: { type: string }
        rootFilters:
          type: [array, "null"]
          readOnly: true
          description: Характеристики в панели выдачи без выбранной категории.
          items: { $ref: "#/components/schemas/TaxonomyFilter" }
        selectionValues: { $ref: "#/components/schemas/TaxonomySelectionValues" }
        dictionaryBindings:
          type: array
          maxItems: 4096
          items: { $ref: "#/components/schemas/TaxonomyDictionaryBinding" }
        version: { type: integer, format: int64, minimum: 0 }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/TaxonomyAttribute" }
        schemas:
          type: object
          additionalProperties: { $ref: "#/components/schemas/TaxonomySchema" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/TaxonomyCategory" }
    TaxonomyCategory:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        icon:
          type: string
          description: Имя Lucide из фиксированного набора; только у корневого узла.
          enum: [smartphone, laptop, washing-machine, cooking-pot, armchair, bed-double, shirt, footprints,
                 handbag, gem, sparkles, heart-pulse, baby, blocks, dumbbell, tent, car, wrench, paint-roller,
                 flower-2, paw-print, apple, pencil, book-open, palette, music, house, spray-can, factory]
        id: { type: string, pattern: '^[a-z][a-z0-9_.-]{0,127}$' }
        name: { type: string, minLength: 1, maxLength: 256 }
        title: { type: string, minLength: 1, maxLength: 256 }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 128 }
        schema: { type: string, description: Только у листа; ключ схемы набора }
        priorityFilters:
          type: array
          readOnly: true
          description: Итоговые приоритеты ветки. Порядок значим. Встроенные коды начинаются с @.
          items: { $ref: "#/components/schemas/TaxonomyFilter" }
        facetLayout: { $ref: "#/components/schemas/TaxonomyFacetLayout" }
        axis: { type: string, description: Ось деления узла среди его соседей }
        nameScope: { type: boolean, description: Отдельная область уникальности коротких имён в разделе аудитории }
        definition: { type: string, maxLength: 1024, description: Граница вида изделия }
        children:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/TaxonomyCategory" }
    TaxonomyAttribute:
      type: object
      additionalProperties: false
      required: [code, name, type]
      properties:
        format: { type: string, enum: [gtin, isbn], description: "Формат идентификатора независимо от кода атрибута" }
        code: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        name: { type: string, minLength: 1, maxLength: 256 }
        type: { type: string, enum: [enum, number, string, boolean] }
        dictionary:
          type: string
          maxLength: 32
          pattern: '^[a-z][a-z0-9_]{0,31}$'
          description: Для enum — closed, для string — open
        values: { type: array, items: { type: string }, readOnly: true, description: Снимок confirmed закрытого словаря }
        unit: { type: string, description: Единица только для number }
        facet:
          type: boolean
          description: В JSON-снимке true у кодов, фильтруемых хотя бы в одном листе. В исходном YAML это глобальное правило.
        displayName: { type: string, maxLength: 256, description: Короткое имя для покупателя }
        hint: { type: string, maxLength: 1024, description: Подсказка продавцу }
        dictionarySelection: { type: boolean, const: true, description: Только каноническая подтверждённая строка }
        valuesMeta: { $ref: "#/components/schemas/TaxonomyValuesMeta" }
        facetOptions:
          type: array
          readOnly: true
          description: Допустимые значения фасета в порядке показа; для attr.color — ровно 18 базовых цветов.
          items: { type: string, minLength: 1, maxLength: 1024 }
        facetValuesByValue:
          type: object
          readOnly: true
          description: >-
            Значение характеристики → значения фасета. Ключи только из values.
            Цвет без базового отсутствует в отображении; товар остаётся в выдаче,
            но не участвует в фасете attr.color и отборе по цвету.
          additionalProperties:
            type: array
            minItems: 1
            maxItems: 8
            uniqueItems: true
            items: { type: string, minLength: 1, maxLength: 1024 }
        description: { type: string, maxLength: 1024, description: Определение свойства и объекта измерения }
        dictionaryNote: { type: string, maxLength: 512, description: Причина отсутствия словаря }
        example: { type: string, maxLength: 256, description: "Пример формата, не словарное значение" }
        requiredReason: { type: string, maxLength: 512, description: Исключение для обязательного свободного текста }
        multiple: { type: boolean, const: false, description: Контракт карточки скалярный }
        variant: { type: boolean, description: Подходит для оси варианта SKU }
        deprecated: { type: boolean, description: "Исторический код, не использовать в новых схемах" }
        searchTermsByValue: { $ref: "#/components/schemas/TaxonomySearchTermsByValue" }
    TaxonomySearchTermsByValue:
      type: object
      description: >-
        Ключ — каноническое значение справочника либо строка true/false. Пустой список отключает выражения этого значения.
        Выражения без управляющих символов, с одиночными обычными пробелами;
        дубли без учёта регистра и ё/е запрещены. Это контекст поиска, не фасеты.
      additionalProperties:
        $ref: "#/components/schemas/TaxonomySearchTerms"
    TaxonomySearchTerms:
      type: array
      maxItems: 8
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 128 }
    TaxonomySelectionValues:
      type: object
      description: Подтверждённые записи каждого действующего справочника выбора по коду словаря
      additionalProperties:
        type: object
        required: [valuesMeta]
        properties:
          valuesMeta: { $ref: "#/components/schemas/TaxonomyValuesMeta" }
          searchTermsByValue: { $ref: "#/components/schemas/TaxonomySearchTermsByValue" }
    TaxonomyValuesMeta:
      type: object
      description: Метаданные по каноническому значению. В пуле выбора пустой объект подтверждает допустимое значение.
      additionalProperties: { $ref: "#/components/schemas/TaxonomyValueMeta" }
    TaxonomyValueMeta:
      type: object
      properties:
        hex: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        swatch: { type: string, enum: [multicolor, pattern] }
        secondaryLabel: { type: string, minLength: 1, maxLength: 120 }
        covers:
          type: array
          minItems: 2
          maxItems: 8
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 120 }
        order: { type: integer, description: Порядок значения в справочнике }
    TaxonomySchemaIdentity:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
        axes: { type: [array, "null"], uniqueItems: true, items: { type: string } }
        exact: { type: array, uniqueItems: true, items: { type: string } }
    TaxonomyFilter:
      type: object
      additionalProperties: false
      required: [code, primary]
      properties:
        code:
          type: string
          pattern: '^([a-z][a-z0-9_]{0,63}|@(price|inStock|seller|category))$'
        primary: { type: boolean, description: Основной фильтр }
    TaxonomyFacetLayout:
      type: object
      additionalProperties: false
      required: [primary, additional]
      properties:
        primary: { type: array, uniqueItems: true, items: { type: string } }
        additional: { type: array, uniqueItems: true, items: { type: string } }
    TaxonomyFacetOverrides:
      type: object
      propertyNames: { pattern: '^[a-z][a-z0-9_]{0,63}$' }
      additionalProperties: { type: string, enum: ["on", "off", default] }
    TaxonomySchema:
      type: object
      additionalProperties: false
      required: [attributes, filters]
      properties:
        identityWarnings: { type: boolean, description: "Наследуется; false отключает переходный режим" }
        identity: { $ref: "#/components/schemas/TaxonomySchemaIdentity" }
        attributes: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
        optional: { type: array, uniqueItems: true, items: { type: string }, description: Подмножество attributes }
        filters:
          type: array
          readOnly: true
          description: Итоговые фильтры листа в порядке показа.
          items: { $ref: "#/components/schemas/TaxonomyFilter" }
        facetOverrides: { $ref: "#/components/schemas/TaxonomyFacetOverrides" }
        facetLayout: { $ref: "#/components/schemas/TaxonomyFacetLayout" }
    TaxonomySchemaSource:
      type: object
      additionalProperties: false
      description: Исходное определение схемы; extends разворачивается сервером, abstract не выдаётся в API
      properties:
        identityWarnings: { type: boolean, description: "Наследуется; false отключает переходный режим" }
        identity: { $ref: "#/components/schemas/TaxonomySchemaIdentity" }
        extends: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        abstract: { type: boolean, default: false }
        attributes: { type: array, uniqueItems: true, items: { type: string } }
        optional: { type: array, uniqueItems: true, items: { type: string }, description: Включая унаследованные поля }
        facetOverrides: { $ref: "#/components/schemas/TaxonomyFacetOverrides" }
        facetLayout: { $ref: "#/components/schemas/TaxonomyFacetLayout" }
    TaxonomySchemaAttribute:
      type: object
      required: [code, name, type, required]
      properties:
        format: { type: string, enum: [gtin, isbn], description: "Формат идентификатора независимо от кода атрибута" }
        code: { type: string }
        name: { type: string }
        type: { type: string, enum: [enum, string, number, boolean] }
        unit: { type: string }
        dictionary: { type: string, maxLength: 32, pattern: '^[a-z][a-z0-9_]{0,31}$' }
        facet: { type: boolean, description: Фильтруемость характеристики в этом листе }
        required: { type: boolean }
        values: { type: array, items: { type: string } }
        displayName: { type: string, maxLength: 256, description: Короткое имя для покупателя }
        hint: { type: string, maxLength: 1024, description: Подсказка продавцу }
        dictionarySelection: { type: boolean, const: true, description: Только каноническая подтверждённая строка }
        valuesMeta: { $ref: "#/components/schemas/TaxonomyValuesMeta" }
        facetOptions:
          type: array
          readOnly: true
          description: Допустимые значения фасета в порядке показа; для attr.color — ровно 18 базовых цветов.
          items: { type: string, minLength: 1, maxLength: 1024 }
        facetValuesByValue:
          type: object
          readOnly: true
          description: >-
            Значение характеристики → значения фасета. Ключи только из values.
            Цвет без базового отсутствует в отображении; товар остаётся в выдаче,
            но не участвует в фасете attr.color и отборе по цвету.
          additionalProperties:
            type: array
            minItems: 1
            maxItems: 8
            uniqueItems: true
            items: { type: string, minLength: 1, maxLength: 1024 }
        description: { type: string, maxLength: 1024, description: Определение свойства и объекта измерения }
        dictionaryNote: { type: string, maxLength: 512, description: Причина отсутствия словаря }
        example: { type: string, maxLength: 256, description: "Пример формата, не словарное значение" }
        requiredReason: { type: string, maxLength: 512, description: Исключение для обязательного свободного текста }
        multiple: { type: boolean, const: false, description: Контракт карточки скалярный }
        variant: { type: boolean, description: Подходит для оси варианта SKU }
        deprecated: { type: boolean, description: "Исторический код, не использовать в новых схемах" }
        searchTermsByValue: { $ref: "#/components/schemas/TaxonomySearchTermsByValue" }
    TaxonomyCategorySchema:
      type: object
      required: [id, name, slug, attributes, filters]
      properties:
        identity: { $ref: "#/components/schemas/TaxonomySchemaIdentity" }
        id: { type: string }
        name: { type: string }
        title: { type: string }
        slug: { type: string }
        schema: { type: string }
        children: { type: array, items: { $ref: "#/components/schemas/TaxonomyCategory" } }
        filters:
          type: array
          items: { $ref: "#/components/schemas/TaxonomyFilter" }
        priorityFilters:
          type: array
          items: { $ref: "#/components/schemas/TaxonomyFilter" }
        facetLayout: { $ref: "#/components/schemas/TaxonomyFacetLayout" }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/TaxonomySchemaAttribute" }
    CanonicalAttributes:
      type: object
      additionalProperties:
        type: [string, number, boolean]
      description: Скалярные значения по кодам схемы; без массивов и null
    MarketplaceCard:
      type: object
      required: [categoryId, attributes, published]
      properties:
        categoryId: { type: string }
        attributes: { $ref: "#/components/schemas/CanonicalAttributes" }
        published: { type: boolean }
    Publication:
      type: object
      required: [version, categoryId, attributes, issues, published]
      properties:
        schema: { type: string, description: "Код схемы категории для статистики идентичности" }
        version: { type: integer, format: int64 }
        categoryId: { type: string }
        categoryName: { type: string }
        categoryPath: { type: [array, "null"], items: { type: string } }
        attributes: { $ref: "#/components/schemas/CanonicalAttributes" }
        attributeSearchTerms:
          type: object
          readOnly: true
          description: Вычисленные выражения только фактических проверенных атрибутов опубликованной карточки.
          additionalProperties: { $ref: "#/components/schemas/TaxonomySearchTerms" }
        published: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [code]
            properties:
              attribute: { type: string }
              message: { type: string }
              code:
                type: string
                enum: [taxonomy.card_missing, taxonomy.category_unknown, taxonomy.attribute_unknown,
                       taxonomy.type, taxonomy.required, taxonomy.enum_value, taxonomy.dictionary_value,
                       taxonomy.unpublished, identity_incomplete]
    Rating:
      type: [object, "null"]
      description: null при отсутствии оценок; магазин — средневзвешенное видимых предложений.
      required: [value, count]
      properties:
        value: { type: number, minimum: 0, maximum: 5, description: Балл округлён до одного знака после запятой }
        count: { type: integer, format: int64, minimum: 1 }
    ReviewPage:
      type: object
      required: [items, total]
      properties:
        total: { type: integer, minimum: 0 }
        items:
          type: array
          items:
            type: object
            required: [author, rating, text, createdAt]
            properties:
              author: { type: string, description: Имя без фамилии }
              rating: { type: integer, minimum: 1, maximum: 5 }
              text: { type: string }
              createdAt: { type: string, format: date-time }
    Facet:
      type: object
      required:
      - code
      - name
      - type
      - count
      - values
      - primary
      properties:
        primary:
          type: boolean
          description: true для основных фильтров, false для дополнительных.
        buckets:
          type: array
          maxItems: 20
          description: Только price; from/to в рублях, круглые границы движка. Без поддержки поле отсутствует.
          items:
            type: object
            required:
            - from
            - to
            - count
            properties:
              from:
                type: number
                minimum: 0
                multipleOf: 0.01
                maximum: 9999999999999.99
                description: Сумма в рублях
              to:
                type: number
                minimum: 0
                multipleOf: 0.01
                maximum: 9999999999999.99
                description: Сумма в рублях
              count:
                type: integer
                minimum: 0
        code:
          type: string
          description: category, tenant, price, inStock или attr.<код>
        name:
          type: string
        type:
          type: string
          enum:
          - enum
          - number
          - string
          - boolean
        unit:
          type: string
        count:
          type: integer
          description: Число предложений с полем до пагинации
        min:
          type: number
          description: Для price — рубли; для атрибута — его собственная единица.
        max:
          type: number
          description: Для price — рубли; для атрибута — его собственная единица.
        values:
          type: array
          maxItems: 256
          items:
            type: object
            required:
            - value
            - count
            properties:
              value:
                type: string
              count:
                type: integer
              meta: { $ref: "#/components/schemas/TaxonomyValueMeta" }
    Error:
      type: object
      required: [error]
      properties:
        weeks:
          type: array
          description: Занятые понедельники при promotion.no_capacity.
          items: {type: string, format: date}
        checkout:
          $ref: "#/components/schemas/Checkout"
          description: Новый снимок при DELIVERY_CHANGED; требуется подтверждение.
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: ["catalog.offer_not_found"] }
            message: { type: string }
    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail] }
    Seller:
      type: object
      required:
        - slug
        - name
        - delivery
      properties:
        delivery:
          $ref: '#/components/schemas/ParticipantDelivery'
        slug:
          type: string
        name:
          type: string
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
    Offer:
      description: При паре deliveryCarrier и deliveryRegion возвращает deliveryAvailable; вне зон товар виден, доставка
        недоступна.
      type: object
      required:
      - id
      - tenantId
      - productId
      - seller
      - name
      - categoryId
      - attributes
      - categories
      - price
      - basePrice
      - available
      - inStock
      - checkoutAvailable
      - updatedAt
      - rating
      properties:
        sellersCount:
          type: integer
          minimum: 1
          description: >-
            Число разных магазинов с видимым покупателю предложением того же ключа модели,
            включая магазин карточки. Варианты одного магазина считаются один раз.
            Отсутствует без ключа модели, при недоступности подсчёта или расхождении
            с поисковым индексом, когда подсчёт не нашёл видимых предложений.
        rating:
          $ref: '#/components/schemas/Rating'
        deliveryAvailable:
          type: boolean
        categoryId:
          type: string
          description: Категория площадки
        attributes:
          $ref: '#/components/schemas/CanonicalAttributes'
        attributeDetails:
          type: object
          description: Покупательские имена и метаданные по кодам характеристик. Только в карточке.
          additionalProperties:
            type: object
            required: [name]
            properties:
              name: { type: string }
              meta: { $ref: "#/components/schemas/TaxonomyValueMeta" }
        id:
          type: string
          examples:
          - t1~p1
        tenantId:
          type: string
        productId:
          type: string
        seller:
          $ref: '#/components/schemas/Seller'
        name:
          type: string
        description:
          type: string
          description: Только в карточке
        variants:
          type: object
          required: [groupId]
          properties:
            groupId:
              type: string
          description: Только в карточке; идентификатор для отдельного запроса вариантов
        image:
          type: string
        assets:
          type: array
          maxItems: 20
          uniqueItems: true
          description: 'Только в карточке товара; всегда массив. Ключи бакета без хоста и /images/, сегменты не кодированы.
            Порядок магазина, первый совпадает с image. Каждый ключ — не больше 512 байт.

            '
          items:
            type: string
            maxLength: 512
        url:
          type: string
        sku:
          type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        price:
          type: number
          description: Цена продажи в рублях
          multipleOf: 0.01
          minimum: 0
          maximum: 9999999999999.99
        basePrice:
          type: number
          description: Прайс магазина в рублях
          multipleOf: 0.01
          minimum: 0
          maximum: 9999999999999.99
        available:
          type: integer
        inStock:
          type: boolean
        checkoutAvailable:
          type: boolean
          description: Продавец принимает оплату через маркетплейс
        updatedAt:
          type: string
          format: date-time
    OfferVariants:
      type: object
      required:
      - groupId
      - options
      - items
      - truncated
      properties:
        groupId:
          type: string
        options:
          type: array
          description: Оси в порядке группы магазина
          items:
            type: object
            required: [key, code, name, values]
            properties:
              key: { type: string }
              code: { type: string }
              name: { type: string }
              values:
                description: Порядок справочника для контролируемых строк, иначе порядок появления в группе.
                type: array
                uniqueItems: true
                items: { type: string }
              valueDetails:
                type: array
                description: Те же канонические значения в том же порядке с метаданными витрины.
                items:
                  type: object
                  required: [value]
                  properties:
                    value: { type: string }
                    meta: { $ref: "#/components/schemas/TaxonomyValueMeta" }
        truncated:
          type: boolean
          description: При превышении потолка в 200 предложений текущая карточка может отсутствовать в items.
        items:
          type: array
          maxItems: 200
