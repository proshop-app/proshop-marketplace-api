        in: query
        schema:
          type: string
        description: Код перевозчика; передаётся вместе с deliveryRegion.
      - name: deliveryRegion
        in: query
        schema:
          type: string
        description: Код ISO 3166-2 RU из ПВЗ.
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
        description: Строка поиска
      - name: tenant
        in: query
        schema:
          type: string
        description: Магазин
      - name: groupId
        in: query
        schema:
          type: string
        description: Группа вариантов; требует tenant
      - name: category
        in: query
        schema:
          type: string
        description: Категория площадки с потомками
      - name: priceMin
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
        description: Копейки
      - name: priceMax
        in: query
        schema:
          type: integer
          format: int64
          minimum: 0
        description: Копейки
      - name: inStock
        in: query
        schema:
          type: boolean
      - name: sort
        in: query
        schema:
          type: string
