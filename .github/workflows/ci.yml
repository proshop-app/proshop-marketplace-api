# Линтер, юнит-тесты, интеграционные тесты на compose и сборка образа.
# Образ не публикуется: реестр и выкат подключаются вместе с кластером.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.23.2"
  TAXONOMY_BUNDLE: tmp/taxonomy/taxonomy-bundle.json

jobs:
  taxonomy-artifact:
    name: Закреплённая поставка таксономии
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: taxonomy
        run: echo "ref=$(jq -r .ref internal/infrastructure/taxonomydata/release.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: proshop-app/uno-reference-data
          ref: ${{ steps.taxonomy.outputs.ref }}
          token: ${{ secrets.UNO_REFERENCE_DATA_TOKEN || github.token }}
          path: tmp/uno-reference-data
          sparse-checkout: |
            releases
            taxonomy/reference
          persist-credentials: false
      - run: make taxonomy-artifact TAXONOMY_BUNDLE= UNO_REFERENCE_DATA_DIR=tmp/uno-reference-data
      - uses: actions/upload-artifact@v4
        with:
          name: taxonomy-bundle
          path: internal/infrastructure/taxonomydata/taxonomy-bundle.json
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: taxonomy-reference-imports
          path: tmp/uno-reference-data/taxonomy/reference
          if-no-files-found: error
          overwrite: true

  lint:
    needs: taxonomy-artifact
    name: Линтер
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: taxonomy-bundle
          path: tmp/taxonomy
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make lint

  test:
    needs: taxonomy-artifact
    name: Юнит-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: taxonomy-bundle
          path: tmp/taxonomy
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make taxonomy-artifact
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: make test

  integration:
    needs: taxonomy-artifact
    name: Интеграционные тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: taxonomy-bundle
          path: tmp/taxonomy
      - uses: actions/download-artifact@v4
        with:
          name: taxonomy-reference-imports
          path: tmp/uno-reference-data/taxonomy/reference
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Ядро для OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144
      - run: make test-integration UNO_REFERENCE_DATA_DIR=tmp/uno-reference-data
      - name: Журналы сервисов
        if: failure()
        run: docker compose logs
      - name: Уборка
        if: always()
        run: docker compose down -v

  image:
    name: Образ
    needs: [lint, test, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: taxonomy-bundle
          path: tmp/taxonomy
      - run: make image IMAGE=proshop-marketplace:${{ github.sha }}
